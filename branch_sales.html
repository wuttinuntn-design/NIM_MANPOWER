<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ยอดขายสาขา">
<title>ยอดขายสาขา</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--line:#E7EAEF;--line2:#F2F4F7;--ink:#141B26;--ink2:#5A6577;--ink3:#98A1AF;
  --brand:#1F3A5F;--brandSoft:#EEF2F7;--ok:#1E8A5A;--okSoft:#E3F4EA;--warn:#D97706;--warnSoft:#FBF1D6;--bad:#C0392B;--badSoft:#FBE3E0;
  --ab:#1F3A5F;--cc:#0E8C9A;--ccSoft:#E2F3F5;
  --r:16px;--sh:0 1px 2px rgba(20,27,38,.04),0 2px 8px rgba(20,27,38,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.ic{display:inline-block;vertical-align:-3px;flex:none}
.q{color:var(--ink3)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1760px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ttl{min-width:0}.ttl b{display:block;font-size:16px;line-height:1.2}.ttl small{color:var(--ink3);font-size:12.5px}
body.embed .logo,body.embed .ttl{display:none}
body.embed #selMon,body.embed #bRef{display:none}   /* เดือน + รีเฟรช ใช้ของระบบตารางกะ */
body.embr .top{display:none}body.embr main{padding-top:4px}
.seg{display:inline-flex;background:#F3F5F9;border:1px solid #D5DBE5;border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:9px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{background:#E6EBF3;color:var(--brand)}
.seg button.on,.seg button.on:hover{background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(31,58,95,.35)}
.seg.big button{padding:9px 22px;font-size:15.5px}
.seg.sm button{padding:5px 11px;font-size:13px}
.sp{flex:1}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:14px;max-width:100%}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
main{max-width:1760px;margin:0 auto;padding:16px 20px calc(30px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .lb{font-size:12.5px;color:var(--ink3)}
.demo{background:var(--warnSoft);color:#8a5a00;border-radius:12px;padding:9px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
@media(max-width:640px){.top-in{padding:8px 12px;gap:8px}.ttl{display:none}main{padding:12px 12px calc(30px + env(safe-area-inset-bottom))}.seg button{padding:7px 10px;font-size:13.5px}}

/* common */
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff;box-shadow:var(--sh);min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .q{font-weight:400;font-size:12.5px}
.grid{display:grid;gap:16px;margin-bottom:16px;align-items:start}
.g-21{grid-template-columns:2fr 1fr}.g-11{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.g-21,.g-11{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;box-shadow:var(--sh);min-width:0;position:relative}
.kpi>span{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi>b{display:block;font-size:26px;line-height:1.2;margin-top:4px;letter-spacing:-.3px;white-space:nowrap}.kpi>b small{font-size:13px;color:var(--ink3);font-weight:500}
.kpi .sub{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.5}
.kpi .cmp{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.chip.up{background:var(--okSoft)}.chip.dn{background:var(--badSoft)}.chip.na{background:var(--line2);color:var(--ink3);font-weight:500}
.kpi.ab{border-top:3px solid var(--ab)}.kpi.cc{border-top:3px solid var(--cc)}.kpi.tg{border-top:3px dashed var(--line)}
.kpi.main{border-top:3px solid var(--ok)}
.pbar{height:6px;border-radius:3px;background:var(--line2);margin-top:8px;overflow:hidden;display:flex}.pbar i{height:100%}
@media(max-width:420px){.kpi{padding:11px 12px}.kpi>b{font-size:20px}}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;text-align:right}
.t th{background:#F7F9FB;color:var(--ink2);font-weight:600;font-size:12.5px;position:sticky;top:0;z-index:1}
.t th.l,.t td.l{text-align:left}
.t.cp th,.t.cp td{padding:7px 6px}.t.cp .chip{padding:0 6px}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#F7F9FB}
.t td.nm{max-width:240px;overflow:hidden;text-overflow:ellipsis}
.t th.srt{cursor:pointer;user-select:none}.t th.srt.on{color:var(--brand)}
.rk{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--line2);color:var(--ink2);font-size:12px;font-weight:700;align-items:center;justify-content:center}
.rk.top{background:var(--brand);color:#fff}
.fl{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;margin-top:8px;font-size:14px;line-height:1.55}.fl i{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:12px;margin-top:1px;color:#fff}
.fl.bad{background:var(--badSoft)}.fl.bad i{background:var(--bad)}.fl.warn{background:var(--warnSoft)}.fl.warn i{background:var(--warn)}.fl.ok{background:var(--okSoft)}.fl.ok i{background:var(--ok)}
.wr{display:grid;grid-template-columns:78px 1fr 84px 52px;gap:8px;align-items:center;padding:4px 0;font-size:13.5px}.wb{height:12px;background:#F2F4F7;border-radius:6px;position:relative;overflow:hidden}.wb i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}.wr em{font-style:normal;font-size:12px;text-align:right;font-weight:600}.wr b{text-align:right}
.gp2{height:12px;background:#F2F4F7;border-radius:6px;position:relative;margin:10px 0 6px}.gp2 i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:6px}.gp2 u{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px solid #D97706;text-decoration:none}
.gk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.gk>div{background:#F7F9FB;border-radius:10px;padding:9px 11px;min-width:0}.gk span{display:block;font-size:12px;color:var(--ink3)}.gk b{display:block;font-size:19px;margin-top:2px}.gk small{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
@media(max-width:640px){.gk{grid-template-columns:1fr}.wr{grid-template-columns:64px 1fr 72px 44px}}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:860px){.cgrid{grid-template-columns:1fr}}
.cr{display:grid;grid-template-columns:minmax(90px,1.1fr) 1fr 84px 56px;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;font-size:13.5px}.cr:hover{background:#F7F9FB}.cr.sel{outline:2px solid var(--brand);outline-offset:-2px}.cr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb2{height:10px;background:#F2F4F7;border-radius:5px;position:relative}.cb2::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid #C9D0DB}.cb2 i{position:absolute;top:0;bottom:0}.cb2 i.p{background:var(--ok);border-radius:0 5px 5px 0}.cb2 i.m{background:var(--bad);border-radius:5px 0 0 5px}
.yh{fill:transparent;cursor:pointer}.yh:hover{fill:rgba(31,58,95,.06)}.yi{margin:0;padding-left:18px;font-size:14px;line-height:1.75}.yi li{margin:2px 0}.yb{height:6px;background:#F2F4F7;border-radius:3px;position:relative;margin-bottom:4px}.yb i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:3px}.yb u{position:absolute;top:0;bottom:0;border:1.5px dashed #D97706;border-radius:3px;box-sizing:border-box}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.tag.D{background:var(--brandSoft);color:var(--brand)}.tag.P{background:#F1ECFB;color:#6D3FC0}.tag.S{background:#FFF1E3;color:#B45309}
.mini{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line2);min-width:70px}.mini i{height:100%}

/* report (NIMEX441 style) */
.rp{font-size:12.5px}
.rp th{background:#EEF2F7;color:var(--brand);border-right:1px solid #fff;padding:5px 8px}
.rp thead tr:first-child th{border-bottom:1px solid #fff}
.rp td{padding:4px 8px;border-right:1px solid var(--line2)}
.rp tr.gh td{background:#F7F9FB;font-weight:700;color:var(--brand);cursor:pointer;text-align:left}
.rp tr.gt td{background:#EEF2F7;font-weight:700}
.rp tr.gg td{background:var(--brand);color:#fff;font-weight:700}
.rp td.ab{background:#F6F8FB}.rp td.cc{background:#F2FAFB}
.rp tr.gt td.ab,.rp tr.gt td.cc{background:#E4EAF2}
.rp .ex{font-size:11px;color:var(--warn);font-weight:600;margin-left:6px}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart{position:relative}.chart .cw{overflow-x:auto;scrollbar-width:thin}
@media(max-width:640px){.chart svg{min-width:680px}.hm{display:none}.t td.nm{max-width:130px}.t th,.t td{padding:7px 7px}}
.gtip{position:fixed;z-index:100;background:#141B26;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(16,24,40,.2)}
[data-tip]{cursor:help}.pbar i[data-tip]:hover,.mini[data-tip]:hover{filter:brightness(1.15)}
.chart .hit{fill:transparent;cursor:pointer}.chart .hit.on{fill:rgba(31,58,95,.05)}.chart .bar,.chart .vl{pointer-events:none}
.ctt{position:absolute;z-index:5;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(16,24,40,.14);padding:10px 12px;font-size:13px;pointer-events:none;transition:left .08s,top .08s}
.ctt .h{font-weight:700;margin-bottom:6px;color:var(--ink)}
.ctt .r{display:flex;align-items:center;gap:8px;padding:2px 0}.ctt .r span{flex:1;color:var(--ink2)}.ctt .r i{width:9px;height:9px;border-radius:3px;flex:none}
.ctt .r.t{border-top:1px solid var(--line2);margin-top:3px;padding-top:5px}.ctt .r.t span{color:var(--ink);font-weight:600}
.ctt .s{font-size:12px;color:var(--ink3);margin-top:3px}
.ctt .pv{border-top:1px dashed var(--line);margin-top:6px;padding-top:5px}
.chart text{font-family:inherit}

/* import */
.drop{border:2px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--ink2);cursor:pointer;background:#fff}
.drop.on{border-color:var(--brand);background:var(--brandSoft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{border-radius:8px;padding:6px 0;text-align:center;font-size:12.5px;background:var(--line2);color:var(--ink3)}
.cal div.h{background:none;font-weight:600;color:var(--ink2)}
.cal div.ok{background:var(--okSoft);color:var(--ok);font-weight:700}
.cal div.miss{background:var(--badSoft);color:var(--bad);font-weight:600}
.cal div.fut{background:none;border:1px dashed var(--line)}
.res{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.res:last-child{border:0}
.mtg{zoom:1.18}
.chip.wn{background:var(--warnSoft);color:#8A5A00}.brdw{display:flex;flex-wrap:wrap;gap:6px}.chip.brd{border:0;cursor:pointer;font:inherit;font-size:13px;padding:5px 10px}.mtg .chip.brd{font-size:13.5px}
.t tr.exr td{color:var(--ink3)!important;background:#F4F5F7}.t tr.exr td b{color:var(--ink3)}.exchip{font-size:10.5px;background:#E4E6EB;color:#5B6270;border-radius:8px;padding:1px 7px;margin-left:4px;font-weight:600}
.phs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ph{position:relative;width:78px;height:78px;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#fff;flex:none}.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}.ph>button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(10,10,11,.7);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0}.phadd{border:1.5px dashed var(--line2);background:#fff;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}.phbusy{display:grid;place-items:center;font-size:12px;color:var(--ink2)}.lbx{position:fixed;inset:0;background:rgba(10,10,11,.88);z-index:200;display:grid;place-items:center;padding:16px;cursor:zoom-out}.lbx img{max-width:100%;max-height:86vh;border-radius:12px;background:#fff}.lbx a{position:absolute;bottom:14px;color:#fff;font-size:13px}.nrg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.nrg label{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line2);border-radius:10px;padding:6px 10px}.nrg input{width:64px;flex:none}
.mgf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.fl{display:flex;flex-direction:column;gap:4px;min-width:0}.fl>span{font-size:12.5px;color:var(--ink2);font-weight:600}.inp{border:1px solid #D5DBE5;background:#fff;border-radius:10px;padding:8px 10px;font-size:14px;min-width:0;width:100%}.inp:focus{outline:2px solid var(--brand);outline-offset:-1px}.btn:disabled{opacity:.5;cursor:default}
.empty{padding:40px 10px;text-align:center;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:90;font-weight:600;color:var(--brand)}

/* สรุปหน้าเดียว (สไตล์สไลด์) */
.hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 14px}
.hd .l{font-size:14px;font-weight:600;color:var(--ink2)}
.hd .v{font-size:44px;font-weight:700;line-height:1.1;color:var(--brand);letter-spacing:-.5px}
.hd .u{font-size:16px;font-weight:600;color:var(--ink2)}
.hd .s{flex-basis:100%;font-size:12.5px;color:var(--ink3)}
.pn4{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media(max-width:1250px){.pn4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.pn4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.pn4{grid-template-columns:1fr}.hd .v{font-size:36px}}
.pn{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff;box-shadow:var(--sh);min-width:0}
.pn h4{margin:0;font-size:16px}.pn .sb{font-size:12.5px;color:var(--ink3);margin:1px 0 4px}
.pn .rw{margin-top:14px}
.pn .rt{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600}
.pn .rv{display:flex;align-items:baseline;gap:8px;margin-top:1px}
.pn .rv b{font-size:clamp(22px,1.9vw,28px);line-height:1.15;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.pn .rv span{font-size:13px;color:var(--ink3)}
.pn .rb{height:7px;border-radius:4px;background:var(--line2);margin-top:5px;overflow:hidden}.pn .rb i{display:block;height:100%;border-radius:4px}
.pn .nt{font-size:12px;color:var(--ink3);margin-top:3px}
.gp{font-size:13px;font-weight:700}.gp.up{color:var(--ok)}.gp.dn{color:var(--bad)}.gp.na{color:var(--ink3);font-weight:500}
.ft2{font-size:12.5px;color:var(--ink2);margin:-4px 0 16px;line-height:1.6}

.pn.mc{padding:16px 18px}
.mcb{display:flex;align-items:flex-end;gap:clamp(3px,.5vw,8px);height:200px;border-bottom:2px solid var(--line);margin-top:10px}
.mcb>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:help}
.mcb .v{font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:3px;white-space:nowrap}
.mcb .on .v{color:var(--ink)}
.mcb{position:relative}.mcb>.pyl{position:absolute;inset:0;flex:none;height:auto;display:block;pointer-events:none;cursor:default}.mcb .pyl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.mcb .pyl i{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #7C3AED;transform:translate(-50%,50%);box-sizing:border-box}.mcb .b{width:100%;max-width:46px;opacity:.4}.mcb .on .b{opacity:1}
.mcl{display:flex;gap:clamp(3px,.5vw,8px);margin-top:5px}.mcl span{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--ink3);white-space:nowrap}
.pn4>.mc{grid-column:1/-1}
@media(min-width:1360px){.pn4{grid-template-columns:1.7fr repeat(5,minmax(0,1fr))}.pn4>.mc{grid-column:auto}}
@media(max-width:560px){.pn4>.mc{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo" id="logo"></div>
  <div class="ttl"><b>ยอดขายสาขา</b><small id="sub">AB + CC · NIM Express</small></div>
  <div class="seg" id="nav"></div>
  <div class="sp"></div>
  <select class="sel" id="selMon" aria-label="เลือกเดือน"></select>
  <button class="ibtn" id="bShare" title="แชร์รายงานสรุป"></button>
  <button class="ibtn" id="bRef" title="รีเฟรช"></button>
</div></header>
<main id="app"></main>
<div id="ver" style="text-align:center;font-size:11px;color:#98A1AF;padding:0 0 16px"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================
   ยอดขายสาขา v1 · 2026-10-27
   แหล่งข้อมูล: รายงาน NIMEX441 (สรุปรายได้ NimExpress) วันละ 1 ไฟล์

/* ---------- daily chart ---------- */
const CHD={};let chId=0;   // ข้อมูลกราฟสำหรับ tooltip
const fmtK=v=>v>=1e6?(v/1e6).toFixed(v>=1e7?1:2)+'M':v>=1e3?Math.round(v/1e3)+'K':String(Math.round(v));
function dayChart(ym,codes,sc,h=210,arr){
  const D=arr?arr.D:byDay(ym,codes,sc),P=arr?arr.P:byDay(prevYm(ym),codes,sc),n=D.length,W=760,H=h,pl=46,pr=8,pt=24,pb=34,iw=W-pl-pr,ih=H-pt-pb,bw=iw/n,id='ch'+(++chId);
  CHD[id]={ym,D,P};
  const mx=Math.max(1,...D.map(a=>a?FR(a):0),...P.map(a=>a?FR(a):0));const st=niceStep(mx/4),top=Math.ceil(mx/st)*st,y=v=>pt+ih-v/top*ih;
  let g='',hit='',lab='';for(let v=0;v<=top+1e-6;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#F2F4F7"/><text x="${pl-6}" y="${y(v)+4}" font-size="10.5" fill="#98A1AF" text-anchor="end">${v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'K':v}</text>`;
  D.forEach((a,i)=>{const x=pl+i*bw+bw*.16,w=bw*.68,ds=ym+'-'+String(i+1).padStart(2,'0'),we=[0,6].includes(wday(ds));
    hit+=`<rect class="hit" data-ch="${id}" data-i="${i}" x="${pl+i*bw}" y="${pt-18}" width="${bw}" height="${ih+18}" rx="4"/>`;
    if(a){const ab=AB(a),cc=CC(a);g+=`<rect class="bar" x="${x}" y="${y(ab+cc)}" width="${w}" height="${Math.max(0,y(cc)-y(ab+cc))}" fill="#1F3A5F" rx="2"/><rect class="bar" x="${x}" y="${y(cc)}" width="${w}" height="${pt+ih-y(cc)}" fill="#0E8C9A" rx="2"/>`;
      lab+=`<text class="vl" x="${x+w/2}" y="${y(ab+cc)-4}" font-size="${n>28?8.6:9.5}" text-anchor="middle" fill="#5A6577">${fmtK(ab+cc)}</text>`}
    else g+=`<rect x="${x}" y="${pt+ih-3}" width="${w}" height="3" fill="#E7EAEF" rx="1"/>`;
    g+=`<text x="${x+w/2}" y="${H-pb+14}" font-size="10" text-anchor="middle" fill="${we?'#C0392B':'#98A1AF'}">${i+1}</text>`});
  const pp=P.map((a,i)=>a&&i<n?[pl+i*bw+bw/2,y(FR(a))]:null).filter(Boolean);
  if(pp.length>1)g+=`<polyline points="${pp.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="4 3" pointer-events="none"/>`;
  pp.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="#D97706" pointer-events="none"/>`);
  return`<div class="chart" id="${id}"><div class="cw"><svg viewBox="0 0 ${W} ${H}">${hit}${g}${lab}</svg></div><div class="ctt hidden"></div></div><div class="lg" style="margin-top:6px"><span><i style="background:var(--ab)"></i>AB</span><span><i style="background:var(--cc)"></i>CC</span><span><i style="background:#D97706;height:2px;width:14px"></i>เดือนก่อน (วันที่เดียวกัน)</span><span><i style="background:var(--line)"></i>ยังไม่มีไฟล์</span><span style="color:var(--bad)">ตัวเลขแดง = เสาร์–อาทิตย์</span><span class="q">ชี้ / แตะแท่งเพื่อดูรายละเอียด</span></div>`}
/* tooltip ทั่วไป: ใส่ data-tip ที่ element ใดก็ได้ */

function tipAt(el,x,y){TIP.textContent=el.dataset.tip;TIP.classList.remove('hidden');const w=TIP.offsetWidth,h=TIP.offsetHeight;TIP.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px';TIP.style.top=(y-h-12<6?y+16:y-h-12)+'px'}

function chartTip(el){const c=CHD[el.dataset.ch];if(!c)return;const i=+el.dataset.i,box=el.closest('.chart'),tt=box.querySelector('.ctt');

  tt.innerHTML=`<div class="h">${TH_WD[wday(ds)]}. ${dLb(ds)} ${+c.ym.slice(0,4)+543}</div>`+(a?row('#1F3A5F','AB',fmt(AB(a)))+row('#0E8C9A','CC',fmt(CC(a)))+row('','รวม AB+CC',fmt(FR(a)),'t')+

  tt.classList.remove('hidden');

  /* วางข้างแท่ง (ไม่บังแท่ง): ครึ่งซ้ายของกราฟ → ขวาของแท่ง · ครึ่งขวา → ซ้ายของแท่ง */
  const cx=er.left-br.left+er.width/2;let left=cx<br.width/2?er.right-br.left+8:er.left-br.left-tw-8;left=Math.max(4,Math.min(br.width-tw-4,left));
  const top=Math.max(4,Math.min(br.height-th-4,er.top-br.top+4));
  tt.style.left=left+'px';tt.style.top=top+'px'}
document.addEventListener('mouseover',e=>{const h=e.target.closest&&e.target.closest('.chart .hit');if(h)chartTip(h)});
document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('.chart .hit');if(h){chartTip(h);return}document.querySelectorAll('.chart .ctt').forEach(t=>t.classList.add('hidden'));document.querySelectorAll('.chart .hit.on').forEach(x=>x.classList.remove('on'))});
document.addEventListener('mouseout',e=>{const b=e.target.closest&&e.target.closest('.chart');if(b&&!b.contains(e.relatedTarget)){b.querySelector('.ctt').classList.add('hidden');b.querySelectorAll('.hit.on').forEach(x=>x.classList.remove('on'))}});
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),m=x/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}

/* ---- เทียบปีก่อน: จัดยอดทุกปีตามโครงสร้างสาขาปัจจุบัน (จุดขายย้ายสังกัด → ตามชื่อ · DC ที่ยุบ → ตาม S_MAP) ---- */
function mkRm(){const NCm={},Y=(S.ym||months().slice(-1)[0]||'').slice(0,4),Mx=YRD[Y],set=new Set(),ALc=allIn();
  const ab=rows=>rows.forEach(r=>{if(r[1]!=='D')NCm[nShop(r[2])]=r[0]});
  if(Mx)Object.keys(Mx).sort().forEach(m=>ab(Mx[m].rows));Object.keys(DATA).sort().forEach(k=>ab(DATA[k].rows));
  const f=r=>{if(r[1]!=='D'){const c=NCm[nShop(r[2])];if(c&&c!==r[0]){set.add(r[0]);return[c,r[1],r[2],r[3]]}}
    if(!ALc.includes(r[0])||r[1]==='D'){const mp=MAPS.find(x=>x.from_code===r[0]&&(!x.from_sub||nShop(x.from_sub)===nShop(r[2])));
      if(mp&&mp.to_code!==r[0]){set.add(r[0]);return r[1]==='D'?[mp.to_code,/^drop/i.test(mp.to_sub)?'P':'S',mp.to_sub,r[3]]:[mp.to_code,r[1],r[2],r[3]]}}
    return r};f.set=set;return f}
function pyRows(ym,rm){const PY=String(+ym.slice(0,4)-1),M2=yearData(PY);if(!M2)return null;const mm=PY+ym.slice(4),o=M2[mm];if(!o||!o.d)return null;return{n:daysIn(mm),rows:o.rows.map(rm)}}
const MC={},MCP={};
function monthChart(P,codes,gpTx){
  const yr=P.ym.slice(0,4),L=Array.from({length:+P.ym.slice(5)},(_,i)=>yr+'-'+String(i+1).padStart(2,'0'));   // ม.ค. ถึงเดือนที่เลือก (ครบปี)
  const fromData=m=>{const ks=Object.keys(DATA).filter(k=>k.startsWith(m));if(!ks.length)return null;const o=[];ks.forEach(k=>DATA[k].rows.forEach(r=>{const v=r[3];o.push([String(r[0]),r[1],FR(v)-CC(v),CC(v)])}));return o};
  L.forEach(m=>{if(m===P.ym||m===prevYm(P.ym))return;if(MC[m]||MCP[m])return;MCP[m]=1;
    apiGet({action:'month',ym:m}).then(d=>{const o=[];Object.keys(d.days||{}).filter(ds=>ds.startsWith(m)).forEach(ds=>d.days[ds].forEach(r=>{const v=dec(r[2]);o.push([String(r[0]),r[1],FR(v)-CC(v),CC(v)])}));MC[m]=o;render(true)}).catch(()=>{MC[m]=[]})});
  const val=m=>{const o=(m===P.ym||m===prevYm(P.ym))?fromData(m):MC[m];if(!o)return null;let ab=0,cc=0;o.forEach(r=>{if(codes&&!codes.includes(r[0]))return;if(!inScope(r[1],S.sc))return;ab+=r[2];cc+=r[3]});return{ab,cc,t:ab+cc}};

  const V=L.map(val),done=V.filter(Boolean),mx=Math.max(1,...done.map(x=>x.t),...PYV.filter(x=>x!=null)),BIGM=mx>=10e6,f=x=>BIGM?(x/1e6).toFixed(0):fmtK(x);

    if(!v)return`<div><div class="v">…</div></div>`;

    return`<div class="${on?'on':''}" data-tip="${TH_MON[+m.slice(5)-1]} ${+m.slice(0,4)+543}${part?' (MTD)':''} · AB ${fmt(v.ab)} · CC ${fmt(v.cc)} · รวม ${fmt(v.t)}${PYV[i]!=null?` · ปีก่อน ${fmt(PYV[i])}${PYV[i]?' ('+(v.t>=PYV[i]?'+':'−')+Math.abs((v.t/PYV[i]-1)*100).toFixed(1)+'%)':''}`:''}"><div class="v">${v.t?f(v.t):'–'}</div><div class="b" style="height:${h2}px;background:var(--cc);border-radius:5px 5px 0 0"></div><div class="b" style="height:${h1}px;background:var(--ab)"></div></div>`}).join('');
  const nn=L.length,pyPts=PYV.map((x,i)=>x==null?null:[(i+.5)/nn*100,200-190*0.84*x/mx]),pyPath=pyPts.filter(Boolean).map(p=>p.join(',')).join(' ');

function mgReview(sc){
  const F=MG.form,r=F.rec,m=MG.meta,td=mgToday(),W=[],E=[],sub=sc.sub||r.sub;
  if(!sub)E.push('เลือกจุดขาย');
  if(F.kind==='cust'){
    const cc=String(r.cust_code||'').trim(),nego=r.stage==='nego';
    if(!cc)W.push('ยังไม่ได้ใส่รหัสลูกค้า — บันทึกได้ แต่ควรใส่ภายหลังเพื่อให้ติดตามยอดต่อเดือนและตรวจรหัสซ้ำได้');
    if(nego){
      if(!(+r.est_amt>0))W.push('ยังไม่ได้ใส่ยอดประมาณการต่อเดือน');
      if(!r.nego_result)W.push('ยังไม่ได้ระบุผลการเจรจา');
      if(r.nego_result==='ไม่สำเร็จ'&&!r.gap_reason)W.push('ผลการเจรจา "ไม่สำเร็จ" แต่ยังไม่ได้ระบุเหตุผล');
    }else{
      if(!r.start_ym)W.push('ยังไม่ได้เลือกเดือนที่เริ่ม/กลับมา — ยอดจะยังไม่ถูกนับในสรุป');else if(r.start_ym>td.slice(0,7))W.push('เดือนที่เริ่มเป็นอนาคต — ตรวจอีกครั้ง');
      if(!(+r.amt0>0))W.push('ยังไม่ได้ใส่ยอดของเดือนที่เริ่ม');
      if(r.type==='new'&&r.start_ym&&(new Date(td)-new Date(r.start_ym+'-01'))/864e5>92)W.push('เลือก "ลูกค้าใหม่" แต่เริ่มใช้บริการมาแล้วเกิน 3 เดือน — เป็นลูกค้าใหม่จริงหรือไม่');
      if(+r.amt0>500000)W.push('ยอดเดือนแรกสูงผิดปกติ ('+fmt(+r.amt0)+' บาท) — ตรวจจำนวนเงิน');
      if(r.extra.some(x=>x.ym&&r.start_ym&&x.ym<r.start_ym))W.push('มีเดือนถัดไปที่เร็วกว่าเดือนที่เริ่ม');
      if(r.extra.some(x=>(x.ym&&!(+x.amt>0))||(!x.ym&&+x.amt>0)))W.push('มีแถวเดือนถัดไปที่กรอกไม่ครบ (จะไม่ถูกบันทึก)');
    }
    if(r.type==='return'&&!nego&&!r.gap_reason)W.push('ยังไม่ได้ระบุเหตุผลที่ลูกค้าหายไป');
    if(r.type==='return'&&!nego&&!r.moved_to)W.push('ยังไม่ได้ระบุว่าลูกค้าเคยย้ายไปใช้ขนส่งเจ้าไหน');
    if(cc&&/\s/.test(cc))W.push('รหัสลูกค้ามีช่องว่าง — ตรวจว่าพิมพ์ถูกต้อง');
    if(cc&&m.codeRe){try{if(!new RegExp(m.codeRe).test(cc))W.push('รูปแบบรหัสลูกค้าไม่ตรงกับที่ระบบกำหนด — ตรวจอีกครั้ง')}catch(e){}}
    if(!r.abcc||!r.product)W.push('ยังไม่ได้เลือก '+[!r.abcc?'AB/CC':'',!r.product?'ชนิดสินค้า':''].filter(Boolean).join(' และ '));
  }else if(F.kind==='fb'){
    if(!r.ftype)E.push('เลือกประเภทเรื่องที่แจ้ง');
    if(!String(r.detail||'').trim())E.push('กรอกรายละเอียดเรื่องที่แจ้ง');
    if(!r.topic)W.push('ยังไม่ได้เลือกหมวด');
  }else{
    if(!r.method)W.push('ยังไม่ได้เลือกวิธีดำเนินการ');
    const q=+r.qty||0,sm=(+r.r_won||0)+(+r.r_int||0)+(+r.r_no||0)+(+r.r_unreach||0);
    if(!q)W.push('ยังไม่ได้ระบุจำนวนที่ทำ — ระบบจะนับเป็น 1 '+mgUnit(r.method));
    if(q&&sm>q)W.push('ผลรวมที่ได้ ('+sm+') มากกว่าจำนวนที่ทำ ('+q+') — ตรวจอีกครั้ง');
    if(q&&!sm)W.push('ยังไม่ได้ระบุผลที่ได้ (ข้ามได้ถ้ายังไม่มีผล)');
    const ns=Object.values(r.nr||{}).reduce((a,v)=>a+(+v||0),0);
    if(+r.r_no>0&&!ns)W.push('มีลูกค้าไม่สนใจ '+(+r.r_no)+' ราย แต่ยังไม่ได้ระบุสาเหตุ — ระบุแล้วทีมจะเห็นว่าควรแก้อะไร');
    if(ns>(+r.r_no||0))W.push('จำนวนที่ระบุสาเหตุ ('+ns+') มากกว่าลูกค้าที่ไม่สนใจ ('+(+r.r_no||0)+') — ระบบจะตัดส่วนเกินออก');
  }
  if(r.event_date&&r.event_date<td)W.push('บันทึกย้อนหลัง (วันที่ '+dLb(r.event_date)+') — ระบบจะเก็บวันที่กรอกจริงไว้ด้วย');
  return{W,E}}
function mgRevPanel(sc){

     <div>${tg&&tg.t?`<small>ทำได้ของเป้าเดือน</small><b>${(t/tg.t*100).toFixed(1)}%</b><span>เป้า ${fmt(tg.t)} บาท</span>`:`<small>เฉลี่ย/วัน vs ด.ก่อนทั้งเดือน</small>${(()=>{const g=K.avg&&K.pavg?K.pg(K.avg,K.pavg):null;return`<b class="${g==null?'':g>=0?'up':'dn'}">${g==null?'–':(g>=0?'▲ ':'▼ ')+Math.abs(g).toFixed(1)+'%'}</b>`})()}<span>${K.pavg?fmt(K.pavg)+' บาท/วัน':'ไม่มีข้อมูล'}</span>`}</div></div></div>
   <div class="bar2"><i style="width:${abp}%;background:#1F3A5F">${abp>12?'แห้ง AB '+(abp).toFixed(0)+'%':''}</i><i style="width:${100-abp}%;background:#0E8C9A">${100-abp>12?'เย็น CC '+(100-abp).toFixed(0)+'%':''}</i></div>
   <div class="lg"><span><i style="background:#1F3A5F"></i>แห้ง AB ${fmt(ab)} บาท</span><span><i style="background:#0E8C9A"></i>เย็น CC ${fmt(cc)} บาท</span></div>
   <h3>เปรียบเทียบ<small>ตัวเลขเดือนนี้ เทียบกับฐานต่าง ๆ</small></h3><table><thead><tr><th>ตัวชี้วัด</th><th class="r2">เดือนนี้</th><th class="r2">ฐานเทียบ</th><th class="r2">ผลต่าง</th></tr></thead><tbody>${cmpRows}</tbody></table>
   <h3>ยอดขายรายวัน<small>${monLb(P.ym)} · แห้ง AB (น้ำเงิน) + เย็น CC (เขียว)</small></h3><div class="cols">${cols}</div><div class="dl">${dl}</div>
   <h3>แยกตามประเภทจุดขาย<small>สะสม · เทียบเดือนก่อน</small></h3><table><thead><tr><th>ประเภท</th><th class="r2">AB+CC</th><th class="r2">สัดส่วน</th><th class="r2">± ด.ก่อน</th></tr></thead><tbody>${grp}</tbody></table>
   <h3>แยกตามภาค<small>5 ภาคแรกตามยอด</small></h3><table><thead><tr><th>ภาค</th><th class="r2">AB+CC</th><th class="r2">± ด.ก่อน</th></tr></thead><tbody>${reg||'<tr><td colspan="3">ไม่มีข้อมูล</td></tr>'}</tbody></table>${shFoot(D,1)}</div>`;
  const top=D.rows.slice(0,8).map((r,i)=>`<tr><td><span class="rk ${i<3?'t':''}">${i+1}</span><b>${esc(r.c)}</b> <small>${esc(nm(r.c).replace(/^\d+\s*/,''))}</small></td><td class="r2"><b>${fmt(r.t)}</b></td><td class="r2">${r.g==null?'–':shG(r.g)}</td></tr>`).join('');
  const lst=(a,cls)=>a.length?a.map(r=>`<tr><td><b>${esc(r.c)}</b> <small>${esc(nm(r.c).replace(/^\d+\s*/,''))}</small></td><td class="r2 ${cls}"><b>${r.d>0?'+':'−'}${fmt(Math.abs(r.d))}</b></td><td class="r2">${shG(r.g)}</td></tr>`).join(''):'<tr><td colspan="3"><small>ไม่มี</small></td></tr>';
  const p2=`<div class="shp">${shHead(D,'อันดับสาขา')}
   <h3>ยอดขายสะสมสูงสุด 8 อันดับ<small>${D.rows.length} สาขา · เทียบเดือนก่อนช่วงวันเดียวกัน</small></h3><table><thead><tr><th>สาขา</th><th class="r2">AB+CC</th><th class="r2">± ด.ก่อน</th></tr></thead><tbody>${top}</tbody></table>
   ${D.P.pHas?`<div class="two"><div><h3>ยอดเพิ่มขึ้นมากสุด<small>บาท · 5 สาขา</small></h3><table><thead><tr><th>สาขา</th><th class="r2">เพิ่ม</th><th class="r2">%</th></tr></thead><tbody>${lst(D.up,'up')}</tbody></table></div>
    <div><h3>ยอดลดลงมากสุด<small>บาท · 5 สาขา ที่ควรดู</small></h3><table><thead><tr><th>สาขา</th><th class="r2">ลด</th><th class="r2">%</th></tr></thead><tbody>${lst(D.dn,'dn')}</tbody></table></div></div>`:'<div class="note">ยังไม่มีข้อมูลเดือนก่อนให้เทียบ</div>'}
   ${shMg(D)}
   <div class="note">ยอดสะสม 1–${P.u} ${TH_MON[+P.ym.slice(5)-1]} เทียบ 1–${P.pu} ${TH_MON[+P.pv.slice(5)-1]} · ไม่รวมสาขาที่ไม่จัดอันดับ (${EXCL.join(', ')}) ในตารางอันดับ แต่รวมในยอดรวมด้านหน้า${D.yoy&&D.yoy.remap?` · เทียบปีก่อนจัดตามโครงสร้างสาขาปัจจุบัน`:''}</div>${shFoot(D,2)}</div>`;
  return[p1,p2]}
function shMg(D){const m=D.mg;if(!m||!m.has)return`<h3>ผลการจัดการของสาขา<small>${monLb(D.P.ym)}</small></h3><div class="note">เดือนนี้ยังไม่มีสาขาบันทึกการดันยอด</div>`;
  const T=m.T,top=m.bl.slice(0,6).map(g=>`<tr><td><b>${esc(g.c)}</b> <small>${esc(nm(g.c).replace(/^\d+\s*/,''))}</small></td><td class="r2">${g.ng||'–'}</td><td class="r2">${g.nw||'–'}</td><td class="r2">${g.rt||'–'}</td><td class="r2">${g.a||'–'}</td><td class="r2">${g.amt?fmt(g.amt):'–'}</td></tr>`).join('');
  const L=(k,v)=>Object.keys(v).length?`<div style="margin-bottom:3px"><b>${k}</b> ${esc(mgTop(v))}</div>`:'';
  return`<h3>ผลการจัดการของสาขา<small>${monLb(D.P.ym)} · ${m.nb} จาก ${m.all} สาขาบันทึกแล้ว</small></h3>
   <div class="two" style="margin-bottom:6px"><div><table><tbody><tr><td>กำลังเจรจา</td><td class="r2"><b>${fmt(T.ng)}</b> ราย${T.est?' <small>ประมาณ '+fmt(T.est)+'/เดือน</small>':''}</td></tr><tr><td>ได้ลูกค้าใหม่ / เดิมกลับมา</td><td class="r2"><b>${fmt(T.nw)}</b> / <b>${fmt(T.rt)}</b> ราย</td></tr><tr><td>ยอดที่ได้ (เดือนแรก)</td><td class="r2"><b>${fmt(T.amt)}</b> บาท</td></tr></tbody></table></div>
   <div style="font-size:11px;line-height:1.5;color:#3B4556">${L('วิธีที่ใช้:',m.meth)}${L('กิจกรรม:',Object.keys(m.AM).length?{[mgActTx(m.AM)]:''}:{})}${L('ไม่สนใจเพราะ:',m.NR)}${L('ลูกค้าหาย:',m.rsn)}${m.fo?`<div><b>เสียงจากสาขา:</b> ค้าง ${m.fo} เรื่อง${m.fu?' (ด่วน '+m.fu+')':''}${Object.keys(m.ft).length?' · '+esc(mgTop(m.ft)):''}</div>`:''}</div></div>
   <table><thead><tr><th>สาขาที่ทำมากสุด</th><th class="r2">เจรจา</th><th class="r2">ใหม่</th><th class="r2">เดิมกลับ</th><th class="r2">กิจกรรม</th><th class="r2">ยอดที่ได้</th></tr></thead><tbody>${top}</tbody></table>`}
function shText(D){const P=D.P,t=FR(D.cur),gp=D.pc(t,FR(D.prv)),K=D.K,a=x=>x==null?'':(x>=0?'▲':'▼')+Math.abs(x).toFixed(0)+'%',mo=TH_MON[+P.ym.slice(5)-1],n5=r=>r.c+' '+nm(r.c).replace(/^\d+\s*/,''),k=v=>(Math.abs(v)/1000).toFixed(0)+'k';
  const L=['ยอดขาย NIM Express'+(D.scLbl&&D.scLbl!=='ทุกสาขา'?' · '+D.scLbl:'')+' · สะสม 1–'+P.u+' '+mo,
   fmtM(t)+' บาท'+(gp==null?'':' '+a(gp)+' เทียบ ด.ก่อนช่วงเดียวกัน')];
  const f=[];if(K.avg&&K.py)f.push('เฉลี่ย/วัน vs '+K.py.lb+' '+a(K.pg(K.avg,K.py.t/K.py.n)));else if(K.avg&&K.pavg)f.push('เฉลี่ย/วัน vs ด.ก่อน '+a(K.pg(K.avg,K.pavg)));if(D.tg&&D.tg.t)f.push('ทำได้ '+(t/D.tg.t*100).toFixed(0)+'% ของเป้าเดือน');if(f.length)L.push(f.join(' · '));
  if(D.up[0]||D.dn.length)L.push((D.up[0]?'ดี: '+n5(D.up[0])+' +'+k(D.up[0].d):'')+(D.dn.length?(D.up[0]?' · ':'')+'ต้องดู: '+D.dn.slice(0,2).map(r=>n5(r)+' −'+k(r.d)).join(', '):''));
  if(D.mg&&D.mg.has){const m=D.mg,T=m.T;L.push('จัดการ: เจรจา '+T.ng+' · ใหม่ '+T.nw+(m.fo?' · เรื่องค้าง '+m.fo:'')+' ('+m.nb+'/'+m.all+' สาขาบันทึก)')}
  L.push('ดูรายละเอียดในระบบ: https://wuttinuntn-design.github.io/NIM_MANPOWER/');return L.join('\n')}
async function shPng(pages){const h2c=await shLoad();try{await document.fonts.ready}catch(e){}
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;z-index:-1';host.innerHTML=`<style>${SH_CSS}</style>`+pages.join('');document.body.appendChild(host);
  const out=[];try{for(const el of host.querySelectorAll('.shp')){const cv=await h2c(el,{scale:2,backgroundColor:'#fff',useCORS:true});const blob=await new Promise(r=>cv.toBlob(r,'image/png'));out.push({blob,url:URL.createObjectURL(blob)})}}finally{host.remove()}return out}
const shDl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
async function shOpen(){
  if(!S.ym){toast('ยังไม่มีข้อมูลยอดขาย');return}
  const ov=document.createElement('div');ov.className='shov';ov.innerHTML=`<div class="shbx"><div class="shtp"><h3>${ic('share',18)} แชร์รายงานสรุปยอดขาย</h3><button class="ibtn" id="shX" aria-label="ปิด">✕</button></div><div id="shBody"><div class="q" style="padding:30px 0;text-align:center">กำลังสร้างรายงาน…</div></div><div id="shAct" class="shac" style="display:none"></div></div>`;
  document.body.appendChild(ov);const close=()=>{ov.remove();(ov._u||[]).forEach(u=>URL.revokeObjectURL(u))};ov.onclick=e=>{if(e.target===ov)close()};ov.querySelector('#shX').onclick=close;
  try{const D=await shData(),txt=shText(D),imgs=await shPng(shPages(D));ov._u=imgs.map(x=>x.url);
    const base='ยอดขาย_'+D.P.ym+'_'+(S.reg||S.area||'all'),files=imgs.map((x,i)=>new File([x.blob],base+'_หน้า'+(i+1)+'.png',{type:'image/png'}));
    $('shBody').innerHTML=`<div class="shpv">${imgs.map((x,i)=>`<a href="${x.url}" target="_blank"><img src="${x.url}" title="หน้า ${i+1}" alt="หน้า ${i+1}"></a>`).join('')}</div><div class="q" style="margin:4px 0">ข้อความสรุป (แก้ไขได้ก่อนส่ง)</div><textarea id="shTxt" class="inp" rows="6" style="width:100%">${esc(txt)}</textarea>`;
    $('shAct').style.display='flex';$('shAct').innerHTML=`<button class="btn" id="shCp">คัดลอกข้อความ</button><button class="btn" id="shPng">ดาวน์โหลด PNG (${imgs.length} หน้า)</button><button class="btn pri" id="shSend">${ic('share',14)} แชร์เข้า LINE</button>`;
    $('shCp').onclick=async()=>{try{await navigator.clipboard.writeText($('shTxt').value);toast('คัดลอกข้อความแล้ว')}catch(e){$('shTxt').select();document.execCommand('copy');toast('คัดลอกข้อความแล้ว')}};
    $('shPng').onclick=async()=>{for(const f of files){shDl(f,f.name);await new Promise(r=>setTimeout(r,350))}toast('ดาวน์โหลดรูปแล้ว')};
    $('shSend').onclick=async()=>{const t=$('shTxt').value;try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text:t,title:'สรุปยอดขาย'})}else if(navigator.share){await navigator.share({text:t,title:'สรุปยอดขาย'});toast('เครื่องนี้แนบรูปไม่ได้ · แชร์เฉพาะข้อความ กดดาวน์โหลด PNG ไปแนบเอง')}else{await navigator.clipboard.writeText(t);toast('คัดลอกข้อความแล้ว · ดาวน์โหลด PNG ไปแนบใน LINE')}}catch(e){if(e&&e.name!=='AbortError')toast('แชร์ไม่สำเร็จ · ใช้ปุ่มดาวน์โหลดแทน')}}}
  catch(e){$('shBody').innerHTML=`<div class="card empty">สร้างรายงานไม่ได้ (${esc(e.message)})</div>`}}
$('bShare').innerHTML=ic('share',17);$('bShare').onclick=shOpen;
const _st=document.createElement('style');_st.textContent=`.shov{position:fixed;inset:0;background:rgba(10,10,11,.45);z-index:90;display:grid;place-items:center;padding:16px}.shbx{background:#fff;border-radius:20px;width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;padding:0;overflow:hidden}.shtp{display:flex;align-items:center;gap:10px;padding:14px 16px 10px 20px}.shtp h3{margin:0;flex:1;font-size:18px;display:flex;align-items:center;gap:8px}#shBody{padding:0 20px;overflow:auto}.shpv{display:flex;gap:10px;overflow:auto;padding:6px 0 10px}.shpv img{height:190px;border:1px solid #E6EAF0;border-radius:8px;display:block}.shac{gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px 16px;border-top:1px solid #EEF1F5}@media(max-width:600px){.shac .btn{flex:1}}`;document.head.appendChild(_st);
</script>
