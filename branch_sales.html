<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ยอดขายสาขา">
<title>ยอดขายสาขา</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--line:#E7EAEF;--line2:#F2F4F7;--ink:#141B26;--ink2:#5A6577;--ink3:#98A1AF;
  --brand:#1F3A5F;--brandSoft:#EEF2F7;--ok:#1E8A5A;--okSoft:#E3F4EA;--warn:#D97706;--warnSoft:#FBF1D6;--bad:#C0392B;--badSoft:#FBE3E0;
  --ab:#1F3A5F;--cc:#0E8C9A;--ccSoft:#E2F3F5;
  --r:16px;--sh:0 1px 2px rgba(20,27,38,.04),0 2px 8px rgba(20,27,38,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.ic{display:inline-block;vertical-align:-3px;flex:none}
.q{color:var(--ink3)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ttl{min-width:0}.ttl b{display:block;font-size:16px;line-height:1.2}.ttl small{color:var(--ink3);font-size:12.5px}
body.embed .logo,body.embed .ttl{display:none}
.seg{display:inline-flex;background:var(--line2);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:9px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(20,27,38,.12)}
.seg.sm button{padding:5px 11px;font-size:13px}
.sp{flex:1}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:14px;max-width:100%}
.ibtn{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
main{max-width:1280px;margin:0 auto;padding:16px 20px calc(30px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .lb{font-size:12.5px;color:var(--ink3)}
.demo{background:var(--warnSoft);color:#8a5a00;border-radius:12px;padding:9px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
@media(max-width:640px){.top-in{padding:8px 12px;gap:8px}.ttl{display:none}main{padding:12px 12px calc(30px + env(safe-area-inset-bottom))}.seg button{padding:7px 10px;font-size:13.5px}}

/* common */
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff;box-shadow:var(--sh);min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .q{font-weight:400;font-size:12.5px}
.grid{display:grid;gap:16px;margin-bottom:16px;align-items:start}
.g-21{grid-template-columns:2fr 1fr}.g-11{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.g-21,.g-11{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;box-shadow:var(--sh);min-width:0;position:relative}
.kpi>span{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi>b{display:block;font-size:26px;line-height:1.2;margin-top:4px;letter-spacing:-.3px;white-space:nowrap}.kpi>b small{font-size:13px;color:var(--ink3);font-weight:500}
.kpi .sub{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.5}
.kpi .cmp{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.chip.up{background:var(--okSoft)}.chip.dn{background:var(--badSoft)}.chip.na{background:var(--line2);color:var(--ink3);font-weight:500}
.kpi.ab{border-top:3px solid var(--ab)}.kpi.cc{border-top:3px solid var(--cc)}.kpi.tg{border-top:3px dashed var(--line)}
.kpi.main{border-top:3px solid var(--ok)}
.pbar{height:6px;border-radius:3px;background:var(--line2);margin-top:8px;overflow:hidden;display:flex}.pbar i{height:100%}
@media(max-width:420px){.kpi{padding:11px 12px}.kpi>b{font-size:20px}}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;text-align:right}
.t th{background:#F7F9FB;color:var(--ink2);font-weight:600;font-size:12.5px;position:sticky;top:0;z-index:1}
.t th.l,.t td.l{text-align:left}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#F7F9FB}
.t td.nm{max-width:240px;overflow:hidden;text-overflow:ellipsis}
.t th.srt{cursor:pointer;user-select:none}.t th.srt.on{color:var(--brand)}
.rk{display:inline-flex;width:24px;height:24px;border-radius:7px;background:var(--line2);color:var(--ink2);font-size:12px;font-weight:700;align-items:center;justify-content:center}
.rk.top{background:var(--brand);color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.tag.D{background:var(--brandSoft);color:var(--brand)}.tag.P{background:#F1ECFB;color:#6D3FC0}.tag.S{background:#FFF1E3;color:#B45309}
.mini{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line2);min-width:70px}.mini i{height:100%}

/* report (NIMEX441 style) */
.rp{font-size:12.5px}
.rp th{background:#EEF2F7;color:var(--brand);border-right:1px solid #fff;padding:5px 8px}
.rp thead tr:first-child th{border-bottom:1px solid #fff}
.rp td{padding:4px 8px;border-right:1px solid var(--line2)}
.rp tr.gh td{background:#F7F9FB;font-weight:700;color:var(--brand);cursor:pointer;text-align:left}
.rp tr.gt td{background:#EEF2F7;font-weight:700}
.rp tr.gg td{background:var(--brand);color:#fff;font-weight:700}
.rp td.ab{background:#F6F8FB}.rp td.cc{background:#F2FAFB}
.rp tr.gt td.ab,.rp tr.gt td.cc{background:#E4EAF2}
.rp .ex{font-size:11px;color:var(--warn);font-weight:600;margin-left:6px}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit}

/* import */
.drop{border:2px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--ink2);cursor:pointer;background:#fff}
.drop.on{border-color:var(--brand);background:var(--brandSoft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{border-radius:8px;padding:6px 0;text-align:center;font-size:12.5px;background:var(--line2);color:var(--ink3)}
.cal div.h{background:none;font-weight:600;color:var(--ink2)}
.cal div.ok{background:var(--okSoft);color:var(--ok);font-weight:700}
.cal div.miss{background:var(--badSoft);color:var(--bad);font-weight:600}
.cal div.fut{background:none;border:1px dashed var(--line)}
.res{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.res:last-child{border:0}
.empty{padding:40px 10px;text-align:center;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:90;font-weight:600;color:var(--brand)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo" id="logo"></div>
  <div class="ttl"><b>ยอดขายสาขา</b><small id="sub">AB + CC · NIM Express</small></div>
  <div class="seg" id="nav"></div>
  <div class="sp"></div>
  <select class="sel" id="selMon" aria-label="เลือกเดือน"></select>
  <button class="ibtn" id="bRef" title="รีเฟรช"></button>
</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================
   ยอดขายสาขา v1 · 2026-10-27
   แหล่งข้อมูล: รายงาน NIMEX441 (สรุปรายได้ NimExpress) วันละ 1 ไฟล์
   ยอดวัดผล = AB + CC = รวมรายได้ค่าขนส่ง · AB = ค่าขนส่ง − รวม Cold Chain · CC = รวม Cold Chain
   ลิงก์: ?page=net|rank|br|rp|imp · &br=150 · &embed=1 (ฝังในระบบตารางกะ)
   ===================================================================== */
const APP_VERSION='v1 · 2026-10-27';
const API_URL='https://script.google.com/macros/s/AKfycbwHTMoMegT5M73nr9JQndleMm9CkPsqwaNwy8pqzztAOYXcysQ4JDeyARBqWjm9H-cqOw/exec';                       // ← ใส่ URL Web App ของ GAS ยอดขาย (ยังว่าง = โหมดตัวอย่าง)
const MOCK=!API_URL;
let EXCL=['690','691'];               // เก็บข้อมูล แต่ไม่แสดงในหน้าวัดผล / จัดอันดับ
const EXCL_NOTE='ไม่รวม DC พระราม 9 (690) และ CDC บางนา (691)';

/* ตำแหน่งคอลัมน์ในรายงาน (index 0 = คอลัมน์ D "เครดิต เก่า · กล่อง") */
const C={crBox:0,crBill:1,crAmt:2,csBox:3,csBill:4,csAmt:5,frBox:6,frBill:7,frAmt:8,bxBox:9,bxBill:10,bxAmt:11,codBox:12,codBill:13,codAmt:14,insBox:15,insBill:16,insAmt:17,tot:18,
  d2dBox:19,d2dBill:20,d2dAmt:21,d2dCcCsAmt:24,d2dCcCrAmt:27,d2dTAmt:30,ccHomeBox:31,ccHomeBill:32,ccHomeAmt:33,ccBox:34,ccBill:35,ccAmt:36};
const NV=48;

/* ภาค: ระบบจริงดึงจาก M_Branch ของระบบตารางกะ — ตัวอย่างนี้จัดตามรหัสชั่วคราว */
const REG_ORDER=['ภาคเหนือ','ภาคอีสาน','ภาคกลาง','ภาคตะวันออก','ภาคใต้'];
const REG_EAST=['320','321','322','323','325','624'];
const REGION={};               // code → ภาค (จากชีต S_DC)
const regOf=c=>REGION[c]||regFb(c);
const regFb=c=>REG_EAST.includes(c)?'ภาคตะวันออก':c[0]==='1'?'ภาคเหนือ':c[0]==='2'?'ภาคอีสาน':c[0]==='4'?'ภาคใต้':'ภาคกลาง';

const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MONF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_WD=['อา','จ','อ','พ','พฤ','ศ','ส'];
const SCOPES=[['all','รวม'],['dc','เฉพาะ DC'],['shop','เฉพาะ Shop'],['dp','เฉพาะ Drop point'],['dcdp','DC + Drop point']];
const inScope=(t,sc)=>sc==='all'||(sc==='dc'&&t==='D')||(sc==='dp'&&t==='P')||(sc==='dcdp'&&t!=='S')||(sc==='shop'&&t==='S');

/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null||isNaN(n)?'–':Math.round(n).toLocaleString('en-US');
const fmtM=n=>n==null?'–':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+' ล้าน':fmt(n);
const pct=(a,b)=>b?(a/b-1)*100:null;
const pctTx=p=>p==null?'–':(p>0?'+':'')+p.toFixed(1)+'%';
const chip=p=>p==null?'<span class="chip na">ยังไม่มีข้อมูลเทียบ</span>':`<span class="chip ${p>=0?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`;
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
const prevYm=ym=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const monLb=ym=>TH_MON[+ym.slice(5)-1]+' '+(+ym.slice(0,4)+543);
const dLb=ds=>(+ds.slice(8))+' '+TH_MON[+ds.slice(5,7)-1];
const wday=ds=>new Date(ds+'T00:00:00').getDay();
const toast=(m)=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)};
const ssGet=k=>{try{return sessionStorage.getItem(k)||''}catch(e){return''}},ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const IC={
 chart:'<path d="M3 3v18h18"/><path d="M7 16v-4M11 16V8M15 16v-6M19 16V5"/>',
 trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
 store:'<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>',
 table:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
 refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
 coin:'<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
 box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',
 snow:'<path d="M2 12h20M12 2v20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/>',
 target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 fold:'<path d="m7 20 5-5 5 5M7 4l5 5 5-5"/>',unfold:'<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>',
 cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'
};
const ic=(k,s=16)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]||''}</svg>`;

/* ---------- state ---------- */
const QS=new URLSearchParams(location.search);
const EMBED=QS.get('embed')==='1';if(EMBED)document.body.classList.add('embed');
const S={page:QS.get('page')||'net',rv:'sale',uk:'',lv:'dc',ym:/^\d{4}-\d{2}$/.test(QS.get('ym')||'')?QS.get('ym'):null,sc:'all',reg:'',br:QS.get('br')||'',srt:null,rpA:null,rpB:null,rpQ:'',rpOpen:{}};
const DATA={};                 // 'YYYY-MM-DD' → {g:{code:name}, rows:[[code,type,sub,[48 ค่า]]]}
const NAMES={};                // code → ชื่อ DC

/* ---------- aggregate ---------- */
function blank(){return new Float64Array(NV)}
function add(a,v){for(let i=0;i<NV;i++)a[i]+=+v[i]||0;return a}
const AB=v=>v[C.frAmt]-v[C.ccAmt],CC=v=>v[C.ccAmt],FR=v=>v[C.frAmt];
const ABb=v=>v[C.frBill]-v[C.ccBill];
/* ยอดของแต่ละ DC ในช่วงวัน a..b ของเดือน ym → {code: Float64Array} */
function byDc(ym,a,b,sc){const R={};for(let d=a;d<=b;d++){const D=DATA[ym+'-'+String(d).padStart(2,'0')];if(!D)continue;
  for(const r of D.rows){if(!inScope(r[1],sc))continue;add(R[r[0]]||(R[r[0]]=blank()),r[3])}}return R}
function byDay(ym,codes,sc){const n=daysIn(ym),out=[];for(let d=1;d<=n;d++){const D=DATA[ym+'-'+String(d).padStart(2,'0')];if(!D){out.push(null);continue}
  const a=blank();for(const r of D.rows){if(codes&&!codes.includes(r[0]))continue;if(!inScope(r[1],sc))continue;add(a,r[3])}out.push(a)}return out}
let MONTHS=null;const LOADED={};const UC={};
const months=()=>[...new Set([...(MONTHS||[]),...Object.keys(DATA).map(d=>d.slice(0,7))])].sort();
const KEEP=[1,2,4,5,6,7,8,11,14,17,18,21,24,27,33,35,36];   // ค่าที่ API ส่งมา (ตรงกับ KEEP ใน GAS)
const dec=s=>{const a=String(s||'').split(','),o=blank();KEEP.forEach((k,i)=>o[k]=+a[i]||0);return o};
/* ยอดรายจุดขาย รวมวัน a..b → [[code,type,sub,vals]] · null = กำลังโหลด */
function units(ym,a,b){
  if(MOCK){const A={},o=[];for(let d=a;d<=b;d++){const D=DATA[ym+'-'+String(d).padStart(2,'0')];if(!D)continue;for(const r of D.rows){const k=r[0]+'|'+r[1]+'|'+r[2];if(!A[k]){A[k]=[r[0],r[1],r[2],blank()];o.push(A[k])}add(A[k][3],r[3])}}return o}
  const k=ym+'_'+a+'_'+b;if(UC[k])return UC[k];
  if(!UC['_'+k]){UC['_'+k]=1;apiGet({action:'units',ym,a,b}).then(d=>{UC[k]=(d.rows||[]).map(r=>[r[0],r[1],r[2],dec(r[3])]);render(true)}).catch(e=>{delete UC['_'+k];toast(e.message)})}
  return null}
/* ยอดรายวันของจุดขายเดียว → {D:[เดือนนี้], P:[เดือนก่อน]} · null = กำลังโหลด */
const UD={};
function unitDays(ym,code,t,sub){
  const mk=(m,days)=>Array.from({length:daysIn(m)},(_,i)=>days[m+'-'+String(i+1).padStart(2,'0')]||null);
  if(MOCK){const get=m=>{const o={};Object.keys(DATA).filter(d=>d.startsWith(m)).forEach(d=>{const r=DATA[d].rows.find(r=>r[0]===code&&r[1]===t&&r[2]===sub);o[d]=r?add(blank(),r[3]):blank()});return o};return{D:mk(ym,get(ym)),P:mk(prevYm(ym),get(prevYm(ym)))}}
  const k=ym+'|'+code+'|'+t+'|'+sub;if(UD[k])return UD[k];
  if(!UD['_'+k]){UD['_'+k]=1;apiGet({action:'unitdays',ym,code,t,sub}).then(d=>{const o={};Object.keys(DATA).forEach(x=>{if(x.startsWith(ym)||x.startsWith(prevYm(ym)))o[x]=blank()});Object.keys(d.days||{}).forEach(x=>o[x]=dec(d.days[x]));UD[k]={D:mk(ym,o),P:mk(prevYm(ym),o)};render(true)}).catch(e=>{delete UD['_'+k];toast(e.message)})}
  return null}
const short=n=>String(n||'').replace(/^Drop\s*point\s*(สาขา)?\s*/i,'').replace(/^Shop\s*/i,'Shop ');
const TLB={D:'DC',S:'Shop',P:'Drop point'};
const daysWith=ym=>Object.keys(DATA).filter(d=>d.startsWith(ym)).map(d=>+d.slice(8)).sort((a,b)=>a-b);
const lastDay=ym=>{const L=daysWith(ym);return L.length?L[L.length-1]:0};
const dcList=()=>Object.keys(NAMES).sort((a,b)=>+a-+b);
const measured=()=>dcList().filter(c=>!EXCL.includes(c)&&(!S.reg||regOf(c)===S.reg));
const nm=c=>NAMES[c]||c;
const sumOf=(R,codes)=>{const a=blank();codes.forEach(c=>R[c]&&add(a,R[c]));return a};
const TARGET={};               // ym → code → {ab,cc} (ยังไม่มีเป้า)
const tgOf=(ym,codes)=>{const T=TARGET[ym];if(!T)return null;let ab=0,cc=0,n=0;codes.forEach(c=>{if(T[c]){ab+=+T[c].ab||0;cc+=+T[c].cc||0;n++}});return n?{ab,cc,t:ab+cc}:null};

/* ช่วงเทียบ: MTD 1..u ของเดือนนี้ กับ 1..min(u,วันของเดือนก่อน) ของเดือนก่อน */
function period(){const ym=S.ym,u=lastDay(ym),pv=prevYm(ym),pu=Math.min(u,daysIn(pv)),pHas=daysWith(pv).filter(d=>d<=pu).length;
  return{ym,u,pv,pu,pHas,has:daysWith(ym).length}}

/* ---------- daily chart ---------- */
function dayChart(ym,codes,sc,h=210,arr){
  const D=arr?arr.D:byDay(ym,codes,sc),P=arr?arr.P:byDay(prevYm(ym),codes,sc),n=D.length,W=760,H=h,pl=46,pr=8,pt=14,pb=34,iw=W-pl-pr,ih=H-pt-pb,bw=iw/n;
  const mx=Math.max(1,...D.map(a=>a?FR(a):0),...P.map(a=>a?FR(a):0));const st=niceStep(mx/4),top=Math.ceil(mx/st)*st,y=v=>pt+ih-v/top*ih;
  let g='';for(let v=0;v<=top+1e-6;v+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#F2F4F7"/><text x="${pl-6}" y="${y(v)+4}" font-size="10.5" fill="#98A1AF" text-anchor="end">${v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?Math.round(v/1e3)+'K':v}</text>`;
  D.forEach((a,i)=>{const x=pl+i*bw+bw*.16,w=bw*.68,ds=ym+'-'+String(i+1).padStart(2,'0'),we=[0,6].includes(wday(ds));
    if(a){const ab=AB(a),cc=CC(a);g+=`<rect x="${x}" y="${y(ab+cc)}" width="${w}" height="${Math.max(0,y(cc)-y(ab+cc))}" fill="#1F3A5F" rx="2"><title>${dLb(ds)} · AB ${fmt(ab)} · CC ${fmt(cc)} · รวม ${fmt(ab+cc)}</title></rect><rect x="${x}" y="${y(cc)}" width="${w}" height="${pt+ih-y(cc)}" fill="#0E8C9A" rx="2"><title>${dLb(ds)} · CC ${fmt(cc)}</title></rect>`}
    else g+=`<rect x="${x}" y="${pt+ih-3}" width="${w}" height="3" fill="#E7EAEF" rx="1"/>`;
    g+=`<text x="${x+w/2}" y="${H-pb+14}" font-size="10" text-anchor="middle" fill="${we?'#C0392B':'#98A1AF'}">${i+1}</text>`});
  const pp=P.map((a,i)=>a&&i<n?[pl+i*bw+bw/2,y(FR(a))]:null).filter(Boolean);
  if(pp.length>1)g+=`<polyline points="${pp.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  pp.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="#D97706"/>`);
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div><div class="lg" style="margin-top:6px"><span><i style="background:var(--ab)"></i>AB</span><span><i style="background:var(--cc)"></i>CC</span><span><i style="background:#D97706;height:2px;width:14px"></i>เดือนก่อน (วันที่เดียวกัน)</span><span><i style="background:var(--line)"></i>ยังไม่มีไฟล์</span><span style="color:var(--bad)">ตัวเลขแดง = เสาร์–อาทิตย์</span></div>`}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),m=x/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}

  <div class="q" style="font-size:12px;margin-top:8px">AB = รวมรายได้ค่าขนส่ง − รวม Cold Chain · ค่าแพ็ค / อุปกรณ์ Pack เก็บในระบบแต่ไม่แสดง · กดแถวชื่อ DC เพื่อยุบ / ขยาย</div></div>`}

/* ---------- SheetJS (โหลดเมื่อใช้) ---------- */
let _xlsx=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);return _xlsx||(_xlsx=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>{_xlsx=null;no(new Error('โหลดตัวอ่าน Excel ไม่ได้'))};document.head.appendChild(s)}))}
async function exportRp(ym,a,b,G,codes){
  try{const X=await loadXLSX();const head1=['#','รหัส DC','Sub DC'],head2=['','',''];RPC.forEach(([h,cols])=>cols.forEach(([s],i)=>{head1.push(i?'':h);head2.push(s)}));
    const A=[[`รายงาน สรุปรายได้ NimExpress ตั้งแต่ ${a} ถึง ${b} ${TH_MONF[+ym.slice(5)-1]} ${+ym.slice(0,4)+543}`],head1,head2];const val=v=>RPC.flatMap(([,cols])=>cols.map(([,f])=>Math.round(f(v)*100)/100));
    const gt=blank();const ord={D:0,S:1,P:2};
    codes.forEach(c=>{const g=G[c];A.push([c+'  '+nm(c)]);Object.values(g.u).sort((x,y)=>ord[x.t]-ord[y.t]).forEach((u,i)=>A.push([i+1,nm(c),u.n,...val(u.a)]));A.push(['รวม '+c+'  '+nm(c),'','',...val(g.t)]);add(gt,g.t)});
    A.push(['รวมทั้งสิ้น','','',...val(gt)]);
    const ws=X.utils.aoa_to_sheet(A),wb=X.utils.book_new();ws['!cols']=[{wch:6},{wch:18},{wch:34},...Array(20).fill({wch:12})];X.utils.book_append_sheet(wb,ws,'ยอดขาย');
    X.writeFile(wb,`ยอดขายสาขา_${ym}_${a}-${b}.xlsx`)}catch(e){toast(e.message)}}

/* ---------- อ่านไฟล์ NIMEX441 ---------- */
function parse441(A,fname){
  const hd=String((A[2]||[])[0]||''),m=[...hd.matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{4})/g)];
  if(!/NIMEX441/i.test(String((A[0]||[])[0]||''))&&!/สรุปรายได้/.test(String((A[1]||[])[0]||'')))throw new Error('ไม่ใช่รายงาน NIMEX441');
  if(m.length<2)throw new Error('ไม่พบช่วงวันที่ในหัวรายงาน');
  const iso=x=>(+x[3]-543)+'-'+x[2].padStart(2,'0')+'-'+x[1].padStart(2,'0'),d1=iso(m[0]),d2=iso(m[1]);
  if(d1!==d2)throw new Error(`ไฟล์เป็นยอดรวมหลายวัน (${dLb(d1)} – ${dLb(d2)}) · กรุณาดึงทีละวัน`);
  const rows=[],g={},unk=new Set();let cur=null,grand=null,chk={};
  for(let i=5;i<A.length;i++){const r=A[i]||[],a=String(r[0]==null?'':r[0]).trim();
    if(/^\d+\s+\S/.test(a)&&(r[1]==null||r[1]==='')){cur=a.split(/\s+/)[0];g[cur]=a.slice(cur.length).trim();continue}
    if(a.startsWith('รวมทั้งสิ้น')){grand=+r[21]||0;continue}
    if(a.startsWith('รวม')){chk[cur]=+r[11]||0;continue}
    if(!cur)continue;
    const s=String(r[2]==null?'':r[2]).trim(),t=!s?'D':/^drop/i.test(s)?'P':/^shop/i.test(s)?'S':'?';if(t==='?')unk.add(s);
    const v=[];for(let k=3;k<3+NV;k++){const x=+r[k];v.push(isNaN(x)?0:Math.round(x*100)/100)}
    if(v.some(x=>x))rows.push([cur,t,s,v])}
  if(!rows.length)throw new Error('ไม่พบแถวข้อมูล');
  /* ตรวจยอด: ผลรวมแถว = แถว "รวม DC" และ "รวมทั้งสิ้น" */
  const sum={};let tot=0;rows.forEach(r=>{sum[r[0]]=(sum[r[0]]||0)+r[3][C.frAmt];tot+=r[3][C.tot]});
  const bad=Object.keys(chk).filter(c=>Math.abs((sum[c]||0)-chk[c])>1);
  return{d:d1,g,rows,unk:[...unk],bad,tot,grand,fname}}
async function readFile(f){const X=await loadXLSX();const buf=await f.arrayBuffer();const wb=X.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];return parse441(X.utils.sheet_to_json(ws,{header:1,defval:null,raw:true}),f.name)}
function putDay(o){DATA[o.d]={g:o.g,rows:o.rows};Object.assign(NAMES,o.g)}

/* ---------- page: นำเข้า ---------- */
let IMP=[];
function pImp(){
  const ym=S.ym||new Date().toISOString().slice(0,7),L=daysWith(ym),n=daysIn(ym),today=new Date().toISOString().slice(0,10);
  const f0=new Date(ym+'-01T00:00:00').getDay();
  const cal=TH_WD.map(w=>`<div class="h">${w}</div>`).join('')+Array(f0).fill('<div class="h"></div>').join('')+Array.from({length:n},(_,i)=>{const d=i+1,ds=ym+'-'+String(d).padStart(2,'0');return`<div class="${L.includes(d)?'ok':ds<today?'miss':'fut'}" title="${L.includes(d)?'มีไฟล์แล้ว':ds<today?'ยังไม่มีไฟล์':''}">${d}</div>`}).join('');
  const miss=Array.from({length:n},(_,i)=>i+1).filter(d=>!L.includes(d)&&ym+'-'+String(d).padStart(2,'0')<today);
  AFTER.push(()=>{const dz=$('drop'),fi=$('fIn');dz.onclick=()=>fi.click();fi.onchange=()=>doImport([...fi.files]);
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('on')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('on')}));
    dz.addEventListener('drop',e=>doImport([...e.dataTransfer.files]))});
  return`<div class="grid g-21"><div class="card"><h3>${ic('upload',16)} นำเข้าไฟล์ NIMEX441 <span class="q">วันละ 1 ไฟล์ · เลือกหลายไฟล์พร้อมกันได้</span></h3>
   <div class="drop" id="drop">${ic('upload',30)}<div style="font-weight:600;margin-top:8px">ลากไฟล์มาวาง หรือกดเพื่อเลือกไฟล์</div><div class="q" style="font-size:13px;margin-top:4px">.xls / .xlsx จากรายงาน NIMEX441 · ระบบอ่านวันที่จากหัวรายงานเอง · อัปวันเดิมซ้ำ = เขียนทับ</div></div>
   <input type="file" id="fIn" multiple accept=".xls,.xlsx" class="hidden">
   <div style="display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap"><label for="pin" style="font-size:13.5px;font-weight:600">${ic('target',14)} รหัสนำเข้า</label><input id="pin" type="password" class="sel" style="width:160px" placeholder="ใส่รหัส" value="${esc(ssGet('sl_pin'))}" autocomplete="off"><span class="q" style="font-size:12.5px">${MOCK?'หน้าตัวอย่าง: ใส่อะไรก็ได้':'ตั้ง / แก้รหัสได้ที่ Google Sheet › ชีต CONFIG › IMPORT_PIN'}</span></div>
   <div id="impRes" style="margin-top:12px">${IMP.map(resRow).join('')}</div>
   <div class="q" style="font-size:12.5px;margin-top:10px;line-height:1.7">${ic('alert',13)} ไฟล์ที่ดึงหลายวันรวมกัน (เช่น 01/10 ถึง 26/10) ระบบจะไม่รับ เพราะยอดออกมาเป็นก้อนเดียว ไม่แยกวัน<br>${ic('check',13)} ระบบตรวจยอด: ผลรวมแต่ละแถวต้องตรงกับแถว "รวม DC" ในไฟล์</div></div>
  <div class="card"><h3>${ic('cal',16)} ไฟล์ที่มีแล้ว · ${monLb(ym)}</h3><div class="cal">${cal}</div>
   <div class="lg" style="margin-top:10px"><span><i style="background:var(--okSoft)"></i>มีไฟล์ ${L.length} วัน</span><span><i style="background:var(--badSoft)"></i>ยังไม่มี ${miss.length} วัน</span></div>
   ${miss.length?`<div class="q" style="font-size:12.5px;margin-top:8px">ยังขาดวันที่: ${miss.join(', ')}</div>`:''}</div></div>`}
const resRow=r=>`<div class="res"><span style="color:${r.ok?'var(--ok)':'var(--bad)'}">${ic(r.ok?'check':'x',17)}</span><div style="flex:1;min-width:0"><b>${esc(r.fname)}</b><div class="q" style="font-size:12.5px">${r.ok?`${dLb(r.d)} ${+r.d.slice(0,4)+543} · ${r.n} แถว · ${Object.keys(r.g).length} DC · AB+CC ${fmt(r.fr)} บาท${r.over?' · <span style="color:var(--warn)">เขียนทับข้อมูลเดิม</span>':''}${r.warn?` · <span style="color:var(--warn)">${esc(r.warn)}</span>`:''}`:esc(r.err)}</div></div></div>`;
async function doImport(files){
  if(!files.length)return;const pin=($('pin')||{}).value||'';if(!pin.trim()){toast('กรุณาใส่รหัสนำเข้าก่อน');$('pin').focus();$('fIn').value='';return}
  if(!MOCK){try{await apiGet({action:'checkpin',pin})}catch(e){toast(e.message);$('pin').focus();$('fIn').value='';return}}
  ssSet('sl_pin',pin);const box=$('impRes');box.innerHTML=`<div class="q">กำลังอ่าน ${files.length} ไฟล์…</div>`;const out=[];
  for(const f of files){try{const o=await readFile(f);const over=!!DATA[o.d];
      const warn=[o.unk.length?'พบ Sub DC ประเภทใหม่: '+o.unk.join(', '):'',o.bad.length?'ยอดไม่ตรงแถวรวม: '+o.bad.join(', '):''].filter(Boolean).join(' · ');
      if(!MOCK)await apiPost({action:'import',pin,day:o.d,fname:f.name,groups:o.g,rows:o.rows});
      putDay(o);out.push({ok:true,fname:f.name,d:o.d,n:o.rows.length,g:o.g,fr:o.rows.reduce((s,r)=>s+r[3][C.frAmt],0),over,warn})}
    catch(e){out.push({ok:false,fname:f.name,err:e.message})}
    box.innerHTML=out.map(resRow).join('')}
  IMP=out.sort((a,b)=>(a.d||'').localeCompare(b.d||''));const okD=out.filter(x=>x.ok).map(x=>x.d).sort();
  if(okD.length){S.ym=okD[okD.length-1].slice(0,7);if(!MOCK){Object.keys(UC).forEach(k=>delete UC[k]);Object.keys(LOADED).forEach(k=>delete LOADED[k]);try{await load(S.ym)}catch(e){toast(e.message)}}toast(`นำเข้า ${okD.length} วันแล้ว`)}
  render(true)}

/* ---------- API (GAS) ---------- */
function apiGet(p){return new Promise((ok,no)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
  window[cb]=d=>{delete window[cb];s.remove();d&&d.ok===false?no(new Error(d.error||'API error')):ok(d)};s.onerror=()=>{delete window[cb];s.remove();no(new Error('เชื่อมต่อระบบไม่ได้'))};
  s.src=API_URL+'?'+new URLSearchParams({...p,callback:cb});document.head.appendChild(s)})}
async function apiPost(body){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const d=await r.json();if(d.ok===false)throw new Error(d.error||'บันทึกไม่สำเร็จ');return d}
async function load(ym){
  if(MOCK){(window.MOCK_DATA||[]).forEach(o=>putDay(o))}
  else{const d=await apiGet({action:'month',ym:ym||S.ym||''});if(d.ym)LOADED[d.ym]=1;MONTHS=d.months||[];
    [d.ym,prevYm(d.ym)].forEach(m=>Object.keys(DATA).forEach(k=>{if(k.startsWith(m))delete DATA[k]}));
    Object.keys(d.days||{}).forEach(ds=>{DATA[ds]={rows:d.days[ds].map(r=>[String(r[0]),r[1],'',dec(r[2])])}});
    Object.assign(NAMES,d.names||{});Object.assign(REGION,d.regions||{});Object.assign(TARGET,d.target||{});if(d.excl&&d.excl.length)EXCL=d.excl;
    if(!d.ym)throw new Error('API ยอดขายตอบกลับไม่ถูกต้อง');LOADED[d.ym]=1;if(!S.ym)S.ym=d.ym}
  const M=months();if(!S.ym||!M.includes(S.ym))S.ym=M[M.length-1]||null;
  if(!MOCK&&S.ym&&!LOADED[S.ym])return load(S.ym);
}
async function busy(p){const o=document.createElement('div');o.className='loading';o.textContent='กำลังโหลด…';document.body.appendChild(o);try{return await p}finally{o.remove()}}

addEventListener('message',e=>{if(e.data==='sales:refresh')$('bRef').click()});
$('logo').innerHTML=ic('coin',20);$('bRef').innerHTML=ic('refresh',17);$('bRef').onclick=async()=>{Object.keys(UC).forEach(k=>delete UC[k]);Object.keys(LOADED).forEach(k=>delete LOADED[k]);try{await busy(load(S.ym));render(true);toast('รีเฟรชแล้ว')}catch(e){toast(e.message)}};
</script>
<script>
/* ข้อมูลตัวอย่าง (ไฟล์ NIMEX441 วันที่ 1–2 ต.ค. 2569) · ใช้เฉพาะโหมดตัวอย่าง */
window.MOCK_DATA=[];
busy(load()).then(()=>render()).catch(e=>{document.getElementById('app').innerHTML='<div class="card empty">'+e.message+'</div>'});
</script>
