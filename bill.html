<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>การจัดการบิล · DC Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff}body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:14px;color:#141B26;padding:14px 14px 30px}
.btn{border:1px solid #E6EAF0;background:#fff;border-radius:10px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:inherit}.btn.sm{padding:4px 11px;font-size:12.5px}.btn:hover{border-color:#1F3A5F;color:#1F3A5F}.btn.pri{background:#1F3A5F;color:#fff;border-color:#1F3A5F}
.ld{border-radius:18px;background:#F5F7FA;padding:24px;display:grid;gap:10px;justify-items:center;color:#5A6577;filter:blur(.2px)}.ld-g{display:grid;gap:8px;width:100%}.ld-g i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#E6EAF0,#F5F7FA,#E6EAF0);background-size:200% 100%;animation:sw 1.4s infinite;filter:blur(1.5px)}@keyframes sw{to{background-position:-200% 0}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0A0A0B;color:#fff;padding:9px 16px;border-radius:12px;font-size:13px;display:none;z-index:99}#toast.bad{background:#D6453A}
.hidden{display:none!important}
/* ===== บิล (v179) ===== */
.bl{--bi:#141B26;--bi2:#5A6577;--bi3:#98A1AF;--bln:#E6EAF0;--bsf:#F5F7FA;color:var(--bi);max-width:1180px;margin:0 auto;padding:4px 0 40px}
.bl-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}.bl-top h2{margin:0;font-size:18px}.bl-sub{color:var(--bi3);font-size:12.5px}
.bl-tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bl-seg{display:inline-flex;background:var(--bsf);border-radius:11px;padding:3px}.bl-seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font:inherit;font-size:13px;color:var(--bi2);cursor:pointer;white-space:nowrap}.bl-seg button.on{background:#fff;color:var(--bi);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.bl-chk{font-size:12.5px;color:var(--bi2);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.bl-kpi{border:1px solid var(--bln);border-radius:20px;padding:16px 20px;display:grid;grid-template-columns:minmax(230px,auto) 1fr auto;gap:22px;align-items:center;margin-bottom:16px;background:#fff}
.bl-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.bl-big{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.5px}.bl-big small{font-size:22px;font-weight:600}
.bl-over{font-size:22px;font-weight:600;color:#D6453A}.bl-over small{color:var(--bi2);font-size:13px;font-weight:500}
.bl-d{font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px}.bl-d.up{background:#E4F5EC;color:#2E9E6B}.bl-d.dn{background:#FCE9E7;color:#D6453A}
.bl-cap{color:var(--bi2);font-size:12.5px;margin-top:6px}.bl-cap2{color:var(--bi3);font-size:11.5px;margin-top:2px}
.bl-bars{display:flex;align-items:flex-end;gap:7px;height:66px}.bl-bars i{flex:1;border-radius:6px 6px 3px 3px;min-height:6px;position:relative;display:block}.bl-bars i.cur{outline:2px solid #1F3A5F;outline-offset:1px}
.bl-bars i:hover::after{content:attr(data-t);position:absolute;bottom:105%;left:50%;transform:translateX(-50%);background:#0A0A0B;color:#fff;font-size:11.5px;padding:4px 9px;border-radius:8px;white-space:nowrap;z-index:5}
.bl-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--bi3);margin-top:4px}
.bl-st{display:inline-flex;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap}.bl-st.fin{background:#E6EDF6;color:#3B6EA5}.bl-st.pre{background:#FDF3E1;color:#C98A10}
.bl-h3{font-size:15px;font-weight:700;margin:6px 0 10px}.bl-h3 small{font-weight:400;color:var(--bi3);font-size:12.5px;margin-left:8px}
.bl-gs-w{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.bl-g{border:1.5px solid var(--bln);border-radius:16px;padding:12px 14px;background:#fff;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.bl-g.bad{border-left:4px solid #D6453A}.bl-g.on{border-color:#1F3A5F;box-shadow:0 0 0 2px #E6EDF6}.bl-g.z{opacity:.55}
.bl-gt{font-size:12.5px;color:var(--bi2)}.bl-gn{font-size:26px;font-weight:700;line-height:1.1}.bl-gs{font-size:12px;color:var(--bi3)}.bl-gs b{color:#D6453A}.bl-gw{font-size:11px;color:var(--bi3);margin-top:2px}
.bl-ext{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bl-x{border:1px dashed var(--bln);background:#fff;border-radius:14px;padding:10px 14px;font:inherit;font-size:13px;cursor:pointer;text-align:left;color:inherit}.bl-x small{display:block;color:var(--bi3);font-size:11.5px;margin-top:2px}.bl-x.on{border-color:#1F3A5F;background:#F5F9FF}.bl-x b.r{color:#D6453A}
.bl-lh{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}.bl-lh .sp{flex:1}.bl-clr{border:0;background:none;color:#3B6EA5;cursor:pointer;font:inherit;font-size:12.5px}
.bl-list{border:1px solid var(--bln);border-radius:16px;overflow:hidden;background:#fff}
.bl-r{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(150px,.8fr) minmax(170px,1.4fr) auto;gap:14px;padding:10px 14px;border-top:1px solid #F0F2F6;align-items:center}.bl-r:first-child{border-top:0}.bl-r.o{background:#FFFAF9}.bl-r.l{background:#FFFCF5}
.bl-b b{font-variant-numeric:tabular-nums;display:block}.bl-b span,.bl-w small{display:block;font-size:11.5px;color:var(--bi3)}.bl-w{font-size:13px}.bl-w small.r{color:#D6453A}
.bl-a{font-size:12px;color:var(--bi2);display:grid;gap:4px}.bl-ab{height:6px;background:#EEF1F5;border-radius:99px;overflow:hidden}.bl-ab i{display:block;height:100%;border-radius:99px}
.bl-p{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;margin-left:4px}.bl-p.ok{background:#E4F5EC;color:#2E9E6B}.bl-p.near{background:#FDF3E1;color:#C98A10}.bl-p.over{background:#FCE9E7;color:#D6453A}
.bl-e{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.bl-done{font-size:11.5px;background:#E4F5EC;color:#2E9E6B;padding:2px 9px;border-radius:99px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-more{display:block;margin:10px auto}.bl-empty{padding:26px 16px;text-align:center;color:var(--bi2)}.bl-foot{margin-top:12px;font-size:11.5px;color:var(--bi3)}
.bl-md{position:fixed;inset:0;background:rgba(10,10,11,.45);z-index:90;display:grid;place-items:center;padding:16px}.bl-mb{background:#fff;border-radius:20px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;color:#141B26}.bl-mb h3{margin:0 0 6px}
.bl-ch{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.bl-ch button{border:1px solid #E6EAF0;background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.bl-ch button.on{background:#1F3A5F;color:#fff;border-color:#1F3A5F}
.bl-mb textarea,.bl-mb input{width:100%;border:1px solid #E6EAF0;border-radius:10px;padding:8px 10px;font:inherit;margin-bottom:8px;box-sizing:border-box}.bl-ma{display:flex;gap:8px;justify-content:flex-end}
.bl-dist{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:-4px 0 6px}.bl-dist i{display:block}.bl-dl{display:flex;gap:14px;font-size:12px;color:var(--bi2);margin-bottom:14px;flex-wrap:wrap}.bl-dl i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.bl-card{border:1px solid var(--bln);border-radius:20px;overflow:hidden;background:#fff;margin-top:6px}.bl-card .bl-lh{padding:0 18px}
.bl-tabs{display:flex;gap:6px;padding:10px 18px 0;flex-wrap:wrap;border-bottom:1px solid var(--bln)}.bl-tabs button{border:0;background:none;font:inherit;font-size:13.5px;padding:8px 12px 11px;color:var(--bi2);cursor:pointer;border-bottom:3px solid transparent}.bl-tabs button.on{color:var(--bi);font-weight:700;border-color:#1F3A5F}.bl-tabs span{color:#D6453A;font-size:12px;margin-left:5px;font-weight:600}
.bl-tw{overflow:auto}.bl-t{width:100%;border-collapse:collapse}.bl-t th{font-size:12px;color:var(--bi3);font-weight:500;text-align:left;padding:8px 14px;background:var(--bsf)}.bl-t td{padding:9px 14px;border-top:1px solid #F0F2F6;font-size:13.5px;vertical-align:middle}.bl-t tbody tr{cursor:pointer}.bl-t tbody tr:hover td{background:#FAFBFD}
.bl-t .rk{width:30px;color:var(--bi3);font-weight:600}.bl-t .num{font-variant-numeric:tabular-nums;font-weight:600}.bl-t small{color:var(--bi3);font-weight:400}.bl-t .up{color:#2E9E6B;font-weight:600}.bl-t .dn{color:#D6453A;font-weight:600}
.bl-pb{display:flex;align-items:center;gap:8px;min-width:150px}.bl-pbb{flex:1;height:7px;background:#EEF1F5;border-radius:99px;overflow:hidden}.bl-pbb i{display:block;height:100%;border-radius:99px}.bl-pb b{width:48px;text-align:right;font-variant-numeric:tabular-nums}
.bl-rg{font-size:12px;color:var(--bi2);background:var(--bsf);padding:2px 8px;border-radius:7px}.bl-mw{padding:11px 18px;text-align:center;border-top:1px solid #F0F2F6}
@media(max-width:860px){.bl-kpi{grid-template-columns:1fr}.bl-r{grid-template-columns:1fr 1fr}.bl-gs-w{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="tab-bl" class="hidden"></div><div id="v-bln" class="hidden"></div><div id="toast"></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>Math.round(n||0).toLocaleString();
function jsonp(base,params,ms){return new Promise((ok,no)=>{const cb='jp'+Date.now().toString(36)+Math.floor(Math.random()*1e4),sc=document.createElement('script');
  const t=setTimeout(()=>{fin();no(new Error('timeout'))},ms||20000);function fin(){clearTimeout(t);delete window[cb];sc.remove()}
  window[cb]=d=>{fin();ok(d)};sc.onerror=()=>{fin();no(new Error('network'))};sc.src=base+'?'+new URLSearchParams({...params,callback:cb});document.head.appendChild(sc)})}
function toast(t,k){const el=$('toast');el.textContent=t;el.className=k==='bad'?'bad':'';el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',2200)}
function ldHtml(m,h){return`<div class="ld" style="min-height:${h||120}px"><div class="ld-g"><i style="width:42%"></i><i style="width:88%"></i><i style="width:70%"></i><i style="width:94%"></i></div><span>${esc(m||'กำลังโหลด…')}</span></div>`}
const QS=new URLSearchParams(location.search),PAGE=QS.get('page')==='net'?'net':'br';
const S={br:QS.get('br')||'',reg:QS.get('reg')||'',user:'',lock:QS.get('lock')?QS.get('br'):''};let BRANCHES=[];
/* ================= บิล: KPI บิลทันอายุ + งานบิลค้างตามกลุ่ม (GAS บิล v3.41) ================= */
const BILL_API='https://script.google.com/macros/s/AKfycbzup6FaPt9rEqNP9UzEW5FLna6IGs0QRmnUv907Be-WTwd2uGjX8NvKX3hNNKUhBdmAkA/exec';
const BL={type:'',per:'month',grp:'',only:0,inc06:0,show:60,topic:'all',all:false,n:0,nn:0},BL_G=95,BL_Y=92;
const blCol=p=>p==null?'#C9CFD8':p>=BL_G?'#2E9E6B':p>=BL_Y?'#E0A93A':'#D6453A',_blC={};
function blGet(action,params,ttl){const key=action+'|'+JSON.stringify(params||{}),c=_blC[key];if(c&&Date.now()-c.t<(ttl||300000))return c.p;
  const p=jsonp(BILL_API,Object.assign({action},params||{}),45000).then(r=>{if(!r||!r.ok)throw new Error((r&&r.error)||'ระบบบิลไม่ตอบกลับ');return r.data}).catch(e=>{delete _blC[key];throw e});_blC[key]={t:Date.now(),p};return p}
const blPct=p=>p==null?'–':p.toFixed(1),blDelta=(a,b)=>a==null||b==null?'':`<span class="bl-d ${a>=b?'up':'dn'}">${a>=b?'▲':'▼'} ${Math.abs(a-b).toFixed(1)} vs ${BL.per==='week'?'สัปดาห์':'เดือน'}ก่อน</span>`;
const blLast=ps=>{let i=ps.length-1;while(i>0&&ps[i].pct==null)i--;return i};
function blStamp(p){return p.final?`<span class="bl-st fin">🔒 KPI ${esc(p.label)} · ประทับ ${esc(String(p.at).slice(5,16))}</span>`:BL.per==='week'?`<span class="bl-st pre">รายสัปดาห์ · ${p.open?'ยังไม่จบสัปดาห์':'ไม่ประทับ'}</span>`:`<span class="bl-st pre">${p.open?'KPI เบื้องต้น · ยังไม่ล็อก':'จบเดือนแล้ว · รอประทับ'}</span>`}
function blBars(ps,idx){return `<div class="bl-bars">${ps.map((p,i)=>`<i class="${i===idx?'cur':''}" data-t="${esc(p.label)} · ${blPct(p.pct)}%${p.pct==null?'':' ('+p.fail+'/'+p.tot+')'}" style="height:${p.pct==null?8:Math.max(10,(p.pct-85)/15*100)}%;background:${blCol(p.pct)}"></i>`).join('')}</div><div class="bl-ax"><span>${esc(ps[0].label)}</span><span>${esc(ps[ps.length-1].label)}</span></div>`}
function blHead(netMode){return `<div class="bl-tool"><div class="bl-seg" id="blType"><button data-v="" class="${BL.type===''?'on':''}">รวม</button><button data-v="A" class="${BL.type==='A'?'on':''}">ของแห้ง</button><button data-v="C" class="${BL.type==='C'?'on':''}">ของเย็น</button></div><div class="bl-seg" id="blPer"><button data-v="week" class="${BL.per==='week'?'on':''}">สัปดาห์</button><button data-v="month" class="${BL.per==='month'?'on':''}">เดือน</button></div><label class="bl-chk"><input type="checkbox" id="blInc" ${BL.inc06?'checked':''}> รวมกลุ่มรอเอกสาร (06)</label></div>`}
function blKpiHtml(k,title){
  const ps=k.periods,i=blLast(ps),p=ps[i],pv=i>0?ps[i-1]:null;
  if(!p||p.pct==null)return `<div class="bl-kpi"><div class="bl-km"><div class="bl-big" style="color:#98A1AF">–</div><div class="bl-cap">ยังไม่มีบิลที่ครบกำหนดวัดผล${k.since?' · เริ่มนับตั้งแต่ '+esc(k.since):''}<br>ระบบเริ่มเก็บ KPI ตั้งแต่อัปเกรด GAS บิล · ต้องรอให้บิลครบ 7 วัน (แห้ง) / 5 วัน (เย็น)</div></div></div>`;
  return `<div class="bl-kpi"><div class="bl-km"><div class="bl-row"><span class="bl-big" style="color:${blCol(p.pct)}">${blPct(p.pct)}<small>%</small></span><span class="bl-over">${fmt(p.fail)} <small>ใบเกินอายุ</small></span>${blDelta(p.pct,pv&&pv.pct)}</div>
    <div class="bl-cap">${esc(title||'')}ทันอายุ · ${esc(p.label)} · วัดจาก ${fmt(p.tot)} ใบที่ครบกำหนดแล้ว${p.netPct!=null&&k.scope!=='*'?` · ทั้งเครือข่าย <b>${blPct(p.netPct)}%</b>`:''}</div><div class="bl-cap2">ทันอายุ = ส่งจบภายใน ${BL.type==='C'?'5':BL.type==='A'?'7':'7 (แห้ง) / 5 (เย็น)'} วันนับจากวันสร้างบิล</div></div>
    <div class="bl-kb">${blBars(ps,i)}</div><div class="bl-ks">${blStamp(p)}</div></div>`}
const blSkeleton=(m)=>`<div class="bl-ld">${ldHtml(m||'กำลังโหลดข้อมูลบิล…',180)}</div>`;

/* ---------- แท็บบิลของสาขา ---------- */
function blBind(root,again){
  root.querySelector('#blType').onclick=e=>{const b=e.target.closest('button');if(b){BL.type=b.dataset.v;BL.grp='';again()}};
  root.querySelector('#blPer').onclick=e=>{const b=e.target.closest('button');if(b){BL.per=b.dataset.v;again()}};
  root.querySelector('#blInc').onchange=e=>{BL.inc06=e.target.checked?1:0;again()};
}
function renderBill(){
  const el=$('tab-bl'),cb=BRANCHES.find(x=>x.code===S.br);if(!el||!S.br)return;
  const my=++BL.n;
  if(!el.dataset.br||el.dataset.br!==S.br){el.dataset.br=S.br;BL.grp='';el.innerHTML=blSkeleton()}
  Promise.all([blGet('getBillMeta'),blGet('getBillBoard',{branch:S.br,type:BL.type}),blGet('getBillKpi',{scope:S.br,gran:BL.per,type:BL.type,n:8,inc06:BL.inc06}),blGet('getExplains',{},60000).catch(()=>({rows:{}}))]).then(([meta,bd,k,ex])=>{
    if(my!==BL.n||S.br!==el.dataset.br)return;
    const G={};meta.groups.forEach(g=>G[g.k]=g);const gs=meta.groups.slice().sort((a,b)=>a.ord-b.ord).map(g=>Object.assign({},g,bd.groups.find(x=>x.k===g.k)||{n:0,over:0,late:0}));
    const own=bd.rows.filter(r=>r.role==='own'),cnt=own.length,overN=own.filter(r=>r.over).length,lateN=own.filter(r=>r.late).length;
    const tile=g=>`<button class="bl-g ${BL.grp===g.k?'on':''} ${g.over||g.late?'bad':''} ${g.n?'':'z'}" data-g="${g.k}"><span class="bl-gt">${esc(G[g.k].n)}</span><span class="bl-gn">${g.n}</span><span class="bl-gs">${g.over?`เกินอายุ <b>${g.over}</b>`:'เกินอายุ 0'}${g.late?` · ล่าช้า <b>${g.late}</b>`:''}</span><span class="bl-gw">${esc(G[g.k].who)} · ${esc(G[g.k].lim)}</span></button>`;
    let rows=bd.rows.filter(r=>BL.grp==='trip'?r.role==='trip':BL.grp==='watch'?r.role==='watch':r.role==='own'&&(!BL.grp||r.g===BL.grp)&&(!BL.only||r.over||r.late));
    if(BL.grp==='trip'||BL.grp==='watch')rows=rows.filter(r=>!BL.only||r.over||r.late);
    const tot=rows.length,pill=r=>r.over?'<span class="bl-p over">เกินอายุ</span>':r.age>=r.lim-1?'<span class="bl-p near">ใกล้เกิน</span>':'<span class="bl-p ok">ปกติ</span>';
    el.innerHTML=`<div class="bl">
      <div class="bl-top"><h2>บิล · ${esc(cb?cb.name:S.br)}</h2><span class="bl-sub">ข้อมูล ณ ${esc(String(bd.asOf).slice(0,16))}</span></div>${blHead()}
      ${blKpiHtml(k,'สาขานี้ ')}
      <div class="bl-h3">งานที่ต้องจัดการ <small>${fmt(cnt)} ใบ · เกินอายุ ${fmt(overN)} · ล่าช้าตามกลุ่ม ${fmt(lateN)}</small></div>
      ${cnt?`<div class="bl-gs-w">${gs.filter(g=>g.n).map(tile).join('')}</div>`:`<div class="bl-empty">🎉 ไม่มีบิลค้างในความรับผิดชอบของสาขานี้</div>`}
      <div class="bl-ext">${bd.trip.n?`<button class="bl-x ${BL.grp==='trip'?'on':''}" data-g="trip">📦 บิลของเรากำลังเดินทาง <b>${fmt(bd.trip.n)}</b>${bd.trip.over?` · เกินอายุ <b class="r">${bd.trip.over}</b>`:''}<small>สร้างจากสาขานี้ แต่ตอนนี้อยู่กับสาขาอื่น — ดูอย่างเดียว</small></button>`:''}${bd.watch.n?`<button class="bl-x ${BL.grp==='watch'?'on':''}" data-g="watch">👁 เฝ้าดู (รอส่งต่อ / เคลียร์) <b>${fmt(bd.watch.n)}</b><small>ต้นทางเป็นสาขานี้ — ผู้รับผิดชอบหลักคือ DC ปัจจุบัน</small></button>`:''}</div>
      <div class="bl-lh"><b>${BL.grp==='trip'?'บิลของเรากำลังเดินทาง':BL.grp==='watch'?'เฝ้าดู':BL.grp?esc(G[BL.grp].n):'บิลทั้งหมด'}</b><span class="bl-sub">${fmt(tot)} ใบ</span>${BL.grp?'<button class="bl-clr" data-g="">ล้างตัวกรอง</button>':''}<span class="sp"></span><label class="bl-chk"><input type="checkbox" id="blOnly" ${BL.only?'checked':''}> เฉพาะเกินอายุ/ล่าช้า</label></div>
      <div class="bl-list">${rows.slice(0,BL.show).map(r=>{const e=ex.rows[r.b];return `<div class="bl-r ${r.over?'o':r.late?'l':''}"><div class="bl-b"><b>${esc(r.b)}</b><span>${esc(r.c)} · ${esc(r.st.replace(/^\S+\s*/,''))}${r.att?` · ครั้งที่ ${r.att}`:''}</span></div>
        <div class="bl-a"><div class="bl-ab"><i style="width:${Math.min(100,r.age/Math.max(1,r.lim)*100)}%;background:${r.over?'#D6453A':r.age>=r.lim-1?'#E0A93A':'#2E9E6B'}"></i></div><span>${r.age}/${r.lim} วัน ${pill(r)}</span></div>
        <div class="bl-w">${esc(r.org.replace(/^\d+\s*/,''))} → ${esc(r.dst.replace(/^\d+\s*/,''))}${r.role==='trip'?`<small>ตอนนี้อยู่ที่ ${esc((r.who||r.cur).replace(/^\d+\s*/,''))} · ${esc(G[r.g].n)}</small>`:`<small>${esc(G[r.g].n)}${r.sd!=null?' · ค้างสถานะนี้ '+r.sd+' วัน':''}</small>`}${r.late?`<small class="r">${esc(r.cause)}</small>`:''}</div>
        <div class="bl-e">${e?`<span class="bl-done" title="${esc(e.note||'')}">ชี้แจงแล้ว · ${esc(e.cat)}</span>`:''}${r.role==='own'&&(r.over||r.late)?`<button class="btn sm" data-ex="${esc(r.b)}">${e?'แก้ชี้แจง':'ชี้แจง'}</button>`:''}</div></div>`}).join('')||'<div class="bl-empty">ไม่มีรายการ</div>'}${tot>BL.show?`<button class="btn sm bl-more" id="blMore">แสดงเพิ่ม (${tot-BL.show})</button>`:''}</div>
      <div class="bl-foot">เกินอายุ = อายุนับจากวันสร้างบิล มากกว่า 7 วัน (แห้ง) / 5 วัน (เย็น) · ล่าช้า = ค้างในสถานะเกินเกณฑ์ของกลุ่ม${meta.since?` · เริ่มเก็บ KPI ${esc(meta.since)}`:''}</div></div>`;
    blBind(el,renderBill);
    el.querySelector('.bl-gs-w')&&(el.querySelector('.bl-gs-w').onclick=e=>{const b=e.target.closest('[data-g]');if(b){BL.grp=BL.grp===b.dataset.g?'':b.dataset.g;BL.show=60;renderBill()}});
    el.querySelector('.bl-ext').onclick=e=>{const b=e.target.closest('[data-g]');if(b){BL.grp=BL.grp===b.dataset.g?'':b.dataset.g;BL.show=60;renderBill()}};
    const cl=el.querySelector('.bl-clr');if(cl)cl.onclick=()=>{BL.grp='';renderBill()};
    el.querySelector('#blOnly').onchange=e=>{BL.only=e.target.checked?1:0;BL.show=60;renderBill()};
    const mo=el.querySelector('#blMore');if(mo)mo.onclick=()=>{BL.show+=100;renderBill()};
    el.querySelector('.bl-list').onclick=e=>{const b=e.target.closest('[data-ex]');if(b){const r=bd.rows.find(x=>x.b===b.dataset.ex);if(r)blExplain(r,ex.rows[r.b],G)}};
  }).catch(err=>{if(my!==BL.n)return;el.innerHTML=`<div class="bl-empty">โหลดข้อมูลบิลไม่ได้ (${esc(err.message)})<br><button class="btn sm" id="blRe" style="margin-top:10px">ลองใหม่</button><div class="bl-foot">ถ้าเพิ่งติดตั้ง ต้อง Deploy GAS บิล v3.41 ก่อน</div></div>`;const b=$('blRe');if(b)b.onclick=()=>{Object.keys(_blC).forEach(k=>delete _blC[k]);renderBill()}});
}
function blExplain(r,prev,G){
  Promise.all([blGet('getExplainCauses',{},600000)]).then(([cs])=>{
    const L=cs.filter(c=>!c.g||c.g.indexOf(r.o)>=0),ov=document.createElement('div');ov.className='bl-md';
    ov.innerHTML=`<div class="bl-mb"><h3>ชี้แจงบิล ${esc(r.b)}</h3><div class="bl-sub">${esc(G[r.g].n)} · ${esc(r.st)}<br>อายุ ${r.age}/${r.lim} วัน${r.late?' · '+esc(r.cause):''}</div>
      <div class="bl-ch">${L.map(c=>`<button data-c="${esc(c.c)}" class="${prev&&prev.cat===c.c?'on':''}">${esc(c.c)}</button>`).join('')}</div>
      <textarea id="blNote" rows="3" placeholder="รายละเอียดเพิ่มเติม / แผนแก้ไข (ถ้ามี)">${esc(prev?prev.note:'')}</textarea>
      <input id="blBy" placeholder="ชื่อผู้ชี้แจง" value="${esc((prev&&prev.by)||S.user||'')}">
      <div class="bl-ma"><button class="btn" id="blCancel">ยกเลิก</button><button class="btn pri" id="blSave">บันทึก</button></div></div>`;
    document.body.appendChild(ov);let cat=prev?prev.cat:'';
    ov.querySelector('.bl-ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;ov.querySelectorAll('.bl-ch button').forEach(x=>x.classList.toggle('on',x===b))};
    const close=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)close()};ov.querySelector('#blCancel').onclick=close;
    ov.querySelector('#blSave').onclick=()=>{const by=ov.querySelector('#blBy').value.trim(),note=ov.querySelector('#blNote').value.trim();
      if(!cat){toast('เลือกสาเหตุก่อน','bad');return}if(!by){toast('ใส่ชื่อผู้ชี้แจง','bad');return}
      fetch(BILL_API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveExplain',bill:r.b,branch:S.br,cat,note,by,plan:''})}).then(()=>{S.user=by;try{parent.postMessage({type:'bill:user',user:by},'*')}catch(e){}toast('บันทึกการชี้แจงแล้ว');close();Object.keys(_blC).forEach(k=>{if(/getExplains/.test(k))delete _blC[k]});setTimeout(renderBill,1200)}).catch(()=>toast('บันทึกไม่สำเร็จ ลองใหม่','bad'))}
  }).catch(e=>toast('โหลดรายการสาเหตุไม่ได้','bad'))
}

/* ---------- หน้าภาพรวมทุกสาขา (จัดอันดับ) ---------- */
const BL_TOP=[['all','ทุกหัวข้อ',null],['S','จัดรถเข้ารับ (Shop/DP → DC)','S'],['O','ปล่อยขนย้ายต้นทาง','O'],['T','ขนย้ายระหว่างทาง','T'],['D','ที่ปลายทาง / อื่นๆ','DWPQXFRCJKL']];
function renderBillNet(){
  const el=$('v-bln');if(!el)return;const my=++BL.nn;
  if(!el.dataset.on){el.dataset.on=1;el.innerHTML=blSkeleton()}
  Promise.all([blGet('getBillMeta'),blGet('getNetBoard',{type:BL.type}),blGet('getBillKpi',{scope:'',gran:BL.per,type:BL.type,n:8,inc06:BL.inc06})]).then(([meta,nb,k])=>{
    if(my!==BL.nn)return;const G={};meta.groups.forEach(g=>G[g.k]=g);
    const tp=BL_TOP.find(t=>t[0]===BL.topic)||BL_TOP[0],inReg=b=>{const x=BRANCHES.find(y=>y.code===b.c);return!S.reg||(x&&x.region===S.reg)};
    const all=(k.rank||[]).filter(inReg).map(b=>{const f=tp[2]?[...tp[2]].reduce((a,l)=>a+(b.fg[l]||0),0):b.fail;return Object.assign({},b,{f,p:b.tot?Math.round((1-f/b.tot)*1000)/10:null})}).filter(b=>b.p!=null).sort((a,b)=>a.p-b.p);
    const gd=all.filter(b=>b.pct>=BL_G).length,yl=all.filter(b=>b.pct<BL_G&&b.pct>=BL_Y).length,rd=all.length-gd-yl,sh=BL.all?all:all.slice(0,12),nm=b=>{const x=BRANCHES.find(y=>y.code===b.c);return x?x.name:b.b.replace(/^\d+\s*/,'')};
    const tabCnt=t=>all.filter(b=>{const f=t[2]?[...t[2]].reduce((a,l)=>a+(b.fg[l]||0),0):b.fail;return b.tot&&(1-f/b.tot)*100<BL_Y}).length;
    el.innerHTML=`<div class="bl">
      <div class="bl-top"><h2>บิล · ภาพรวมทุกสาขา</h2><span class="bl-sub">ข้อมูล ณ ${esc(String(nb.asOf).slice(0,16))}${S.reg?' · ภาค'+esc(S.reg):''}</span></div>${blHead()}
      ${blKpiHtml(k,'ทั้งเครือข่าย ')}
      ${all.length?`<div class="bl-dist"><i style="flex:${gd||.001};background:#2E9E6B"></i><i style="flex:${yl||.001};background:#E0A93A"></i><i style="flex:${rd||.001};background:#D6453A"></i></div><div class="bl-dl"><span><i style="background:#2E9E6B"></i>≥ ${BL_G}% · ${gd} สาขา</span><span><i style="background:#E0A93A"></i>${BL_Y}–${BL_G}% · ${yl} สาขา</span><span><i style="background:#D6453A"></i>&lt; ${BL_Y}% · ${rd} สาขา</span></div>`:''}
      <div class="bl-h3">บิลค้างทั้งเครือข่าย ณ ตอนนี้ <small>จำนวนสาขาที่มีบิลเกินอายุ/ล่าช้า</small></div>
      <div class="bl-gs-w">${nb.groups.sort((a,b)=>G[a.k].ord-G[b.k].ord).filter(g=>g.n).map(g=>`<div class="bl-g ${g.over||g.late?'bad':''}" style="cursor:default"><span class="bl-gt">${esc(G[g.k].n)}</span><span class="bl-gn">${fmt(g.n)}</span><span class="bl-gs">เกินอายุ <b>${fmt(g.over)}</b>${g.late?` · ล่าช้า <b>${fmt(g.late)}</b>`:''}</span><span class="bl-gw">${g.brn} สาขา · ${esc(G[g.k].who)}</span></div>`).join('')}</div>
      <div class="bl-card"><div class="bl-tabs" id="blTabs">${BL_TOP.map(t=>`<button data-t="${t[0]}" class="${BL.topic===t[0]?'on':''}">${esc(t[1])}${t[0]==='all'?'':`<span>${tabCnt(t)}</span>`}</button>`).join('')}</div>
      <div class="bl-lh"><b>${esc(tp[1])} · เรียงสาขาที่ต้องปรับปรุงก่อน</b><span class="bl-sub">${all.length} สาขา · งวด ${esc(k.rankPeriod||'')}</span></div>
      <div class="bl-tw"><table class="bl-t"><thead><tr><th>#</th><th>สาขา</th><th>ภาค</th><th>ทันอายุ</th><th>เกินอายุ</th><th>เทียบก่อนหน้า</th></tr></thead><tbody>${sh.map((b,i)=>{const d=b.prev!=null&&BL.topic==='all'?b.pct-b.prev:null;return `<tr data-c="${esc(b.c)}"><td class="rk">${i+1}</td><td><b>${esc(b.c)}</b> ${esc(nm(b))}</td><td><span class="bl-rg">${esc((BRANCHES.find(y=>y.code===b.c)||{}).region||'')}</span></td><td><div class="bl-pb"><div class="bl-pbb"><i style="width:${Math.max(4,(b.p-80)/20*100)}%;background:${blCol(b.p)}"></i></div><b style="color:${blCol(b.p)}">${b.p.toFixed(1)}%</b></div></td><td class="num">${b.f}<small> /${b.tot}</small></td><td class="${d==null?'':d>=0?'up':'dn'}">${d==null?'–':(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(1)}</td></tr>`}).join('')||'<tr><td colspan="6" class="bl-empty">ยังไม่มีบิลที่ครบกำหนดวัดผล</td></tr>'}</tbody></table></div>
      ${all.length>12?`<div class="bl-mw"><button class="btn sm" id="blAll">${BL.all?'แสดงเฉพาะ 12 อันดับแรก':'แสดงทั้งหมด ('+all.length+' สาขา)'}</button></div>`:''}</div>
      <div class="bl-foot">กดแถวสาขาเพื่อเปิดแท็บบิลของสาขานั้น · เกณฑ์สี ${BL_G}% / ${BL_Y}%${meta.since?' · เริ่มเก็บ KPI '+esc(meta.since):''}</div></div>`;
    blBind(el,renderBillNet);
    $('blTabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){BL.topic=b.dataset.t;renderBillNet()}};
    const a=$('blAll');if(a)a.onclick=()=>{BL.all=!BL.all;renderBillNet()};
    el.querySelector('tbody').onclick=e=>{const tr=e.target.closest('tr[data-c]');if(tr)blGo(tr.dataset.c)};
  }).catch(err=>{if(my!==BL.nn)return;el.innerHTML=`<div class="bl"><div class="bl-empty">โหลดข้อมูลบิลไม่ได้ (${esc(err.message)})<br><button class="btn sm" id="blRe" style="margin-top:10px">ลองใหม่</button></div></div>`;const b=$('blRe');if(b)b.onclick=()=>{Object.keys(_blC).forEach(k=>delete _blC[k]);renderBillNet()}});
}
function blGo(code){if(S.lock&&code!==S.lock)return;if(window.parent!==window)parent.postMessage({type:'bill:go',code},'*');else{S.br=code;renderBill()}}


function go(){if(PAGE==='net'){$('v-bln').classList.remove('hidden');renderBillNet()}else{$('tab-bl').classList.remove('hidden');if(S.br)renderBill()}}
addEventListener('message',e=>{const d=e.data||{};
  if(d.type==='bill:ctx'){BRANCHES=d.branches||[];S.user=d.user||S.user;if(d.lock)S.lock=d.lock;const ch=(d.reg||'')!==S.reg||(PAGE==='br'&&d.br&&d.br!==S.br);S.reg=d.reg||'';if(PAGE==='br'&&d.br)S.br=d.br;if(ch||!go.done){go.done=1;go()}}
  if(d.type==='bill:refresh'){Object.keys(_blC).forEach(k=>delete _blC[k]);go()}});
if(window.parent!==window)parent.postMessage({type:'bill:ready'},'*');
setTimeout(()=>{if(!go.done){go.done=1;go()}},1500);
</script></body></html>
