<script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>Math.round(n||0).toLocaleString();
function jsonp(base,params,ms){return new Promise((ok,no)=>{const cb='jp'+Date.now().toString(36)+Math.floor(Math.random()*1e4),sc=document.createElement('script');
  const t=setTimeout(()=>{fin();no(new Error('timeout'))},ms||20000);function fin(){clearTimeout(t);delete window[cb];sc.remove()}
  window[cb]=d=>{fin();ok(d)};sc.onerror=()=>{fin();no(new Error('network'))};sc.src=base+'?'+new URLSearchParams({...params,callback:cb});document.head.appendChild(sc)})}
function toast(t,k){const el=$('toast');el.textContent=t;el.className=k==='bad'?'bad':'';el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',2200)}
function ldHtml(m,h){return`<div class="ld" style="min-height:${h||120}px"><div class="ld-g"><i style="width:42%"></i><i style="width:88%"></i><i style="width:70%"></i><i style="width:94%"></i></div><span>${esc(m||'กำลังโหลด…')}</span></div>`}
const QS=new URLSearchParams(location.search),PAGE=QS.get('page')==='net'?'net':QS.get('page')==='admin'?'admin':'br';
const S={br:QS.get('br')||'',reg:QS.get('reg')||'',user:'',lock:QS.get('lock')?QS.get('br'):''};let BRANCHES=[];
/* ================= บิล: KPI บิลทันอายุ + งานบิลค้างตามกลุ่ม (GAS บิล v3.41) ================= */
const BILL_API='https://script.google.com/macros/s/AKfycbzup6FaPt9rEqNP9UzEW5FLna6IGs0QRmnUv907Be-WTwd2uGjX8NvKX3hNNKUhBdmAkA/exec';
const BIC={trUp:'<path d="M7 17 17 7M8 7h9v9"/>',trDn:'<path d="M7 7l10 10M17 8v9H8"/>',sparkle:'<path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 3v4M21 5h-4"/>',box:'<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',checkCircle:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',circle:'<circle cx="12" cy="12" r="10"/>'};
const ic=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.15em">${BIC[n]||''}</svg>`;
const BL={mode:(function(){try{return localStorage.getItem('bl_mode')==='kpi'?'kpi':'work'}catch(e){return'work'}})(),type:'',per:'month',grp:'',only:0,inc06:0,show:60,topic:'all',all:false,n:0,nn:0},BL_G=95,BL_Y=92;
const blCol=p=>p==null?'#C9CFD8':p>=BL_G?'#2E9E6B':p>=BL_Y?'#E0A93A':'#D6453A',_blC={};
function blGet(action,params,ttl){const key=action+'|'+JSON.stringify(params||{}),c=_blC[key];if(c&&Date.now()-c.t<(ttl||300000))return c.p;
  const p=jsonp(BILL_API,Object.assign({action},params||{}),45000).then(r=>{if(!r||!r.ok)throw new Error((r&&r.error)||'ระบบบิลไม่ตอบกลับ');return r.data}).catch(e=>{delete _blC[key];throw e});_blC[key]={t:Date.now(),p};return p}
const blPct=p=>p==null?'–':p.toFixed(1),blDelta=(a,b)=>a==null||b==null?'':`<span class="bl-d ${a>=b?'up':'dn'}">${a>=b?ic('trUp',12):ic('trDn',12)} ${Math.abs(a-b).toFixed(1)} vs ${BL.per==='week'?'สัปดาห์':'เดือน'}ก่อน</span>`;
const blLast=ps=>{let i=ps.length-1;while(i>0&&ps[i].pct==null)i--;return i};

function xlsxSerialToIso_(v) {                    // ตัวเลข serial ของ Excel -> 'yyyy-MM-dd'
  if (typeof v !== 'number' || !isFinite(v)) return '';
  const d = new Date(Math.round((v - 25569) * 86400000));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function thaiDmyToIso_(s) {                       // 'dd/mm/yyyy' (พ.ศ. หรือ ค.ศ.) -> 'yyyy-MM-dd'
  const m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return '';
  let y = +m[3]; if (y > 2400) y -= 543;
  return y + '-' + String(+m[2]).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0');
}
function timeToStr_(v) {                           // 'HH:mm:ss' หรือเศษส่วนของวัน -> 'HH:mm:ss'
  if (typeof v === 'number' && isFinite(v)) {
    const s = Math.round((v % 1) * 86400);
    return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  const m = String(v || '').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? String(+m[1]).padStart(2, '0') + ':' + m[2] + ':' + (m[3] || '00') : '';
}
function dateCellToIso_(v) { return typeof v === 'number' ? xlsxSerialToIso_(v) : (thaiDmyToIso_(v) || ''); }
/** rows = แถวของ sheet แบบ array-of-arrays (header:1) — รองรับ NIMEX016027 (main) และ NIMEX016371 (clear): หาหัวตารางเอง ตรวจชนิดรายงานจากชื่อคอลัมน์ */
function parseReportRows_(rows) {
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 40); i++) { if (String((rows[i] || [])[1] || '').trim() === 'เลขที่บิล') { h = i; break; } }
  if (h < 0) return { error: 'ไม่พบหัวตาราง "เลขที่บิล" — ไม่ใช่รายงาน NIMEX016027/016371 หรือรูปแบบเปลี่ยน', bills: [] };
  const col = {}; (rows[h] || []).forEach(function (t, i) { const k = String(t || '').trim(); if (k && col[k] === undefined) col[k] = i; });
  const source = col['จำนวนวันคงค้างตามสถานะ'] !== undefined ? 'clear' : 'main';
  const pick = function (names) { for (let i = 0; i < names.length; i++) if (col[names[i]] !== undefined) return col[names[i]]; return -1; };
  const C = {
    bill: pick(['เลขที่บิล']), created: pick(['วันที่บิล']), time: pick(['เวลา']), origin: pick(['DCต้นทาง', 'DC ต้นทาง']), dest: pick(['DCปลายทาง', 'DC ปลายทาง']),
    current: pick(['DC ปัจจุบัน']), status: pick(['สถานะบิล']), type: pick(['ประเภทบิล']), due: pick(['วันที่กำหนดส่ง', 'กำหนดส่ง (SLA)']),
    arrive: pick(['วันที่สินค้าถึง DC ปลายทาง', 'วันที่รับเข้า DC']), customer: pick(['ลูกค้าที่สร้างบิล', 'บริษัท ผู้ส่ง']),
    stDays: pick(['จำนวนวันคงค้างตามสถานะ']), reason: pick(['สาเหตุที่คงค้าง', 'สาเหตุหลักที่ส่งของไม่ได้ ครั้งที่ 1'])
  };
  const miss = ['bill', 'created', 'origin', 'dest', 'current', 'status'].filter(function (k) { return C[k] < 0; });
  if (miss.length) return { error: 'ขาดคอลัมน์สำคัญ: ' + miss.join(', '), bills: [] };
  const g = function (r, k) { return C[k] < 0 ? '' : r[C[k]]; };
  // ช่วงวันที่ของรายงาน main อยู่ในบรรทัดหัวรายงาน เช่น "ตั้งแต่ 01/10/2569 ถึง 15/10/2569"
  let rangeFrom = '', rangeTo = '';
  for (let i = 0; i < h; i++) { const t = String((rows[i] || [])[0] || ''); const m = t.match(/ตั้งแต่\s+(\d{1,2}\/\d{1,2}\/\d{4})\s*ถึง\s*(\d{1,2}\/\d{1,2}\/\d{4})/); if (m && !/สถานะ/.test(t)) { rangeFrom = thaiDmyToIso_(m[1]); rangeTo = thaiDmyToIso_(m[2]); } }
  const bills = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const bill = String(g(r, 'bill') == null ? '' : g(r, 'bill')).trim();
    if (!bill || !/^\d{8,}$/.test(bill)) continue;
    const o = {
      bill: bill, createdDate: dateCellToIso_(g(r, 'created')), createdTime: timeToStr_(g(r, 'time')),
      origin: String(g(r, 'origin') || '').trim(), dest: String(g(r, 'dest') || '').trim(), current: String(g(r, 'current') || '').trim(),
      status: String(g(r, 'status') || '').trim(), billType: String(g(r, 'type') || '').trim(), dueDate: dateCellToIso_(g(r, 'due')),
      arriveDate: dateCellToIso_(g(r, 'arrive')), customer: String(g(r, 'customer') || '').trim(), reason: String(g(r, 'reason') || '').trim()
    };
    if (source === 'clear') { const d = parseFloat(g(r, 'stDays')); o.stDays = isNaN(d) ? '' : d; }
    bills.push(o);
  }
  return { bills: bills, source: source, rangeFrom: rangeFrom, rangeTo: rangeTo };
}

    $('shCp').onclick=async()=>{try{await navigator.clipboard.writeText($('shTxt').value);toast('คัดลอกข้อความแล้ว')}catch(e){$('shTxt').select();document.execCommand('copy');toast('คัดลอกข้อความแล้ว')}};
    $('shPng').onclick=async()=>{for(let i=0;i<files.length;i++){shDl(files[i],files[i].name);await new Promise(r=>setTimeout(r,350))}toast('ดาวน์โหลดรูปแล้ว')};
    $('shSend').onclick=async()=>{const t=$('shTxt').value;try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text:t,title:'รายงานส่งต่อบิล KEX'})}else if(navigator.share){await navigator.share({text:t,title:'รายงานส่งต่อบิล KEX'});toast('เครื่องนี้แนบรูปไม่ได้ — ใช้ปุ่มดาวน์โหลด PNG แล้วแนบเอง')}else{await navigator.clipboard.writeText(t);toast('คัดลอกข้อความแล้ว — ดาวน์โหลด PNG แล้วแนบใน LINE')}}catch(e){if(e.name!=='AbortError')toast('แชร์ไม่สำเร็จ — ใช้ปุ่มคัดลอก/ดาวน์โหลดแทน','bad')}};
  }catch(e){$('shBody').innerHTML=`<div class="bl-empty">สร้างรายงานไม่ได้ (${esc(e.message)})</div>`}}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#blShare'))(BL.mode==='kex'?kxShareOpen:blShareOpen)()});

</script></body></html>
