function xlsxSerialToIso_(v) {                    // ตัวเลข serial ของ Excel -> 'yyyy-MM-dd'
  if (typeof v !== 'number' || !isFinite(v)) return '';
  const d = new Date(Math.round((v - 25569) * 86400000));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function thaiDmyToIso_(s) {                       // 'dd/mm/yyyy' (พ.ศ. หรือ ค.ศ.) -> 'yyyy-MM-dd'
  const m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return '';
  let y = +m[3]; if (y > 2400) y -= 543;
  return y + '-' + String(+m[2]).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0');
}
function timeToStr_(v) {                           // 'HH:mm:ss' หรือเศษส่วนของวัน -> 'HH:mm:ss'
  if (typeof v === 'number' && isFinite(v)) {
    const s = Math.round((v % 1) * 86400);
    return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  const m = String(v || '').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? String(+m[1]).padStart(2, '0') + ':' + m[2] + ':' + (m[3] || '00') : '';
}
function dateCellToIso_(v) { return typeof v === 'number' ? xlsxSerialToIso_(v) : (thaiDmyToIso_(v) || ''); }
/** rows = แถวของ sheet แบบ array-of-arrays (header:1) — รองรับ NIMEX016027 (main) และ NIMEX016371 (clear): หาหัวตารางเอง ตรวจชนิดรายงานจากชื่อคอลัมน์ */
function parseReportRows_(rows) {
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 40); i++) { if (String((rows[i] || [])[1] || '').trim() === 'เลขที่บิล') { h = i; break; } }
  if (h < 0) return { error: 'ไม่พบหัวตาราง "เลขที่บิล" — ไม่ใช่รายงาน NIMEX016027/016371 หรือรูปแบบเปลี่ยน', bills: [] };
  const col = {}; (rows[h] || []).forEach(function (t, i) { const k = String(t || '').trim(); if (k && col[k] === undefined) col[k] = i; });
  const source = col['จำนวนวันคงค้างตามสถานะ'] !== undefined ? 'clear' : 'main';
  const pick = function (names) { for (let i = 0; i < names.length; i++) if (col[names[i]] !== undefined) return col[names[i]]; return -1; };
  const C = {
    bill: pick(['เลขที่บิล']), created: pick(['วันที่บิล']), time: pick(['เวลา']), origin: pick(['DCต้นทาง', 'DC ต้นทาง']), dest: pick(['DCปลายทาง', 'DC ปลายทาง']),
    current: pick(['DC ปัจจุบัน']), status: pick(['สถานะบิล']), type: pick(['ประเภทบิล']), due: pick(['วันที่กำหนดส่ง', 'กำหนดส่ง (SLA)']),
    arrive: pick(['วันที่สินค้าถึง DC ปลายทาง', 'วันที่รับเข้า DC']), customer: pick(['ลูกค้าที่สร้างบิล', 'บริษัท ผู้ส่ง']),
    stDays: pick(['จำนวนวันคงค้างตามสถานะ']), reason: pick(['สาเหตุที่คงค้าง', 'สาเหตุหลักที่ส่งของไม่ได้ ครั้งที่ 1'])
  };
  const miss = ['bill', 'created', 'origin', 'dest', 'current', 'status'].filter(function (k) { return C[k] < 0; });
  if (miss.length) return { error: 'ขาดคอลัมน์สำคัญ: ' + miss.join(', '), bills: [] };
  const g = function (r, k) { return C[k] < 0 ? '' : r[C[k]]; };
  // ช่วงวันที่ของรายงาน main อยู่ในบรรทัดหัวรายงาน เช่น "ตั้งแต่ 01/10/2569 ถึง 15/10/2569"
  let rangeFrom = '', rangeTo = '';
  for (let i = 0; i < h; i++) { const t = String((rows[i] || [])[0] || ''); const m = t.match(/ตั้งแต่\s+(\d{1,2}\/\d{1,2}\/\d{4})\s*ถึง\s*(\d{1,2}\/\d{1,2}\/\d{4})/); if (m && !/สถานะ/.test(t)) { rangeFrom = thaiDmyToIso_(m[1]); rangeTo = thaiDmyToIso_(m[2]); } }
  const bills = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const bill = String(g(r, 'bill') == null ? '' : g(r, 'bill')).trim();
    if (!bill || !/^\d{8,}$/.test(bill)) continue;
    const o = {
      bill: bill, createdDate: dateCellToIso_(g(r, 'created')), createdTime: timeToStr_(g(r, 'time')),
      origin: String(g(r, 'origin') || '').trim(), dest: String(g(r, 'dest') || '').trim(), current: String(g(r, 'current') || '').trim(),
      status: String(g(r, 'status') || '').trim(), billType: String(g(r, 'type') || '').trim(), dueDate: dateCellToIso_(g(r, 'due')),
      arriveDate: dateCellToIso_(g(r, 'arrive')), customer: String(g(r, 'customer') || '').trim(), reason: String(g(r, 'reason') || '').trim()
    };
    if (source === 'clear') { const d = parseFloat(g(r, 'stDays')); o.stDays = isNaN(d) ? '' : d; }
    bills.push(o);
  }
  return { bills: bills, source: source, rangeFrom: rangeFrom, rangeTo: rangeTo };
}

(function(){let t=null,cur=null;const mk=()=>{if(!t){t=document.createElement('div');t.id='gTip';document.body.appendChild(t)}return t},

const shNm=(c,b)=>{const x=BRANCHES.find(y=>y.code===c);return x?x.name:String(b||c).replace(/^\d+\s*/,'')};
async function blShareData(all){
  const scope=(PAGE==='net'||all)?'':S.br,scLbl=scope?shNm(scope,scope):('ทุกสาขา'+(S.reg?' · ภาค'+S.reg:''));
  const [meta,ol,dly]=await Promise.all([blGet('getBillMeta'),blGet('getOverList',{branch:scope},120000),blGet('getBillDaily',{scope,type:'',n:30,inc06:0},120000).catch(()=>null)]);
  const G={};meta.groups.forEach(g=>G[g.k]=g);
  const inReg=r=>{if(all||scope||!S.reg)return true;const x=BRANCHES.find(y=>y.code===codeOfBr(r.who));return x&&x.region===S.reg};
  const rootOf=c=>{let x=BRANCHES.find(y=>y.code===c),n=0;while(x&&x.parent&&n++<5){const p=BRANCHES.find(y=>y.code===x.parent);if(!p)break;x=p}return x?x.code:c},rc=r=>scope?codeOfBr(r.who):rootOf(codeOfBr(r.who));
  const rows=ol.rows.filter(inReg).map(r=>Object.assign({},r,{bc:rc(r),bn:shNm(rc(r),r.who),gn:(G[r.g]||{n:r.g}).n,gw:(G[r.g]||{who:''}).who,ord:(G[r.g]||{ord:99}).ord,ov:r.age-r.lim})).sort((x,y)=>y.age-x.age);
  const tot={A:{n:0,over:0},C:{n:0,over:0}};['A','C'].forEach(t=>{tot[t].over=rows.filter(r=>r.t===t).length});
  tot.A.n=ol.tot.A.n;tot.C.n=ol.tot.C.n;
  if(!scope&&S.reg){/* กรองภาค: ไม่มียอดค้างรวมรายภาค → ใช้เฉพาะจำนวนเกินอายุ */tot.A.n=0;tot.C.n=0}
  const L=((dly&&dly.legacy)||[]).filter(x=>x.pct!=null),lg=L.length?L[L.length-1]:null,lg0=L.length>1?L[L.length-2]:null;
  return{scope,scLbl,asOf:String(ol.asOf).slice(0,16),meta,G,rows,tot,lg,lg0,dly,br:!!scope}}
function blShareAgg(D){
  const by={};D.rows.forEach(r=>{const o=by[r.bc]||(by[r.bc]={c:r.bc,n:r.bn,A:0,C:0,mx:0,o15:0,o30:0});o[r.t]++;o.mx=Math.max(o.mx,r.age);if(r.age>=15)o.o15++;if(r.age>30)o.o30++});
  const brs=Object.values(by).sort((a,b)=>b.o15-a.o15||(b.A+b.C)-(a.A+a.C)||b.mx-a.mx);
  const gg={};D.rows.forEach(r=>{const o=gg[r.g]||(gg[r.g]={k:r.g,n:r.gn,who:r.gw,ord:r.ord,A:0,C:0});o[r.t]++});
  return{brs,grp:Object.values(gg).sort((a,b)=>(b.A+b.C)-(a.A+a.C))}}
function blShareText(D){
  const g=blShareAgg(D),a=D.tot.A,c=D.tot.C,ov=D.rows.length,act=a.n+c.n,pct=act?(ov/act*100).toFixed(1):null,f=n=>fmt(n),n15=D.rows.filter(r=>r.age>=15).length;
  const L=[`📦 รายงานการจัดการบิล · ${D.scLbl}`,`🕒 ข้อมูล ณ ${D.asOf}`];
  L.push(act?`บิลค้าง ${f(act)} บิล · เกินอายุ ${f(ov)} บิล (${pct}%)`:`บิลเกินอายุ ${f(ov)} บิล`);
  L.push(`• แห้ง (เกิน 7 วัน) ${f(a.over)} บิล`+(a.n?` จาก ${f(a.n)}`:''),`• เย็น (เกิน 5 วัน) ${f(c.over)} บิล`+(c.n?` จาก ${f(c.n)}`:''));
  if(ov)L.push(`บิลเก่ากว่า 15 วัน ${f(n15)} บิล · เก่าสุด ${D.rows[0].age} วัน`);
  if(D.lg)L.push(`ทันอายุล่าสุด ${D.lg.pct.toFixed(1)}%`+(D.lg0?` (${D.lg.pct>=D.lg0.pct?'▲':'▼'} ${Math.abs(D.lg.pct-D.lg0.pct).toFixed(1)} จากวันก่อน)`:''));
  if(ov)L.push('',`🔴 บิลเก่าสุด 5 บิล`,...D.rows.slice(0,5).map((r,i)=>`${i+1}. ${r.b} — ${r.age} วัน (${r.t==='A'?'แห้ง':'เย็น'}) ${D.br?r.gn:r.bn}`));
  if(!D.br&&g.brs.length)L.push('',`📌 สาขาที่ต้องไล่`,...g.brs.slice(0,3).map(b=>`• ${b.n} — เก่า ≥ 15 วัน ${b.o15} บิล · รวม ${b.A+b.C} บิล (เก่าสุด ${b.mx} วัน)`));
  {const OW=spOwData(D);L.push('','👥 แยกผู้รับผิดชอบ',...OW.map(w=>`• ${w.o.n}: ${f(w.n)} บิล (เกิน 30 วัน ${f(w.o30)} · เก่าสุด ${w.mx||0} วัน)`))}
  L.push('','📎 รายละเอียดครบทุกบิลในไฟล์ Excel (ชีต "บิลเก่าสุด")',`🔗 ${SHARE_LINK}`);return L.join('\n')}

const SP_CSS=`.shp{width:794px;height:1123px;background:#fff;color:#141B26;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;position:relative;overflow:hidden;padding:34px 40px 0;box-sizing:border-box}
.shp *{box-sizing:border-box}.shp h1{margin:0;font-size:25px;line-height:1.2}.shp .sub{color:#5A6577;font-size:12.5px;margin-top:4px}
.shp .bar{height:5px;background:#1c3245;border-radius:3px;margin:12px 0 16px;position:relative}.shp .bar i{position:absolute;left:0;top:0;height:5px;width:90px;background:#2BA6C9;border-radius:3px}
.shp .kr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.shp .k{border:1.5px solid #E6EAF0;border-radius:14px;padding:11px 14px}.shp .k b{display:block;font-size:30px;line-height:1.1}.shp .k span{font-size:11.5px;color:#5A6577}
.shp .k.r b{color:#D6453A}.shp h3{font-size:14px;margin:14px 0 7px}.shp h3 small{font-weight:400;color:#8A93A3;margin-left:6px;font-size:11.5px}
.shp .ty{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shp .ty>div{border-radius:14px;padding:11px 14px;border:1.5px solid #E6EAF0;border-left-width:6px}
.shp .ty b{font-size:26px;display:block;line-height:1.15}.shp .ty span{font-size:11.5px;color:#5A6577}
.shp table{width:100%;border-collapse:collapse;font-size:12px}.shp table.wk td,.shp table.wk th{padding-left:3px;padding-right:5px}.shp table.wk.cp td{height:21px;padding-top:0;padding-bottom:0}.shp table.dn td{height:var(--rh);padding-top:0;padding-bottom:0;font-size:var(--fs);line-height:1.05}.shp table.dn th{padding-bottom:3px}.shp table.dn td small{font-size:calc(var(--fs) - 1px)}.shp th{text-align:left;color:#8A93A3;font-weight:500;font-size:11px;padding:0 6px 5px;border-bottom:1.5px solid #E6EAF0}.shp td{height:25px;padding:0 6px;border-bottom:1px solid #F0F2F6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.shp tr.bt td{border-top:1px solid #E6EAF0}.shp td.n,.shp th.n{text-align:right}.shp .gh td{background:#F5F7FA;font-weight:700;height:30px;border-bottom:0;font-size:12.5px;max-width:none}.shp .gh small{font-weight:400;color:#5A6577;margin-left:8px}

  const M=kxMx(D,5,6);let mxh='';

    dsm=`<h3 style="margin-top:2px">สรุปเบื้องต้น<small>ชิ้น · Diff = DC สแกนส่งมอบ − รวมส่งต่อ · − ยังสแกนไม่ครบ · + สแกนบิลเก่าเพิ่ม</small></h3><table class="rp" style="margin-bottom:6px"><thead><tr><th>ช่วง</th><th class="r">EDI</th><th class="r">NCP</th><th class="r">รวมส่งต่อ</th><th class="r">DC สแกนส่งมอบ</th><th class="r">Diff</th></tr></thead><tbody>${sr('วันนี้',kxD(d),tr.Ep,tr.Np,tr.fp,t1.sP)}${sr(PL,X.from<d?kxD(X.from)+' – '+kxD(d):kxD(d),T.Ep,T.Np,T.fp,S2.tot.sP)}</tbody></table>`;
  const p1=`<div class="shp">${kxDayHead(X,'สรุปรายงานประจำวัน · KEX',1)}${dsm}<div class="dyg">${tdy}${mtd}</div>${mxh}<h3>ประเภท RA<small>${PL} · ส่งต่อให้ KEX · ชิ้น</small></h3><div class="rac">${rac}</div>${stH}${spFoot(D,1,3)}</div>`;
  const rgm={};S1.regs.forEach(R=>R.rows.forEach(o=>rgm[o.c]=R.k));
  let pl=S1.all.filter(o=>o.pP).sort((a,b)=>b.pP-a.pP||b.mx-a.mx),oth3=null;const NMAX=44;

  const p4=kxDayCause(X);

function kxDayText(X){const D=X.D,S1=X.S1,t1=S1.tot,T=D.tot,d=X.d,PL=kxPLbl(),tr=D.days.find(r=>r.d===d)||{fp:0,Ep:0,Np:0},mx=Math.max(0,...S1.all.map(o=>o.mx));

   'สรุป วันนี้: EDI '+fmt(tr.Ep||0)+' · NCP '+fmt(tr.Np||0)+' · รวม '+fmt(tr.fp)+' · DC สแกน '+fmt(t1.sP)+' · Diff '+(t1.sP-tr.fp>0?'+':t1.sP-tr.fp<0?'−':'')+fmt(Math.abs(tr.fp-t1.sP)),
   'วันนี้: ส่งต่อ '+fmt(tr.fp)+' · สแกนส่งมอบ '+fmt(t1.sP)+(t1.old?' (บิลเก่า '+fmt(t1.old)+')':'')+' · ค้างข้ามวัน '+fmt(t1.pP)+' ชิ้น'+(t1.pB?' (นานสุด '+mx+' วัน)':''),

  L.push('ดูรายละเอียด: https://wuttinuntn-design.github.io/NIM_MANPOWER/');return L.join('\n')}
async function kxPng(pages){

  const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;z-index:-1';host.innerHTML=`<style>${SP_CSS}${KX_CSS}${KX_CSS2}${KX_DTB_CSS}${KX_DAY_CSS}</style>`+pages.join('');document.body.appendChild(host);
  const out=[];try{for(const el of host.querySelectorAll('.shp')){const cv=await h2c(el,{scale:2,backgroundColor:'#fff',useCORS:true});const blob=await new Promise(r=>cv.toBlob(r,'image/png'));out.push({blob,url:URL.createObjectURL(blob)})}}finally{host.remove()}return out}

      try{KX.r='c';KX.from=mf;KX.to=e;const D2=await kxData();KX.r='m';const X=await kxDayData(D2,[mf,e]);pgs=kxDayPages(X,true);txt2=kxDayText(X)}finally{KX.r=s0.r;KX.from=s0.f;KX.to=s0.t;KX.sd=s0.sd}}
    const imgs=await kxPng(pgs);ov._u=imgs.map(x=>x.url);
