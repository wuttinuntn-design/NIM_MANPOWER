<script>
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>Math.round(n||0).toLocaleString();
function jsonp(base,params,ms){return new Promise((ok,no)=>{const cb='jp'+Date.now().toString(36)+Math.floor(Math.random()*1e4),sc=document.createElement('script');
  const t=setTimeout(()=>{fin();no(new Error('timeout'))},ms||20000);function fin(){clearTimeout(t);delete window[cb];sc.remove()}
  window[cb]=d=>{fin();ok(d)};sc.onerror=()=>{fin();no(new Error('network'))};sc.src=base+'?'+new URLSearchParams({...params,callback:cb});document.head.appendChild(sc)})}
function toast(t,k){const el=$('toast');el.textContent=t;el.className=k==='bad'?'bad':'';el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',2200)}
function ldHtml(m,h){return`<div class="ld" style="min-height:${h||120}px"><div class="ld-g"><i style="width:42%"></i><i style="width:88%"></i><i style="width:70%"></i><i style="width:94%"></i></div><span>${esc(m||'กำลังโหลด…')}</span></div>`}
const QS=new URLSearchParams(location.search),PAGE=QS.get('page')==='net'?'net':QS.get('page')==='admin'?'admin':'br';
const S={br:QS.get('br')||'',reg:QS.get('reg')||'',user:'',lock:QS.get('lock')?QS.get('br'):''};let BRANCHES=[];
/* ================= บิล: KPI บิลทันอายุ + งานบิลค้างตามกลุ่ม (GAS บิล v3.41) ================= */
const BILL_API='https://script.google.com/macros/s/AKfycbzup6FaPt9rEqNP9UzEW5FLna6IGs0QRmnUv907Be-WTwd2uGjX8NvKX3hNNKUhBdmAkA/exec';
const BIC={trUp:'<path d="M7 17 17 7M8 7h9v9"/>',trDn:'<path d="M7 7l10 10M17 8v9H8"/>',sparkle:'<path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 3v4M21 5h-4"/>',box:'<path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5M12 13v8"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',checkCircle:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',circle:'<circle cx="12" cy="12" r="10"/>'};
const ic=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-.15em">${BIC[n]||''}</svg>`;
const BL={mode:(function(){try{return localStorage.getItem('bl_mode')==='kpi'?'kpi':'work'}catch(e){return'work'}})(),type:'',per:'month',grp:'',only:0,inc06:0,show:60,topic:'all',all:false,n:0,nn:0},BL_G=95,BL_Y=92;
const blCol=p=>p==null?'#C9CFD8':p>=BL_G?'#2E9E6B':p>=BL_Y?'#E0A93A':'#D6453A',_blC={};
function blGet(action,params,ttl){const key=action+'|'+JSON.stringify(params||{}),c=_blC[key];if(c&&Date.now()-c.t<(ttl||300000))return c.p;
  const p=jsonp(BILL_API,Object.assign({action},params||{}),45000).then(r=>{if(!r||!r.ok)throw new Error((r&&r.error)||'ระบบบิลไม่ตอบกลับ');return r.data}).catch(e=>{delete _blC[key];throw e});_blC[key]={t:Date.now(),p};return p}
const blPct=p=>p==null?'–':p.toFixed(1),blDelta=(a,b)=>a==null||b==null?'':`<span class="bl-d ${a>=b?'up':'dn'}">${a>=b?ic('trUp',12):ic('trDn',12)} ${Math.abs(a-b).toFixed(1)} vs ${BL.per==='week'?'สัปดาห์':'เดือน'}ก่อน</span>`;
const blLast=ps=>{let i=ps.length-1;while(i>0&&ps[i].pct==null)i--;return i};
function blStamp(p){return p.final?`<span class="bl-st fin">${ic('lock',12)} KPI ${esc(p.label)} · ประทับ ${esc(String(p.at).slice(5,16))}</span>`:BL.per==='week'?`<span class="bl-st pre">รายสัปดาห์ · ${p.open?'ยังไม่จบสัปดาห์':'ไม่ประทับ'}</span>`:`<span class="bl-st pre">${p.open?'KPI เบื้องต้น · ยังไม่ล็อก':'จบเดือนแล้ว · รอประทับ'}</span>`}
function blBars(ps,idx){return `<div class="bl-bars">${ps.map((p,i)=>`<i class="${i===idx?'cur':''}" data-t="${esc(p.label)} · ${blPct(p.pct)}%${p.pct==null?'':' ('+p.fail+'/'+p.tot+')'}" style="height:${p.pct==null?8:Math.max(10,(p.pct-85)/15*100)}%;background:${blCol(p.pct)}"></i>`).join('')}</div><div class="bl-ax"><span>${esc(ps[0].label)}</span><span>${esc(ps[ps.length-1].label)}</span></div>`}
function blHead(netMode){const K=BL.mode==='kpi';return `<div class="bl-tool"><div class="bl-seg" id="blMode"><button data-v="work" class="${!K?'on':''}">จัดการบิล</button><button data-v="kpi" class="${K?'on':''}">KPI ทันอายุ</button></div><div class="bl-seg" id="blType"><button data-v="" class="${BL.type===''?'on':''}">รวม</button><button data-v="A" class="${BL.type==='A'?'on':''}">ของแห้ง</button><button data-v="C" class="${BL.type==='C'?'on':''}">ของเย็น</button></div>${K?`<div class="bl-seg" id="blPer"><button data-v="week" class="${BL.per==='week'?'on':''}">สัปดาห์</button><button data-v="month" class="${BL.per==='month'?'on':''}">เดือน</button></div>`:''}<span style="margin-left:auto"></span><button class="btn sm" id="blShare" style="display:inline-flex;align-items:center;gap:6px">${ic('share',14)} แชร์รายงาน</button>${K?`<label class="bl-chk"><input type="checkbox" id="blInc" ${BL.inc06?'checked':''}> รวมกลุ่มรอเอกสาร (06)</label>`:''}</div>`}

  const m = String(s || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

  let y = +m[3]; if (y > 2400) y -= 543;

}
function timeToStr_(v) {                           // 'HH:mm:ss' หรือเศษส่วนของวัน -> 'HH:mm:ss'
  if (typeof v === 'number' && isFinite(v)) {
    const s = Math.round((v % 1) * 86400);
    return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  const m = String(v || '').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);

/** rows = แถวของ sheet แบบ array-of-arrays (header:1) — รองรับ NIMEX016027 (main) และ NIMEX016371 (clear): หาหัวตารางเอง ตรวจชนิดรายงานจากชื่อคอลัมน์ */
function parseReportRows_(rows) {
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 40); i++) { if (String((rows[i] || [])[1] || '').trim() === 'เลขที่บิล') { h = i; break; } }
  if (h < 0) return { error: 'ไม่พบหัวตาราง "เลขที่บิล" — ไม่ใช่รายงาน NIMEX016027/016371 หรือรูปแบบเปลี่ยน', bills: [] };
  const col = {}; (rows[h] || []).forEach(function (t, i) { const k = String(t || '').trim(); if (k && col[k] === undefined) col[k] = i; });
  const source = col['จำนวนวันคงค้างตามสถานะ'] !== undefined ? 'clear' : 'main';
  const pick = function (names) { for (let i = 0; i < names.length; i++) if (col[names[i]] !== undefined) return col[names[i]]; return -1; };
  const C = {
    bill: pick(['เลขที่บิล']), created: pick(['วันที่บิล']), time: pick(['เวลา']), origin: pick(['DCต้นทาง', 'DC ต้นทาง']), dest: pick(['DCปลายทาง', 'DC ปลายทาง']),
    current: pick(['DC ปัจจุบัน']), status: pick(['สถานะบิล']), type: pick(['ประเภทบิล']), due: pick(['วันที่กำหนดส่ง', 'กำหนดส่ง (SLA)']),
    arrive: pick(['วันที่สินค้าถึง DC ปลายทาง', 'วันที่รับเข้า DC']), customer: pick(['ลูกค้าที่สร้างบิล', 'บริษัท ผู้ส่ง']),
    stDays: pick(['จำนวนวันคงค้างตามสถานะ']), reason: pick(['สาเหตุที่คงค้าง', 'สาเหตุหลักที่ส่งของไม่ได้ ครั้งที่ 1'])
  };
  const miss = ['bill', 'created', 'origin', 'dest', 'current', 'status'].filter(function (k) { return C[k] < 0; });
  if (miss.length) return { error: 'ขาดคอลัมน์สำคัญ: ' + miss.join(', '), bills: [] };
  const g = function (r, k) { return C[k] < 0 ? '' : r[C[k]]; };
  // ช่วงวันที่ของรายงาน main อยู่ในบรรทัดหัวรายงาน เช่น "ตั้งแต่ 01/10/2569 ถึง 15/10/2569"
  let rangeFrom = '';
  for (let i = 0; i < h; i++) { const t = String((rows[i] || [])[0] || ''); const m = t.match(/ตั้งแต่\s+(\d{1,2}\/\d{1,2}\/\d{4})/); if (m && /ถึง/.test(t) && !/สถานะ/.test(t)) { rangeFrom = thaiDmyToIso_(m[1]); } }
  const bills = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r) continue;
    const bill = String(g(r, 'bill') == null ? '' : g(r, 'bill')).trim();
    if (!bill || !/^\d{8,}$/.test(bill)) continue;
    const o = {
      bill: bill, createdDate: dateCellToIso_(g(r, 'created')), createdTime: timeToStr_(g(r, 'time')),
      origin: String(g(r, 'origin') || '').trim(), dest: String(g(r, 'dest') || '').trim(), current: String(g(r, 'current') || '').trim(),
      status: String(g(r, 'status') || '').trim(), billType: String(g(r, 'type') || '').trim(), dueDate: dateCellToIso_(g(r, 'due')),
      arriveDate: dateCellToIso_(g(r, 'arrive')), customer: String(g(r, 'customer') || '').trim(), reason: String(g(r, 'reason') || '').trim()
    };
    if (source === 'clear') { const d = parseFloat(g(r, 'stDays')); o.stDays = isNaN(d) ? '' : d; }
    bills.push(o);
  }
  return { bills: bills, source: source, rangeFrom: rangeFrom };
}

  const cols=[{header:'เลขบิล',key:'b',width:18},{header:'กลุ่มสถานะ',key:'gn',width:20},{header:'ผู้รับผิดชอบ (สาขา)',key:'bn',width:26},{header:'สถานะ',key:'st',width:30},{header:'อายุ (วัน)',key:'age',width:10},{header:'เกณฑ์ (วัน)',key:'lim',width:10},{header:'เกินเกณฑ์ (วัน)',key:'ov',width:14},{header:'ต้นทาง',key:'org',width:22},{header:'ปลายทาง',key:'dst',width:22},{header:'ตำแหน่งปัจจุบัน',key:'cur',width:22},{header:'วันที่สร้าง',key:'cr',width:12}];
  [['A','แห้ง เกินอายุ'],['C','เย็น เกินอายุ']].forEach(([t,nm])=>{const w=wb.addWorksheet(nm);w.columns=cols;D.rows.filter(r=>r.t===t).sort((x,y)=>x.ord-y.ord||y.age-x.age).forEach(r=>{const o=w.addRow({b:r.b,gn:r.gn,bn:r.bn,st:r.st,age:r.age,lim:r.lim,ov:r.ov,org:r.org,dst:r.dst,cur:r.cur,cr:r.cr});if(r.ov>=3)o.getCell('ov').font={bold:true,color:{argb:'FFD6453A'}}});hdr(w)});
  return new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
/* ---------- หน้าต่างแชร์ ---------- */
const shDl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
async function blShareOpen(){
  const ov=document.createElement('div');ov.className='bl-md';ov.innerHTML=`<div class="bl-mb" style="width:min(720px,100%);display:flex;flex-direction:column;max-height:92vh;padding:0;overflow:hidden"><div style="display:flex;align-items:center;gap:10px;padding:14px 16px 10px 20px"><h3 style="margin:0;flex:1;font-size:18px">${ic('share',18)} แชร์รายงานบิล</h3><button class="btn" id="shX" aria-label="ปิด" style="width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1">✕</button></div><div id="shBody" style="overflow:auto;padding:0 20px 8px;flex:1;min-height:0">${ldHtml('กำลังรวบรวมข้อมูลและสร้างรูป…',160)}</div><div id="shAct" style="display:none;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:12px 16px;border-top:1px solid #E6EAF0;background:#fff"></div></div>`;
  document.body.appendChild(ov);const close=()=>{ov.remove();(ov._u||[]).forEach(u=>URL.revokeObjectURL(u))};ov.onclick=e=>{if(e.target===ov)close()};ov.querySelector('#shX').onclick=close;const esc2=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',esc2)}};document.addEventListener('keydown',esc2);
  try{
    const D=await blShareData(),txt=blShareText(D),imgs=await blShareRender(D);ov._u=imgs.map(x=>x.url);
    const stamp=D.asOf.replace(/[-: ]/g,'').slice(0,12),base='รายงานบิล_'+(D.br?D.scope:'เครือข่าย')+'_'+stamp,files=imgs.map((x,i)=>new File([x.blob],base+'_หน้า'+(i+1)+'.png',{type:'image/png'}));
    $('shBody').innerHTML=`<div style="display:flex;gap:10px;overflow:auto;padding:6px 0 10px">${imgs.map((x,i)=>`<a href="${x.url}" target="_blank" style="flex:none"><img src="${x.url}" style="height:170px;border:1px solid #E6EAF0;border-radius:8px;display:block" title="หน้า ${i+1}"></a>`).join('')}</div>
      <div class="bl-sub" style="margin-bottom:4px">ข้อความสรุป (แก้ไขได้) · แนบลิงก์ให้แล้ว</div><textarea id="shTxt" rows="9" style="font-size:13px;line-height:1.5">${esc(txt)}</textarea>`;
    $('shAct').style.display='flex';$('shAct').innerHTML=`<button class="btn" id="shCp">คัดลอกข้อความ</button><button class="btn" id="shPng">${ic('dl',14)} PNG ทั้งหมด (${imgs.length} หน้า)</button><button class="btn" id="shXl">${ic('dl',14)} Excel</button><button class="btn pri" id="shSend">${ic('share',14)} แชร์เข้า LINE</button>`;
    $('shCp').onclick=async()=>{try{await navigator.clipboard.writeText($('shTxt').value);toast('คัดลอกข้อความแล้ว')}catch(e){$('shTxt').select();document.execCommand('copy');toast('คัดลอกข้อความแล้ว')}};
    $('shPng').onclick=async()=>{for(let i=0;i<files.length;i++){shDl(files[i],files[i].name);await new Promise(r=>setTimeout(r,350))}toast('ดาวน์โหลดรูปแล้ว')};
    $('shXl').onclick=async()=>{const b=$('shXl');b.disabled=true;try{shDl(await blShareXlsx(D),base+'.xlsx');toast('ดาวน์โหลด Excel แล้ว')}catch(e){toast(e.message,'bad')}b.disabled=false};
    $('shSend').onclick=async()=>{const t=$('shTxt').value;try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text:t,title:'รายงานการจัดการบิล'})}else if(navigator.share){await navigator.share({text:t,title:'รายงานการจัดการบิล'});toast('เครื่องนี้แนบรูปไม่ได้ — ใช้ปุ่มดาวน์โหลด PNG แล้วแนบเอง')}else{await navigator.clipboard.writeText(t);toast('คัดลอกข้อความแล้ว — ดาวน์โหลด PNG แล้วแนบใน LINE')}}catch(e){if(e.name!=='AbortError')toast('แชร์ไม่สำเร็จ — ใช้ปุ่มคัดลอก/ดาวน์โหลดแทน','bad')}};
  }catch(e){$('shBody').innerHTML=`<div class="bl-empty">สร้างรายงานไม่ได้ (${esc(e.message)})<div class="bl-foot">ถ้าเพิ่งอัปเดต ต้อง Deploy GAS บิล v3.51 (New version) ก่อน</div></div>`}}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#blShare'))blShareOpen()});

</script></body></html>
