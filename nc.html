<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbyoCSXNhBLI7XLhVr4aG05dYhoa0ThSVT3yphMoDCUFsuYUFGdQ1-MpKETBxWVsPnkH4Q/exec';

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TH_M=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');return m?`${+m[3]} ${TH_M[+m[2]]} ${(+m[1]+543)%100}`:(s||'-')};
const ageOf=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s||'');if(!m)return null;return Math.max(0,Math.floor((Date.now()-new Date(+m[1],+m[2]-1,+m[3]))/864e5))};

/* ---------- สถานะ ----------  ลำดับสันนิษฐาน: รอลงนาม → รอรับ → รับเอกสารแล้ว */
const ST=[{k:'รอลงนาม',c:'c-sign',col:'#AF52DE',d:'ออกเอกสารแล้ว · รอลงนาม'},{k:'รอรับ',c:'c-wait',col:'#D97706',d:'รอพนักงานมารับเอกสาร'},{k:'รับเอกสารแล้ว',c:'c-done',col:'#34C759',d:'ปิดเรื่องแล้ว'}];

const shortPen=s=>/ยินยอมชำระ/.test(s)?'ยินยอมชำระค่าเสียหาย':/ตักเตือน/.test(s)?'ตักเตือนเป็นลายลักษณ์อักษร':(String(s||'').split(' / ')[0]||'-');

/* ---------- จับคู่ชื่อ DC → สาขา ---------- */
const ALIAS={'Dสาย3':'Dพุทธมณฑลสาย3'};
function nk(s){s=String(s||'').replace(/[\(\[（][^\)\]）]*[\)\]）]/g,'').replace(/^\s*\d+\s*[-:.]?\s*/,'').trim();if(!s)return'';const t=/shop/i.test(s)?'S':'D';const core=s.replace(/^(nim\s*)?(shop|cdc|dc)\s*/i,'').replace(/\s+/g,'');const k=t+core;return ALIAS[k]||k}
const nid=x=>String(x==null?'':x).replace(/[^0-9A-Za-z]/g,'').toUpperCase().replace(/^0+/,'');
let CTX={branches:[],br:'',lock:'',empIds:[]},BRK=new Map(),BRC=new Map();
function setCtx(c){CTX=Object.assign({branches:[],br:'',lock:'',empIds:[]},c||{});BRK=new Map();BRC=new Map();CTX.branches.forEach(b=>{BRK.set(nk(b.name),b);BRC.set(String(b.code),b)});}
function brOf(dc){const k=nk(dc);let b=BRK.get(k);if(b)return b;if(k.length>3)for(const [kk,v] of BRK)if(kk[0]===k[0]&&(kk.includes(k.slice(1))||k.includes(kk.slice(1)))&&kk.length>3)return v;return null}

const SK='<div class="sk sk-prog"></div><div class="sk-cards">'+'<div class="sk sk-card"></div>'.repeat(4)+'</div><div class="sk-bar"><div class="sk sk-in" style="width:150px"></div><div class="sk sk-in" style="width:260px"></div><div class="sk sk-in" style="width:130px"></div></div><div class="sk-tbl">'+Array.from({length:7},()=>'<div class="sk-row"><i style="width:90px"></i><i style="width:110px"></i><i style="width:60px"></i><i style="width:170px"></i><i style="width:140px;flex:1;max-width:260px"></i><i style="width:100px"></i></div>').join('')+'</div>';
const showErr=h=>{const l=$('load');l.className='';l.innerHTML=h};
let DATA=null,ROWS=[],ERR='';
const BR_CODE=()=>ONLY==='br'?(QS.get('b')||CTX.br||''):'';
function build(){
  const emp=new Set((CTX.empIds||[]).map(nid)),res=new Set(DATA.resigned||[]),want=BR_CODE(),C=DATA.cols,ix=n=>C.indexOf(n);
  ROWS=DATA.rows.map(r=>{const o={};C.forEach((c,i)=>o[c]=r[i]);
    o.b=brOf(o.dc);o.age=ageOf(o.issued);o.si=stIdx(o.status);o.res=res.has(o.empId);
    o.mine=want?((o.b&&String(o.b.code)===String(want))||emp.has(nid(o.empId))):true;return o}).filter(o=>o.mine);
  // ลำดับ: ยังไม่ปิดเรื่อง (รอรับเก่าสุดก่อน) → ปิดแล้ว
  ROWS.sort((a,b)=>(a.si===2)-(b.si===2)||(b.age||0)-(a.age||0));
}
function jsonp(params){return new Promise((res,rej)=>{const cb='__cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script');
  const t=setTimeout(()=>{cl();rej(new Error('หมดเวลาเชื่อมต่อ'))},60000);function cl(){clearTimeout(t);delete window[cb];s.remove()}
  window[cb]=d=>{cl();res(d)};s.onerror=()=>{cl();rej(new Error('เชื่อมต่อ GAS ไม่ได้'))};
  s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb}).toString();document.body.appendChild(s)})}
async function post(body){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)});return r.json()}
const keyGet=()=>{try{return localStorage.getItem('nc_key')||''}catch(e){return''}};const keySet=k=>{try{localStorage.setItem('nc_key',k)}catch(e){}};

async function load(){

  try{const r=await jsonp({action:'ncList'});if(!r.ok)throw new Error(r.error||'โหลดไม่สำเร็จ');DATA=r;build();paint();}
  catch(e){showErr(`<span class="err">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</span> <button class="b" onclick="load()">ลองใหม่</button>`)}
}

      :`<div class="alert ok">${sg(IC.chk)}<div>ไม่มี NC ที่ยังไม่ปิดเรื่องของพนักงานในสาขานี้<br><span class="mut">ตรวจสอบ: สาขา ${esc((CTX.branches.find(b=>String(b.code)===String(BR_CODE()))||{}).name||'ไม่พบสาขา')} · รหัสสาขา ${esc(BR_CODE()||'-')} · พนักงานในรายชื่อ ${(CTX.empIds||[]).length} คน · เคสทั้งหมดในระบบ ${DATA.rows.length}</span></div></div>`}
  const CI={sign:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',wait:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',done:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',ppl:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M17 4a3.5 3.5 0 010 7M22 20c0-3-2-5-5-5.5"/>'};
  const ico=p=>`<svg class="ci-s" viewBox="0 0 24 24">${p}</svg>`;

    return `<div class="sb">${A.length?`<i class="nc" style="width:${a.length/t*100}%"></i><i class="cl" style="width:${b.length/t*100}%"></i>`:''}</div>`+row('เอกสาร NC','nc',a)+row('เอกสารหักเงินสินค้าเคลม','cl',b)};
  const tot=mine.length||1,donePct=Math.round(cnt('รับเอกสารแล้ว')/tot*100);

    <div class="pb">${ST.map(s=>cnt(s.k)?`<i style="width:${cnt(s.k)/tot*100}%;background:${s.col}" title="${s.k} ${cnt(s.k)}"></i>`:'').join('')}</div>
    <div class="pl">${ST.map(s=>`<span><i style="background:${s.col}"></i>${s.k} <b>${cnt(s.k)}</b></span>`).join('')}</div></div>`;
  const CK=['sign','wait','done'];
  h+=`<div class="cards">`+ST.map((s,i)=>`<div class="card k c${i}${F.st===s.k?' on':''}" data-st="${esc(s.k)}"><div class="ch"><div class="l">${s.k}</div><span class="ci">${ico(CI[CK[i]])}</span></div><div class="v">${cnt(s.k)}<small> เคส</small></div><div class="f">${s.d}</div>${split(mine.filter(o=>o.status===s.k),i===1)}</div>`).join('')

    ${ONLY!=='br'&&CTX.branches.length?`<select id="fR"><option value="">ทุกภาค</option>${regs.map(r=>`<option ${F.reg===r?'selected':''}>${esc(r)}</option>`).join('')}</select><select id="fB"><option value="">ทุกสาขา</option>${brs.map(([c,n])=>`<option value="${esc(c)}" ${F.br===String(c)?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}

    ${ONLY==='all'&&!QS.get('lock')?`<button class="b" id="bImp">${ic('up')}นำเข้า Excel</button>`:''}</div>`;
  const q=F.q.trim().toLowerCase();
  const L=mine.filter(o=>(!F.st||o.status===F.st)&&(!F.reg||(o.b&&o.b.region===F.reg))&&(!F.br||(o.b&&String(o.b.code)===F.br))&&(!q||[o.name,o.empId,o.ncNo,o.bill].some(x=>String(x||'').toLowerCase().includes(q))));
  const SI={nc:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/>',cl:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6v2M12 16v2"/>'};
  const sec=(t,sub,A,k)=>`<div class="sec ${k}"><span class="si">${ico(SI[k])}</span><h2>${t}</h2><span class="ss">${sub}</span></div>`+(F.view==='case'?tblCase(A):tblEmp(A));
  const A1=L.filter(o=>!isClaim(o)),A2=L.filter(isClaim),op=A=>A.filter(o=>o.si<2).length;
  h+=sec('เอกสาร NC ทีมมาตรฐาน',`${A1.length} เคส · ค้าง ${op(A1)}`,A1,'nc')+sec('เอกสารหักเงินสินค้าเคลม · ยินยอมชำระค่าเสียหายให้แก่บริษัท',`${A2.length} เคส · ค้าง ${op(A2)}`,A2,'cl');
  $('app').innerHTML=h;wire();
}
const statusChip=o=>{const s=ST[o.si];const late=o.si===1&&(o.age||0)>30;const hot=o.si<2&&(o.age||0)>60;return `<span class="chip ${late?'c-late':s.c}">${hot?'<i class="pdot"></i>':''}${s.k}</span>`};

function tblEmp(L){

function wire(){

  $('app').querySelectorAll('[data-v]').forEach(c=>c.onclick=()=>{F.view=c.dataset.v;paint()});
  const q=$('fQ');if(q){q.oninput=()=>{F.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{paint();const n=$('fQ');n.focus();n.setSelectionRange(n.value.length,n.value.length)},250)}}

  $('fH').onchange=e=>{F.hideRes=e.target.checked;paint()};if($('bImp'))$('bImp').onclick=()=>{F.mode='imp';paint()};

}

/* ---------- นำเข้า Excel ---------- */
const NEED=['เลขที่ NC','วันที่ออก','วันที่เกิดเหตุ','เลขที่บิล','ประเภทบิล','รหัสพนักงาน','ชื่อ-นามสกุล','ตำแหน่ง','DC / หน่วยงาน','Department','ขั้นตอน','รหัสความผิด','ลักษณะความผิด','ระดับ','แผนก (ความผิด)','บทลงโทษ','มูลค่าชดใช้','จำนวนงวด','เริ่มหักเดือน','ผู้ออกเอกสาร','วันที่รับคืน','สถานะ','ที่มา'];
const DATEC=new Set(['วันที่ออก','วันที่เกิดเหตุ','วันที่รับคืน']);
const isoD=s=>{s=String(s||'').trim();const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);if(!m)return s;let y=+m[3];if(y>2400)y-=543;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`};
let IMP=null;
function bodyImport(){
  const key=keyGet();let h=`<div class="bar"><button class="b" id="bBack">กลับไปหน้ารายการ</button></div>`;
  if(!key){$('app').innerHTML=h+`<div class="box"><h3>${ic('lock')}นำเข้ารายงาน NC</h3><div class="hint">ใส่รหัสผู้ดูแล (ตั้งในชีต CONFIG ช่อง B2 ของ GAS NC)</div><div class="bar"><input type="password" id="imKey" placeholder="รหัสผู้ดูแล"><button class="b pri" id="imUnlock">ปลดล็อก</button></div><div id="imMsg" class="hint"></div></div>`;
    $('bBack').onclick=()=>{F.mode='list';paint()};
    $('imUnlock').onclick=async()=>{const k=$('imKey').value.trim();if(!k)return;$('imMsg').textContent='กำลังตรวจรหัส…';try{const r=await post({action:'checkKey',key:k});if(!r.ok)throw new Error(r.error||'รหัสไม่ถูกต้อง');keySet(k);bodyImport()}catch(e){$('imMsg').innerHTML=`<span class="err">${esc(e.message)}</span>`}};
    $('imKey').addEventListener('keydown',e=>{if(e.key==='Enter')$('imUnlock').click()});return}
  $('app').innerHTML=h+`<div class="box"><h3>${ic('up')}นำเข้ารายงาน NC (Excel จากทีมมาตรฐาน)</h3><div class="hint">ไฟล์ต้องมีชีต "เคส NC" และ "รายชื่อพนักงาน" · ระบบอัปเดตตามเลขที่ NC (เคสเดิมที่สถานะเปลี่ยนจะบันทึกว่าเปลี่ยนจากสถานะไหนเมื่อไร) · ไม่ลบเคสที่ไม่อยู่ในไฟล์ · ไม่ส่งมูลค่าชดใช้ไปแสดงที่หน้าเว็บ</div>
    <div class="bar"><input type="file" id="imF" accept=".xls,.xlsx"><button class="b pri" id="imGo" disabled>ยืนยันนำเข้า</button></div><div id="imStage" class="hint"></div></div>`;
  $('bBack').onclick=()=>{F.mode='list';paint()};
  $('imF').onchange=async e=>{const f=e.target.files[0];IMP=null;$('imGo').disabled=true;if(!f)return;$('imStage').textContent='กำลังอ่านไฟล์…';
    try{IMP=await parseXlsx(f);$('imStage').innerHTML=previewHtml(IMP);$('imGo').disabled=false}catch(er){$('imStage').innerHTML=`<span class="err">${esc(er.message)}</span>`}};
  $('imGo').onclick=()=>{if(IMP)runImport()};
}
/* นำเข้าเป็นก้อน (400 เคส/ก้อน): แสดงความคืบหน้า + เวลาที่เหลือ · GAS อัปเดตตามเลขที่ NC จึงส่งซ้ำ/ทำต่อจากก้อนที่พลาดได้ */
const IMP_CH=400;
async function runImport(){
  const go=$('imGo');go.disabled=true;
  const chunks=[];for(let i=0;i<IMP.rows.length;i+=IMP_CH)chunks.push(IMP.rows.slice(i,i+IMP_CH));
  const n=chunks.length,A=IMP.agg||(IMP.agg={added:0,changed:0,statusChanged:0,total:0,next:0,t:[]});
  const eta=()=>{if(!A.t.length)return null;const L=A.t.slice(-3),avg=L.reduce((x,y)=>x+y,0)/L.length;return Math.max(1,Math.round(avg*(n-A.next)/1000))};
  const draw=()=>{const pct=Math.round(A.next/n*100),e=eta();
    $('imStage').innerHTML=`นำเข้า <b>${Math.min(A.next+1,n)}</b> จาก ${n} ก้อน · ${pct}%<div class="ipb"><i style="width:${pct}%"></i></div><div class="mut">${e==null?'กำลังคำนวณเวลาที่เหลือ…':'เหลือประมาณ '+e+' วินาที'} · อย่าปิดหน้านี้</div>`};
  onbeforeunload=()=>'กำลังนำเข้าข้อมูล';
  try{
    while(A.next<n){
      draw();const t0=Date.now();
      const r=await post({action:'importNC',key:keyGet(),file:IMP.file,rows:chunks[A.next],emps:A.next===0?IMP.emps:[]});
      if(!r.ok)throw new Error(r.error||'นำเข้าไม่สำเร็จ');
      A.added+=r.added;A.changed+=r.changed;A.statusChanged+=r.statusChanged;A.total=r.total;A.t.push(Date.now()-t0);A.next++;
    }
    onbeforeunload=null;
    $('imStage').innerHTML=`<span class="okc">นำเข้าสำเร็จ</span> · ทั้งหมด ${A.total} เคส · ใหม่ ${A.added} · แก้ไข ${A.changed} · สถานะเปลี่ยน ${A.statusChanged}`;
    try{parent.postMessage({type:'nc:imported'},'*')}catch(e){}
    setTimeout(async()=>{F.mode='list';await load()},1200);
  }catch(er){
    onbeforeunload=null;if(/รหัส/.test(er.message))keySet('');
    $('imStage').innerHTML=`<span class="err">${esc(er.message)}</span>${A.next?`<div class="mut">นำเข้าแล้ว ${A.next} จาก ${n} ก้อน (บันทึกไว้แล้ว) · กด “ทำต่อ” เพื่อส่งก้อนที่เหลือ</div>`:''}`;
    if(A.next)go.textContent='ทำต่อ';go.disabled=false;
  }
}
async function parseXlsx(f){
  const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array'});
  const sn=wb.SheetNames.find(n=>/เคส\s*NC/.test(n))||wb.SheetNames[0],R=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false});
  if(R.length<2)throw new Error('ชีตเคส NC ว่าง');
  const H=R[0].map(x=>String(x).trim()),ix=NEED.map(n=>H.indexOf(n)),miss=NEED.filter((n,i)=>ix[i]<0);
  if(miss.length)throw new Error('ไม่พบคอลัมน์: '+miss.join(', ')+' (ตรวจว่าเป็นไฟล์ export จากทีมมาตรฐาน)');
  const rows=[];R.slice(1).forEach(r=>{if(!String(r[ix[0]]||'').trim())return;rows.push(NEED.map((n,i)=>{let v=String(r[ix[i]]==null?'':r[ix[i]]).trim();if(DATEC.has(n))v=isoD(v);return v}))});
  if(!rows.length)throw new Error('ไม่พบเคส NC ในไฟล์');
  let emps=[];const es=wb.SheetNames.find(n=>/รายชื่อพนักงาน/.test(n));
  if(es){const E=XLSX.utils.sheet_to_json(wb.Sheets[es],{header:1,defval:'',raw:false}),eh=E[0].map(x=>String(x).trim()),EN=['รหัสพนักงาน','ชื่อ-นามสกุล','DC / หน่วยงาน','แผนก','ตำแหน่ง','Level','สถานะพนักงาน'],ei=EN.map(n=>eh.indexOf(n));
    if(ei.every(i=>i>=0))emps=E.slice(1).filter(r=>String(r[ei[0]]||'').trim()).map(r=>ei.map(i=>String(r[i]==null?'':r[i]).trim()))}
  return{file:f.name,rows,emps};
}
function previewHtml(P){
  const by={};P.rows.forEach(r=>by[r[21]]=(by[r[21]]||0)+1);
  const dcs=[...new Set(P.rows.map(r=>r[8]))],unm=dcs.filter(d=>CTX.branches.length&&!brOf(d));
  const known=new Set(ROWS.length?DATA.rows.map(r=>r[0]):[]),nw=P.rows.filter(r=>!known.has(r[0])).length;
  const unk=P.rows.filter(r=>!ST.some(s=>s.k===r[21])).length;
  return `ไฟล์ ${esc(P.file)}<br>เคส <b>${P.rows.length}</b> · ใหม่ประมาณ <b>${nw}</b> · พนักงานในรายชื่อ ${P.emps.length}<br>`+ST.map(s=>`${s.k} ${by[s.k]||0}`).join(' · ')+
   (unk?`<br><span class="err">มี ${unk} เคสสถานะที่ระบบยังไม่รู้จัก (จะแสดงเป็นขั้น "รอรับ")</span>`:'')+
   (unm.length?`<br><span class="mut">หน่วยงานที่ไม่พบเป็นสาขาในระบบ ${unm.length} ชื่อ: ${esc(unm.slice(0,8).join(' · '))}${unm.length>8?' …':''} (ยังเห็นในรายการรวม แต่ไม่เตือนสาขาจนกว่ารหัสพนักงานตรงกับรายชื่อสาขา)</span>`:'');
}

/* ---------- ข้อความจากหน้าหลัก ---------- */
addEventListener('message',e=>{const d=e.data||{};
  if(d.type==='nc:ctx'){setCtx(d);if(DATA){build();paint()}}
  if(d==='nc:refresh'||d.type==='nc:refresh')load()});
try{parent.postMessage({type:'nc:ready'},'*')}catch(e){}
if(ONLY==='br'&&QS.get('b'))CTX.br=QS.get('b');
load();
</script>
<script>/* ux8 ช่องค้นหา + ปุ่มล้าง */
(function(){var IDS=["fQ"],X='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function deco(){IDS.forEach(function(id){var el=document.getElementById(id);if(!el||el.parentNode.classList.contains('sq'))return;
 var p=el.parentNode,blk=p.clientWidth&&el.offsetWidth>=p.clientWidth*.9,w=document.createElement('span');w.className='sq'+(blk?' blk':'');
 ['flex','width','minWidth','maxWidth','margin','marginTop','marginBottom'].forEach(function(k){if(el.style[k]){w.style[k]=el.style[k];el.style[k]=''}});
 p.insertBefore(w,el);w.appendChild(el);var b=document.createElement('button');b.type='button';b.className='sqx';b.setAttribute('aria-label','ล้างคำค้น');b.innerHTML=X;w.appendChild(b);
 var sync=function(){w.classList.toggle('has',!!el.value)};sync();el.addEventListener('input',sync);
 b.addEventListener('mousedown',function(e){e.preventDefault()});
 b.addEventListener('click',function(){el.value='';sync();el.dispatchEvent(new Event('input',{bubbles:true}));el.focus()})})}
var q=0,mo=new MutationObserver(function(){if(q)return;q=requestAnimationFrame(function(){q=0;deco()})});
function go(){deco();mo.observe(document.body,{childList:true,subtree:true})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()})();
</script>
<script>/* ux12 คีย์บอร์ด: / ไปช่องค้นหา · Esc ปิดหน้าต่าง/ล้างค้นหา */
(function(){var IDS=["fQ"];
function vis(e){return !!e&&e.getClientRects().length>0&&getComputedStyle(e).visibility!=="hidden"}
document.addEventListener('keydown',function(e){
 var t=e.target,typing=t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(t&&t.isContentEditable);
 if(e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){for(var i=0;i<IDS.length;i++){var el=document.getElementById(IDS[i]);if(vis(el)){e.preventDefault();el.focus();el.select&&el.select();return}}return}
 if(e.key==='Escape'){
  var ovs=[].slice.call(document.querySelectorAll('.shov,.ov.on')).filter(vis);
  if(ovs.length){var o=ovs[ovs.length-1],c=o.querySelector('#shX,[aria-label="ปิด"],[data-close]');if(c)c.click();else o.classList.contains('on')?o.classList.remove('on'):o.remove();e.preventDefault();return}
  if(typing&&IDS.indexOf(t.id)>=0){if(t.value){t.value='';t.dispatchEvent(new Event('input',{bubbles:true}))}else t.blur();e.preventDefault()}}});
})();
</script>
<script>/* ux14 หัวคอลัมน์ชิดตามข้อมูล (ตัวเลขชิดขวา → หัวชิดขวา) */
(function(){var q=0;function fix(){document.querySelectorAll('table').forEach(function(t){var hr=t.tHead&&t.tHead.rows[t.tHead.rows.length-1],b=t.tBodies[0],r0=b&&b.rows[0];if(!hr||!r0||hr.cells.length!==r0.cells.length)return;
 for(var i=0;i<hr.cells.length;i++){var th=hr.cells[i],td=r0.cells[i];if(th.colSpan>1||td.colSpan>1||th.dataset.al)continue;var a=getComputedStyle(td).textAlign,h=getComputedStyle(th).textAlign;
  if((a==='right'||a==='end')&&h!=='right'&&h!=='end'){th.style.textAlign='right';th.dataset.al=1}}})}
var mo=new MutationObserver(function(){if(q)return;q=requestAnimationFrame(function(){q=0;fix()})});
function go(){fix();mo.observe(document.body,{childList:true,subtree:true})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()})();
</script>
