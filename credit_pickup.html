<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>งานเข้ารับลูกค้าเครดิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--mut:#6b7280;--line:#e5e7eb;--bg:#fff;--soft:#f6f6f7;
--ok:#15803d;--ng:#b45309;--bl:#b91c1c;--cn:#6b7280;--pd:#cbd5e1;--ot:#94a3b8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}
header.top{padding:18px 0 10px}
h1{margin:0;font-size:20px;font-weight:700}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 0;margin:0 -16px 16px;padding-left:16px;padding-right:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;cursor:pointer;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:#111;color:#fff}
select,.in{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;min-height:36px}
.in{display:flex;align-items:center;gap:6px;flex:1;min-width:150px}
.in input{border:0;outline:0;width:100%;background:transparent}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#111}
.btn.pri{background:#111;color:#fff;border-color:#111}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl{color:var(--mut);font-size:12px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(5,1fr)}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;min-width:0}
.card h3{margin:0 0 8px;font-size:14px;font-weight:600}
.k .t{color:var(--mut);font-size:12px}
.k .v{font-size:clamp(22px,3.4vw,30px);font-weight:700;line-height:1.2;margin-top:2px}
.k .s{font-size:12px;color:var(--mut);margin-top:2px}
.sec{margin-top:18px}
.sec>h2{font-size:15px;margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec>h2 small{font-weight:400;color:var(--mut);font-size:12px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap;cursor:default;user-select:none}
th.s{cursor:pointer}
th.s:hover{color:#111}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--soft)}
tr.sel td{background:var(--soft);font-weight:600}
.mini{display:flex;height:8px;border-radius:2px;overflow:hidden;min-width:90px;background:#eee}
.mini b{display:block;height:100%}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fchips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;min-height:32px}
.fchips button.on{background:#111;color:#fff;border-color:#111}
.mut{color:var(--mut)}
.empty{padding:28px;text-align:center;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.sumbox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sumbox div{border-left:3px solid #111;padding-left:10px}
.sumbox .v{font-size:20px;font-weight:700}
#gTip{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;display:none;max-width:240px}
#gTip b{font-weight:600}
#gTip .r{display:flex;justify-content:space-between;gap:12px}
svg text{font-family:inherit}
.sk{display:none}
@media (max-width:820px){
 .kpis{grid-template-columns:repeat(2,1fr)}
 .kpis .k:first-child{grid-column:1/-1}
 .sumbox{grid-template-columns:1fr}
}
@media (max-width:560px){
 .hm{display:none}
 th,td{padding:8px 4px}
 .rec thead{display:none}
 .rec,.rec tbody,.rec tr,.rec td{display:block;width:100%}
 .rec tr{border-bottom:1px solid var(--line);padding:8px 0}
 .rec td{border:0;padding:1px 0}
}
@media (pointer:coarse){.seg button,.btn,select,.fchips button{min-height:44px}}

/* ===== ธีมเดียวกับ index (Theme A) ===== */
:root{--ink:#141B26;--ink2:#5A6577;--ink3:#98A1AF;--mut:#5A6577;--line:#ECEFF3;--line2:#F1F3F6;
 --brand:#1F3A5F;--brand2:#3B6EA5;--acc1:#F2B84B;--bar:#E3E7EC;--shadow:0 1px 2px rgba(20,27,38,.04)}
body{background:#fff;color:var(--ink)}
h1{font-size:18px;font-weight:600;color:var(--brand)}
.sub,.lbl,.note,.mut,.k .t,.k .s{color:var(--ink3)}
.k .t{color:var(--ink2);font-size:13px}
.k .v{letter-spacing:-.5px}
.card{border:0;border-radius:18px;box-shadow:var(--shadow);padding:16px 20px;background:#fff}
.bar{border-bottom:1px solid var(--line)}
.seg{border:0;background:#F5F6F8;border-radius:10px;padding:3px;gap:2px}
.seg button{border-radius:8px;background:none;color:var(--ink2)}
.seg button+button{border-left:0}
.seg button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(20,27,38,.08)}
select,.in,.btn{border-radius:10px;border-color:var(--line)}
.btn:hover{border-color:#cfd6df}
.btn.pri{background:var(--brand);border-color:var(--brand)}
th{color:var(--ink3);font-weight:500}
td,th{border-bottom-color:var(--line2)}
tfoot td{border-bottom:0}
tr.cl:hover td{background:#F5F6F8}
tr.sel td{background:#E6EDF6;color:var(--brand)}
.sec>h2{color:var(--ink)}
.sec>h2 small{color:var(--ink3)}
.mini{background:var(--bar)}
a{color:var(--brand2)}
body.embed header.top{display:none}
body.embed .bar{top:0}
body.lock #selDC,body.lock #secDC{display:none!important}
.dcp{display:inline-block;font-size:13px;font-weight:600;color:#5A6577;background:#F1F4F8;border-radius:999px;padding:3px 12px}.dcp.on{color:#006BB6;background:#E1EEF8}body.ofm .dcp.on{color:#2974BA;background:#E4EEF8}
.sec>h2 small .dcp{margin-left:0}
.viz{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.dn{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}.dl{display:flex;flex-direction:column;gap:10px;font-size:13.5px}.dl div{display:flex;align-items:center;gap:8px}.dl i{width:10px;height:10px;border-radius:3px;flex:none}.dl b{margin-left:auto;padding-left:14px;font-size:18px}.dl em{font-style:normal;color:#5A6577;min-width:36px;text-align:right}
.wk{display:flex;gap:8px;align-items:flex-end;height:150px}.wk>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}.wk b{flex:1;width:100%;display:flex;align-items:flex-end}.wk b i{display:block;width:100%;background:#006BB6;border-radius:8px 8px 3px 3px}.wk span{font-size:12px;color:#5A6577}.wk .v{font-weight:600;color:#141B26}
.hmt{font-size:12.5px;min-width:560px}.hmt th{padding:4px 3px}.hmt td{padding:3px;border:0}.hmt td.hl{white-space:nowrap;cursor:pointer;padding-right:10px}.hmt td.hl:hover{color:#006BB6;text-decoration:underline}.hmt td span{display:block;min-width:34px;text-align:center;border-radius:8px;padding:5px 0;font-variant-numeric:tabular-nums}.hmt td:not(.hl):not(.n) span{background:none}
@media(max-width:820px){.viz{grid-template-columns:1fr}}
.asofp{margin-left:auto;font-size:12.5px;color:#006BB6;background:#E1EEF8;border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
body.ofm .asofp{color:#2974BA;background:#E4EEF8}
.card{border:1px solid #E3E8EF;box-shadow:0 1px 2px rgba(16,27,45,.05),0 6px 18px rgba(16,27,45,.06)}
/* ===== โทนเดียวกับ Dashboard ใหญ่ (bento): ฟ้า #006BB6 · การ์ดโค้ง 22px + เงานุ่ม · pill ===== */
:root{--brand:#006BB6;--brand2:#006BB6;--ink:#141B26;--soft:#F5F8FB}
body{background:#fff}
h1{color:var(--ink);font-weight:700}
.card{border-radius:22px;box-shadow:0 1px 2px rgba(16,27,45,.05),0 6px 18px rgba(16,27,45,.05);padding:14px 18px}
.k{position:relative;padding-top:16px}
.k::before{content:"";position:absolute;left:18px;top:0;width:28px;height:4px;border-radius:0 0 4px 4px;background:#E1EEF8}
.k:first-child{background:#006BB6;color:#fff}.k:first-child::before{background:rgba(255,255,255,.55)}
.k:first-child .t,.k:first-child .s{color:rgba(255,255,255,.85)}
.k:nth-child(2)::before{background:#006BB6}.k:nth-child(3)::before{background:#F26522}
/* ธีม OFM (OfficeMate): น้ำเงิน #2974BA + ส้ม #F26522 — ใช้เมื่อเลือกลูกค้า OFM */
body.ofm{--brand:#2974BA;--brand2:#2974BA}body.ofm .k:first-child{background:#2974BA}body.ofm .seg button.on{color:#2974BA}body.ofm .btn.pri,body.ofm .fchips button.on{background:#2974BA;border-color:#2974BA}body.ofm tr.sel td{background:#E4EEF8;color:#2974BA}body.ofm .sec>h2::before{background:#F26522}body.ofm .bar{border-bottom:3px solid #F26522}
.bar{background:rgba(255,255,255,.96);backdrop-filter:blur(6px)}
.seg{background:#EEF3F8;border-radius:999px;padding:3px}
.seg button{border-radius:999px}
.seg button.on{color:#006BB6}
select,.in,.btn{border-radius:999px;border-color:#E3E8EF;padding-left:14px;padding-right:14px}
.btn.pri{background:#006BB6;border-color:#006BB6}
.fchips button{border-radius:999px}.fchips button.on{background:#006BB6;border-color:#006BB6}
tr.sel td{background:#E1EEF8;color:#006BB6}
th{text-transform:none;letter-spacing:0}
.sec>h2{font-weight:700}
.sec>h2::before{content:"";display:inline-block;width:4px;height:15px;border-radius:2px;background:#006BB6;margin-right:8px;vertical-align:-2px}
.sec>h2{justify-content:flex-start}.sec>h2 small{margin-left:auto}
.sumbox div{border-left-color:#006BB6}
</style>
</head>

<div class="wrap">
<header class="top">
 <h1>งานเข้ารับลูกค้าเครดิต</h1>
 <div class="sub" id="asof"></div>
</header>

<div class="bar">
 <div class="row" id="ctl">
  <div class="seg" id="segC"></div>
  <select id="selDC" aria-label="เลือก DC"></select>
  <div class="seg" id="segR"></div>
  <select id="selFrom" aria-label="ตั้งแต่เดือน"></select>
  <span class="lbl">ถึง</span>
  <select id="selTo" aria-label="ถึงเดือน"></select>
  <span class="asofp" id="asofP"></span>
 </div>
</div>

</section>

<section class="sec" id="secViz">
 <h2>ภาพรวมเชิงสัดส่วน <small id="vizSub"></small></h2>

  <div class="card"><h3>วันที่แจ้งเข้ารับบ่อย (จันทร์–อาทิตย์)</h3><div id="vWeek"></div></div>
 </div>
 <div class="card" id="cHeat" style="margin-top:12px"><h3>DC × เดือน <small class="mut" style="font-weight:400">สีเข้ม = งานมาก · กดชื่อ DC เพื่อดูเฉพาะ DC นั้น</small></h3><div id="vHeat" style="overflow:auto"></div></div>
</section>

<section class="sec" id="secDC">
 <h2>เปรียบเทียบรายสาขา (DC) <small>คลิกที่แถวเพื่อดูเฉพาะ DC นั้น</small></h2>
 <div class="card" style="padding:0;overflow:auto"><table id="tDC"></table></div>
 <div class="note" id="dcMore"></div>
</section>

<section class="sec">
 <h2>ร้าน/สาขาลูกค้าที่แจ้งบ่อย <small id="storeSub"></small></h2>
 <div class="card" style="padding:0;overflow:auto"><table id="tStore"></table></div>
</section>

<section class="sec">
 <h2>รายการงาน <small id="recSub"></small></h2>
 <div class="row" style="margin-bottom:8px">
  <label class="in"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="ค้นหา ร้าน / DC / เลขที่อ้างอิง  ( / )" autocomplete="off"></label>
  <button class="btn" id="btnCsv"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>ดาวน์โหลด CSV</button>
 </div>
 <div class="card" style="padding:0;overflow:auto"><table class="rec" id="tRec"></table></div>
 <div style="text-align:center;margin-top:10px"><button class="btn" id="btnMore">แสดงเพิ่ม</button></div>
</section>

<section class="sec">
 <div class="note" id="foot"></div>
</section>
</div>

<script>
"use strict";

const ST={
 ok:{t:'รับกลับสำเร็จ',s:'สำเร็จ',c:'#15803d'},
 nogoods:{t:'ลูกค้าไม่มีสินค้า / ส่งคืนทางอื่นแล้ว',s:'ไม่มีสินค้า',c:'#b45309'},
 blocked:{t:'รับไม่ได้ (ไม่แพ็ค / ติดต่อไม่ได้ / พื้นที่ปิด)',s:'รับไม่ได้',c:'#b91c1c'},

 pending:{t:'ยังไม่มีผลบันทึก',s:'ไม่มีผล',c:'#cbd5e1'},
 other:{t:'อื่น ๆ (ดูหมายเหตุ)',s:'อื่น ๆ',c:'#94a3b8'}
};
const SK=Object.keys(ST);
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const pct=(a,b)=>b?Math.round(a/b*1000)/10:null;
const pcs=v=>v==null?'–':(v%1?v.toFixed(1):v)+'%';
const mlab=m=>{const[y,mo]=m.split('-').map(Number);return TM[mo-1]+' '+String((y+543)%100)};
const dlab=d=>{const[y,m,dd]=d.split('-').map(Number);return dd+' '+TM[m-1]+' '+String((y+543)%100)};
const dcName=x=>!x?'(ไม่ระบุ DC)':x[0]==='~'?x.slice(1)+' (ไม่อยู่ในรายชื่อสาขา)':(BR[x]||x);
const dcCode=x=>x&&x[0]!=='~'?x:'';
const rate=o=>pct(o.ok,o.n-o.cancel-o.pending);   // ไม่นับยกเลิก / ไม่มีผลบันทึก
const ic=p=>'<svg class="ic" viewBox="0 0 24 24">'+p+'</svg>';

/* ---------- state ---------- */
const P=new URLSearchParams(location.search);
const allMonths=[...new Set(DATA.map(r=>r.d.slice(0,7)))].sort();
const S={c:P.get('c')||'all',dc:P.get('dc')||'',r:P.get('r')||'6',from:'',to:'',st:'',q:'',sortDC:'n',dirDC:-1,sortSt:'n',showAllDC:false,lim:30};
if(!['all','A','OFM'].includes(S.c))S.c='all';

const byC=()=>DATA.filter(r=>S.c==='all'||r.c===S.c);
function monthsOf(rows){return [...new Set(rows.map(r=>r.d.slice(0,7)))].sort()}
function setRange(){
 const ms=monthsOf(byC());
 if(!ms.length){S.from=S.to='';return}
 const last=ms[ms.length-1];
 if(S.r!=='x'){
  const n=S.r==='all'?ms.length:+S.r;
  S.to=last;S.from=ms[Math.max(0,ms.length-n)];
 }
 if(!S.from||S.from<ms[0])S.from=ms[0];
 if(!S.to||S.to>last)S.to=last;
}
function base(){ // ลูกค้า + ช่วงเดือน
 return DATA.filter(r=>(S.c==='all'||r.c===S.c)&&r.d.slice(0,7)>=S.from&&r.d.slice(0,7)<=S.to);
}
const inDC=r=>!S.dc||r.dc===S.dc;
function tally(rows){const o={n:rows.length,q:0};SK.forEach(k=>o[k]=0);rows.forEach(r=>{o[r.s]++;o.q+=r.q||0});return o}

/* ---------- controls ---------- */
function drawCtl(){
 $('segC').innerHTML=[['all','ทั้งหมด'],['A',CUST.A.name],['OFM',CUST.OFM.name]].map(([k,t])=>`<button data-c="${k}" class="${S.c===k?'on':''}">${t}</button>`).join('');
 $('segR').innerHTML=[['3','3 เดือน'],['6','6 เดือน'],['12','12 เดือน'],['all','ทั้งหมด']].map(([k,t])=>`<button data-r="${k}" class="${S.r===k?'on':''}">${t}</button>`).join('');
 const ms=monthsOf(byC());
 const opt=(v,sel)=>`<option value="${v}"${v===sel?' selected':''}>${mlab(v)}</option>`;
 $('selFrom').innerHTML=ms.map(m=>opt(m,S.from)).join('');
 $('selTo').innerHTML=ms.map(m=>opt(m,S.to)).join('');
 const dcs=[...new Set(byC().map(r=>r.dc).filter(Boolean))].sort((a,b)=>dcName(a).localeCompare(dcName(b),'th'));
 if(S.dc&&!dcs.includes(S.dc))dcs.push(S.dc);
 $('selDC').innerHTML='<option value="">ทุก DC</option>'+dcs.map(d=>`<option value="${esc(d)}"${d===S.dc?' selected':''}>${esc(dcName(d))}</option>`).join('');
}
$('segC').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.c=b.dataset.c;S.lim=30;setRange();sync()};
$('segR').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.r=b.dataset.r;S.lim=30;setRange();sync()};
$('selFrom').onchange=e=>{S.from=e.target.value;if(S.to<S.from)S.to=S.from;S.r='x';sync()};
$('selTo').onchange=e=>{S.to=e.target.value;if(S.to<S.from)S.from=S.to;S.r='x';sync()};
$('selDC').onchange=e=>{S.dc=e.target.value;S.lim=30;sync()};

/* ---------- KPI ---------- */
const CC={A:'#006BB6',OFM:'#F26522'};
function drawKPI(rows){
 const n=rows.length,months=Math.max(1,monthsOf(rows).length||1);
 const a=rows.filter(r=>r.c==='A').length,o=n-a;
 const card=(t,v,s)=>`<div class="card k"><div class="t">${t}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
 const ms=S.from?monthSpan(S.from,S.to):[];const last=ms[ms.length-1];
 const lastN=last?rows.filter(r=>r.d.slice(0,7)===last).length:0;
 $('kpis').innerHTML=card('งานทั้งหมด',fmt(n),`เฉลี่ย ${fmt(Math.round(n/months))} งาน/เดือน`)+
  card(CUST.A.name,fmt(a),CUST.A.sub)+card(CUST.OFM.name,fmt(o),CUST.OFM.sub)+
  card('เดือนล่าสุด ('+(last?mlab(last):'–')+')',fmt(lastN),'ข้อมูลอาจยังไม่ครบเดือน')+
  card('จำนวน DC ที่เกี่ยวข้อง',fmt(new Set(rows.map(r=>r.dc).filter(Boolean)).size),'');
}
function monthSpan(a,b){const out=[];let[y,m]=a.split('-').map(Number);const[y2,m2]=b.split('-').map(Number);
 while(y<y2||(y===y2&&m<=m2)){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}return out}
let chartData=[];
function drawChart(rows){
 const ms=S.from?monthSpan(S.from,S.to):[];
 const by={};ms.forEach(m=>by[m]={A:0,OFM:0});
 rows.forEach(r=>{const m=r.d.slice(0,7);if(by[m])by[m][r.c]++});
 chartData=ms.map(m=>({m,...by[m],n:by[m].A+by[m].OFM}));
 $('chartSub').innerHTML=`<span class="dcp${S.dc?' on':''}">${esc(S.dc?dcName(S.dc):'ทุก DC')}</span>`;
 const el=$('chart');
 if(!ms.length||!rows.length){el.innerHTML='<div class="empty">ไม่มีข้อมูลในช่วงที่เลือก</div>';$('leg').innerHTML='';return}
 const W=Math.max(280,el.clientWidth),H=230,pl=34,pr=6,pt=12,pb=28;
 const mx=Math.max(...chartData.map(d=>d.n));
 const step=mx<=10?2:mx<=40?10:mx<=100?20:50;const top=Math.ceil(mx/step)*step||step;
 const iw=W-pl-pr,ih=H-pt-pb,bw=iw/chartData.length,g=Math.min(8,bw*.2);
 const y=v=>pt+ih-v/top*ih;
 let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="จำนวนงานรายเดือน">`;
 for(let v=0;v<=top;v+=step)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5A6577">${v}</text>`;
const full=chartData.filter(d=>d.m!==ASOF.slice(0,7)),avg=full.length>1?full.reduce((a,d)=>a+d.n,0)/full.length:0;
 if(avg>0)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(avg)}" y2="${y(avg)}" stroke="#141B26" stroke-opacity=".45" stroke-dasharray="4 4"/><text x="${W-pr-2}" y="${y(avg)-4}" text-anchor="end" font-size="11" font-weight="600" fill="#141B26" fill-opacity=".7">เฉลี่ย ${fmt(Math.round(avg))}/เดือน</text>`;
 const every=Math.ceil(chartData.length/Math.max(1,Math.floor(iw/52)));
 chartData.forEach((d,i)=>{
  const x=pl+i*bw+g/2,w=bw-g;let acc=0;
  const part=d.m===ASOF.slice(0,7);
  ['A','OFM'].forEach(k=>{if(!d[k])return;s+=`<rect${part?' opacity=".55"':''} x="${x}" y="${y(acc+d[k])}" width="${w}" height="${Math.max(d[k]/top*ih-.6,.5)}" fill="${CC[k]}"/>`;acc+=d[k]});
  if(bw>=26&&d.n)s+=`<text x="${x+w/2}" y="${y(d.n)-3}" text-anchor="middle" font-size="10" fill="#374151">${d.n}</text>`;
  if(i%every===0||i===chartData.length-1&&i%every>every/2)s+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5A6577">${mlab(d.m)}</text>`;
  s+=`<rect class="hit" data-i="${i}" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent"/>`;
 });
 el.innerHTML=s+'</svg>';
 $('leg').innerHTML=['A','OFM'].map(k=>`<span><i style="background:${CC[k]}"></i>${CUST[k].name}</span>`).join('')+(chartData.some(d=>d.m===ASOF.slice(0,7))?'<span><i style="background:#9aa4b2;opacity:.6"></i>เดือนล่าสุด (ยังไม่ครบเดือน · ไม่รวมในค่าเฉลี่ย)</span>':'');
}
function drawViz(b,d){
 $('vizSub').innerHTML=`<span class="dcp${S.dc?' on':''}">${esc(S.dc?dcName(S.dc):'ทุก DC')}</span>`;
 /* donut */
 const a=d.filter(r=>r.c==='A').length,o=d.length-a,T=d.length;
 if(!T){$('vDonut').innerHTML='<div class="empty">ไม่มีข้อมูล</div>'}else{
  const R=52,C=2*Math.PI*R,la=a/T*C;
  $('vDonut').innerHTML=`<div class="dn"><svg width="140" height="140" viewBox="0 0 140 140"><g transform="rotate(-90 70 70)"><circle cx="70" cy="70" r="${R}" fill="none" stroke="${CC.OFM}" stroke-width="18"/><circle cx="70" cy="70" r="${R}" fill="none" stroke="${CC.A}" stroke-width="18" stroke-dasharray="${la} ${C-la}"/></g><text x="70" y="68" text-anchor="middle" font-size="24" font-weight="700" fill="#141B26">${fmt(T)}</text><text x="70" y="86" text-anchor="middle" font-size="12" fill="#5A6577">งาน</text></svg>
  <div class="dl"><div><i style="background:${CC.A}"></i>${CUST.A.name}<b>${fmt(a)}</b><em>${(a/T*100).toFixed(0)}%</em></div><div><i style="background:${CC.OFM}"></i>${CUST.OFM.name}<b>${fmt(o)}</b><em>${(o/T*100).toFixed(0)}%</em></div></div></div>`}
 /* weekday */
 const W=[0,0,0,0,0,0,0],N=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];d.forEach(r=>W[new Date(r.d+'T00:00:00').getDay()]++);
 const ord=[1,2,3,4,5,6,0],mw=Math.max(1,...W);
 $('vWeek').innerHTML=T?`<div class="wk">${ord.map(i=>`<div title="${N[i]} · ${W[i]} งาน (${(W[i]/T*100).toFixed(0)}%)"><span class="v">${W[i]}</span><b><i style="height:${Math.max(3,W[i]/mw*100)}%;${W[i]===mw?'':'opacity:.55'}"></i></b><span>${N[i]}</span></div>`).join('')}</div>`:'<div class="empty">ไม่มีข้อมูล</div>';
 /* heatmap DC x month (ทุก DC ในช่วงที่เลือก) */
 const hc=$('cHeat');hc.style.display=S.dc?'none':'';if(S.dc)return;
 const ms=monthSpan(S.from,S.to).slice(-12),g={};b.forEach(r=>{const m=r.d.slice(0,7);if(!ms.includes(m))return;const x=g[r.dc]=g[r.dc]||{n:0};x.n++;x[m]=(x[m]||0)+1});
 const rows=Object.entries(g).sort((p,q)=>q[1].n-p[1].n).slice(0,12);
 if(!rows.length){$('vHeat').innerHTML='<div class="empty">ไม่มีข้อมูล</div>';return}
 const mx=Math.max(1,...rows.flatMap(([,x])=>ms.map(m=>x[m]||0)));
 let h=`<table class="hmt"><thead><tr><th></th>${ms.map(m=>`<th class="n">${mlab(m)}</th>`).join('')}<th class="n">รวม</th></tr></thead><tbody>`;
 rows.forEach(([dc,x])=>{h+=`<tr><td class="hl" data-dc="${esc(dc)}">${esc(dcName(dc))}</td>${ms.map(m=>{const v=x[m]||0,al=v?.12+.88*v/mx:0;return`<td class="n"><span style="background:rgba(0,107,182,${al.toFixed(2)});color:${al>.55?'#fff':'#141B26'}">${v||''}</span></td>`}).join('')}<td class="n"><b>${x.n}</b></td></tr>`});
 $('vHeat').innerHTML=h+'</tbody></table>'+(Object.keys(g).length>12?`<div class="note">แสดง 12 DC ที่มีงานมากสุดจากทั้งหมด ${Object.keys(g).length} DC</div>`:'');
}
document.addEventListener('click',e=>{const t=e.target.closest('#vHeat .hl');if(t&&!document.body.classList.contains('lock')){S.dc=t.dataset.dc;S.lim=30;sync();scrollTo({top:0,behavior:'smooth'})}});
const tip=$('gTip');
function showTip(html,x,y){tip.innerHTML=html;tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;
 let l=x+14,t=y+14;if(l+w>innerWidth-8)l=x-w-14;if(l<8)l=8;if(t+h>innerHeight-8)t=y-h-14;tip.style.left=l+'px';tip.style.top=Math.max(8,t)+'px'}
const hideTip=()=>tip.style.display='none';
function chartTip(e){
 const h=e.target.closest('.hit');if(!h){hideTip();return}
 const d=chartData[+h.dataset.i];
 showTip(`<b>${mlab(d.m)}</b> · ${fmt(d.n)} งาน`+['A','OFM'].map(k=>`<div class="r"><span>${CUST[k].name}</span><b>${d[k]}</b></div>`).join(''),e.clientX,e.clientY);
}
$('chart').addEventListener('pointermove',chartTip);
$('chart').addEventListener('pointerdown',chartTip);
$('chart').addEventListener('pointerleave',hideTip);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#chart'))hideTip()});

/* ---------- DC table ---------- */
function drawDC(rows){
 const g={};rows.forEach(r=>{(g[r.dc]=g[r.dc]||[]).push(r)});
 const list=Object.entries(g).map(([dc,rs])=>({dc,n:rs.length,A:rs.filter(r=>r.c==='A').length,OFM:rs.filter(r=>r.c==='OFM').length}));
 const k=S.sortDC,dir=S.dirDC;
 list.sort((a,b)=>k==='dc'?dir*dcName(a.dc).localeCompare(dcName(b.dc),'th'):(dir*(a[k]-b[k])||b.n-a.n));
 const lim=S.showAllDC?list.length:15;
 const sh=list.slice(0,lim);
 if(S.dc&&!sh.some(o=>o.dc===S.dc)){const m=list.find(o=>o.dc===S.dc);if(m)sh.unshift(m)}
 const mx=Math.max(1,...list.map(o=>o.n));
 const th=(key,t,cls)=>`<th class="s ${cls||''}" data-k="${key}">${t}${k===key?(dir<0?' ▾':' ▴'):''}</th>`;
 let h=`<thead><tr>${th('dc','DC')}${th('n','งานรวม','n')}${th('A',CUST.A.name,'n')}${th('OFM',CUST.OFM.name,'n')}<th class="hm"></th></tr></thead><tbody>`;
 sh.forEach(o=>{h+=`<tr class="cl${o.dc===S.dc?' sel':''}" data-dc="${esc(o.dc)}"><td>${esc(dcName(o.dc))}</td><td class="n">${fmt(o.n)}</td><td class="n">${o.A||'–'}</td><td class="n">${o.OFM||'–'}</td><td class="hm" style="width:35%"><div class="mini" style="min-width:0;width:${o.n/mx*100}%"><b style="width:${o.A/o.n*100}%;background:${CC.A}"></b><b style="width:${o.OFM/o.n*100}%;background:${CC.OFM}"></b></div></td></tr>`});
 const tot=rows.length,ta=rows.filter(r=>r.c==='A').length;
 h+=`</tbody><tfoot><tr><td><b>รวม</b></td><td class="n"><b>${fmt(tot)}</b></td><td class="n"><b>${fmt(ta)}</b></td><td class="n"><b>${fmt(tot-ta)}</b></td><td class="hm"></td></tr></tfoot>`;
 $('tDC').innerHTML=h;
 let note=`${list.length} DC`;
 if(S.dc){const m=list.find(o=>o.dc===S.dc);if(m){const rk=[...list].sort((a,b)=>b.n-a.n).findIndex(o=>o.dc===S.dc)+1;note=`<b>${esc(dcName(S.dc))}</b>: ${fmt(m.n)} งาน (อันดับ ${rk} จาก ${list.length} DC)`}}
 $('dcMore').innerHTML=note+(list.length>lim?` · แสดง ${lim} DC · <a href="#" id="allDC">แสดงทั้งหมด</a>`:'');
}
$('tDC').onclick=e=>{
 const t=e.target.closest('th.s');
 if(t){const k=t.dataset.k;if(S.sortDC===k)S.dirDC*=-1;else{S.sortDC=k;S.dirDC=k==='dc'?1:-1}render();return}
 const r=e.target.closest('tr.cl');if(r){S.dc=S.dc===r.dataset.dc?'':r.dataset.dc;S.lim=30;sync();scrollTo({top:0,behavior:'smooth'})}
};
document.addEventListener('click',e=>{if(e.target.id==='allDC'){e.preventDefault();S.showAllDC=true;render()}});

/* ---------- stores ---------- */
function drawStore(rows){
 const g={};
 rows.forEach(r=>{if(!r.n||r.n==='ลูกค้าบุคคล')return;const k=r.n+'|'+r.dc;(g[k]=g[k]||{name:r.n,dc:r.dc,n:0,last:''}).n++;if(r.d>g[k].last)g[k].last=r.d});
 const list=Object.values(g).sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last));
 $('storeSub').textContent=list.length?`${fmt(list.length)} ร้าน/สาขา · แสดง 10 อันดับ`:'';
 if(!list.length){$('tStore').innerHTML='<tbody><tr><td class="empty">ไม่มีข้อมูล</td></tr></tbody>';return}
 $('tStore').innerHTML=`<thead><tr><th>ร้าน / สาขา</th><th class="hm">DC</th><th class="n">งาน</th><th class="n hm">แจ้งล่าสุด</th></tr></thead><tbody>`+
  list.slice(0,10).map(o=>`<tr><td>${esc(o.name)}</td><td class="hm">${esc(dcName(o.dc))}</td><td class="n">${o.n}</td><td class="n hm">${dlab(o.last)}</td></tr>`).join('')+'</tbody>';
}

/* ---------- records ---------- */
let recRows=[];
function drawRec(rows){
 const q=S.q.trim().toLowerCase();
 recRows=rows.filter(r=>!q||[r.n,r.dc,r.ref,r.b,(r.p||[]).join(' ')].join(' ').toLowerCase().includes(q))
  .sort((a,b)=>b.d.localeCompare(a.d)||(a.n||'').localeCompare(b.n||'','th'));
 $('recSub').textContent=`${fmt(recRows.length)} รายการ`;
 if(!recRows.length){$('tRec').innerHTML='<tbody><tr><td class="empty">ไม่พบรายการ</td></tr></tbody>';$('btnMore').style.display='none';return}
 $('tRec').innerHTML=`<thead><tr><th>วันที่แจ้ง</th><th>ร้าน / สาขา</th><th>DC</th><th>เลขที่อ้างอิง</th></tr></thead><tbody>`+
 recRows.slice(0,S.lim).map(r=>{
  const prod=r.p&&r.p.length?`<div class="mut" style="font-size:12px">${esc(r.p.join(', ').slice(0,90))}${r.q?' × '+r.q:''}</div>`:'';
  return `<tr><td style="white-space:nowrap">${dlab(r.d)} <span class="mut" style="font-size:11px">${r.c}</span></td><td>${esc(r.n||'–')}${prod}</td><td>${esc(dcName(r.dc))}</td><td style="font-size:12px;color:#6b7280">${esc(r.ref)}</td></tr>`}).join('')+'</tbody>';
 $('btnMore').style.display=recRows.length>S.lim?'':'none';
 $('btnMore').textContent=`แสดงเพิ่ม (เหลือ ${fmt(recRows.length-S.lim)})`;
}
$('q').oninput=e=>{S.q=e.target.value;S.lim=30;render()};
$('btnMore').onclick=()=>{S.lim+=50;render()};
$('btnCsv').onclick=()=>{
 const H=['วันที่แจ้ง','ลูกค้า','ร้าน/สาขา','DC','เลขที่อ้างอิง','จำนวนชิ้น','สินค้า'];
 const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const csv='﻿'+[H.map(q).join(',')].concat(recRows.map(r=>[r.d,CUST[r.c].name,r.n,r.dc,r.ref,r.q||'',(r.p||[]).join(' / ')].map(q).join(','))).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='credit_pickup_'+(S.dc||'all')+'_'+S.from+'_'+S.to+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
addEventListener('keydown',e=>{
 if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus()}
 if(e.key==='Escape'){if(S.q){S.q='';$('q').value='';render()}hideTip()}
});

/* ---------- render ---------- */
function render(){
 const b=base();               // ลูกค้า + ช่วง (ทุก DC)
 const d=b.filter(inDC);       // + DC ที่เลือก
 drawKPI(d);drawChart(d);drawViz(b,d);drawDC(b);drawStore(d);drawRec(d);
 $('foot').innerHTML=`ข้อมูลรวม ${fmt(DATA.length)} งาน (${CUST.A.name} ${fmt(DATA.filter(r=>r.c==='A').length)} · ${CUST.OFM.name} ${fmt(DATA.filter(r=>r.c==='OFM').length)}) · นับตามวันที่แจ้งเข้ารับ 1 เลข Booking/RS = 1 งาน · ไม่แสดงเบอร์โทร/ที่อยู่ลูกค้าปลายทาง`;
}
function sync(){document.body.classList.toggle('ofm',S.c==='OFM');drawCtl();render();
 const u=new URL(location.href);u.search='';
 if(S.c!=='all')u.searchParams.set('c',S.c);if(S.dc)u.searchParams.set('dc',S.dc);if(S.r!=='x')u.searchParams.set('r',S.r);
 try{history.replaceState(null,'',u)}catch(e){}}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>drawChart(base().filter(inDC)),150)});

$('asof').textContent=`ข้อมูลถึง ${dlab(ASOF)} · ทยอยอัปเดต`;$('asofP').textContent=`ข้อมูลถึง ${dlab(ASOF)}`;
setRange();sync();
</script>
</body>
