<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สต็อกกล่อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fff;--fg:#111827;--mute:#6B7280;--line:#E5E7EB;--soft:#F9FAFB;--acc:#1D4ED8;--cold:#2563EB;--std:#9A6B3F;--fruit:#3E8E4E;--ok:#047857;--bad:#B91C1C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Thai',Tahoma,sans-serif;font-size:14px}
header{padding:16px 20px 0}
h1{font-size:19px;margin:0 0 2px;font-weight:700}
.sub{color:var(--mute);font-size:12.5px}
nav{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:none;background:none;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mute);cursor:pointer;font:inherit;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
main{padding:16px 20px 36px;max-width:1500px}
.tab{display:none}.tab.on{display:block}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.bar .sp{flex:1}
select,input[type=text],input[type=number],input[type=password],input[type=date]{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;color:var(--fg)}
button.b{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--fg);display:inline-flex;gap:6px;align-items:center}
button.b:hover{border-color:#9CA3AF}
button.b.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.b:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 14px;font:inherit;cursor:pointer;color:var(--mute);display:inline-flex;gap:6px;align-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--fg);color:#fff}
.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kp{border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.kp .l{color:var(--mute);font-size:12px;display:flex;gap:6px;align-items:center}
.kp .v{font-size:25px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kp .v small{font-size:13px;font-weight:500;color:var(--mute);margin-left:4px}
.kp .f{color:var(--mute);font-size:12px;margin-top:2px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.card .hint{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.chartbox{position:relative;height:260px}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#fff;z-index:2;font-weight:600;text-align:center;border-bottom:1px solid #D1D5DB}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.stick,th.stick{position:sticky;left:0;background:#fff;z-index:1;text-align:left}
th.stick{z-index:3}
tr.gh td{background:var(--soft);font-weight:600;font-size:12.5px}
tr.tot td{font-weight:700;background:var(--soft)}
td small,.mut{color:var(--mute);font-size:11.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.g-cold{color:var(--cold)}.g-std{color:var(--std)}.g-fruit{color:var(--fruit)}
.kp{border-radius:14px;padding:14px 16px}.kp .kh{display:flex;justify-content:space-between;align-items:center;gap:8px}.kp .l{font-weight:700;color:var(--fg);font-size:13px}.kp .l svg{display:none}
.kp .ki{width:38px;height:38px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center}.kp .ki svg{width:21px;height:21px}.kp .v{font-size:30px}
.kp.k-store{background:#EAF1FD;border-color:#B9D0F4}.kp.k-store .ki{color:#1D4ED8}.kp.k-store .v{color:#1E40AF}
.kp.k-box{background:#EAF1FD;border-color:#B9D0F4}.kp.k-box .ki{color:#1D4ED8}.kp.k-box .v{color:#1E40AF}
.kp.k-wh{background:#EFF1F6;border-color:#CBD2E0}.kp.k-wh .ki{color:#374151}
.kp.k-check{background:#E8F8F0;border-color:#A3E1C5}.kp.k-check .ki{color:#047857}.kp.k-check .v{color:#065F46}
.kp.k-alert{background:#FDECEC;border-color:#F4B4B4}.kp.k-alert .ki{color:#B91C1C}.kp.k-alert .v{color:#B91C1C}
.kp.k-clock{background:#FFF4E3;border-color:#F5CE93}.kp.k-clock .ki{color:#C2570C}.kp.k-clock .v{color:#9A4408}
.df{display:inline-block;font-weight:700;padding:2px 9px;border-radius:7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.df.s{color:#B91C1C;background:#FEE2E2}.df.o{color:#C2410C;background:#FFEDD5}.df.z{color:#047857;background:#DCFCE7}
.chip.bad{background:#FEE2E2;color:#B91C1C;border-color:#F4B4B4;font-weight:700}.chip.ok{background:#DCFCE7;color:#047857;border-color:#A3E1C5;font-weight:700}
tr.bd td{background:#FFF7F7}tr.bd td.stick{background:#FFF7F7}
.cn-sm{font-weight:600}.cn-sm .s{color:#B91C1C}.cn-sm .o{color:#C2410C}
tr.sel td{background:#F3F4F6;font-weight:600}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px}
.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.dk{background:var(--fg);border-color:var(--fg);color:#fff}
.cv{display:inline-block;height:8px;background:var(--fg);border-radius:2px;vertical-align:middle;margin-right:6px}
.cv.low{background:var(--bad)}
.dl.up{color:var(--fg)}.dl{font-size:12px;color:var(--mute)}
.empty{padding:36px;text-align:center;color:var(--mute)}
.err{color:var(--bad)}
#load{padding:50px;text-align:center;color:var(--mute)}
.pbar{height:4px;background:var(--line);border-radius:2px;margin:10px auto 0;max-width:260px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--fg);width:0;transition:width .2s}
.idrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:14px}
.idrow h2{margin:0;font-size:20px}
.idrow .big{margin-left:auto;text-align:right}.idrow .big b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
.wkc{background:#F3F4F6}.z{color:#D1D5DB}
.wait{border:1px dashed #9CA3AF;border-radius:8px;padding:14px 16px;margin-bottom:16px;background:#fff}
.wait h3{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center}
.wait ol{margin:6px 0 10px 18px;padding:0;color:var(--mute);font-size:13px}
.wait input{width:84px;text-align:right;background:var(--soft)}
.cnt ol{margin:6px 0 10px 18px;padding:0;color:var(--mute);font-size:13px}
.cnt input.q{width:76px;text-align:right}.cnt input.nt{width:100%;min-width:160px}
.cnt .warn{border:1px solid var(--bad);border-radius:8px;padding:10px 12px;margin:10px 0;color:var(--bad);font-size:13.5px}
.cnt .info{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13px;background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.grid input{width:100%;text-align:right;font-size:15px}
.only nav{display:none}.emb header{display:none}.emb main{padding:10px 14px 24px;max-width:none}.emb nav{padding:0 4px}
@media(max-width:700px){main{padding:12px 12px 30px}.kp .v{font-size:22px}.idrow .big{margin-left:0;text-align:left}}

<body>
<header><h1>สต็อกและการใช้กล่อง</h1><div class="sub" id="status">กำลังโหลด…</div></header>
<main>
  <div id="load">กำลังโหลดข้อมูล…<div class="pbar"><i id="pb"></i></div></div>
  <section id="t-all" class="tab on"></section>
  <section id="t-br" class="tab"></section>
</main>
<script>
// ===== ตั้งค่า: URL ของ GAS ระบบสถิติกล่อง (ตัวเดียวกับหน้าสถิติการใช้กล่อง) =====
const API_URL = 'https://script.google.com/macros/s/AKfycbym6wGRZ19wxQ11tm4-5JIhKkANn-iNfRfWuLlpmwZdYUsJb6HxKuAqr7euiIRX2kSKxg/exec';
const APP_VERSION = 'v2.9 · 2026-11-07';
const SALES_API = 'https://script.google.com/macros/s/AKfycbwHTMoMegT5M73nr9JQndleMm9CkPsqwaNwy8pqzztAOYXcysQ4JDeyARBqWjm9H-cqOw/exec'; // แอปยอดขายสาขา (รายได้ NIM) ใช้บอกว่าสาขาไหนเปิดจริง
const BN_CODE = 'BIN_SVB'; // หน่วย "คลังจัดซื้อ (บางนา)" ในรายงาน NIMEX016290

const SIZES=['SB01','SB02','SB03','SB04','SB05','SB06','S','S+','M','M+','L','L+','XL','XXL','FS1','FM1','FL1','FS2','FM2','FL2'];
const GRP=SIZES.map((s,i)=>i<6?'cold':i<14?'std':'fruit');
const GNAME={cold:'กล่องเย็น',std:'กล่องธรรมดา',fruit:'กล่องผลไม้'};
const GCOL={cold:'#2563EB',std:'#9A6B3F',fruit:'#3E8E4E'};
let BUNDLE=[20,20,10,10,5,5,20,20,20,20,10,10,5,5,10,10,10,10,10,10];
let PRICE=[20,25,35,45,60,70,15,20,25,30,45,55,65,75,30,35,45,35,40,50];
const Z_OF={0:0,90:1.28,95:1.65,99:2.33};
const TH_M=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const QS=new URLSearchParams(location.search);
if(QS.get('embed')==='1')document.documentElement.classList.add('emb');
const ONLY=QS.get('only')||'';   // only=all → เฉพาะภาพรวมทุกสาขา · only=br → เฉพาะสาขาที่ส่งใน ?b=
if(ONLY)document.documentElement.classList.add('only');
const $=id=>document.getElementById(id);
const fmt=v=>v==null||v===''||isNaN(v)?'-':Math.round(v).toLocaleString('en-US');
const fq=v=>!v?'-':v<0.5?'<1':fmt(v);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bun=(q,b)=>{const v=q/b;return Number.isInteger(v)?fmt(v):(Math.round(v*10)/10).toLocaleString('en-US')};
const mLabel=k=>{const[y,m]=k.split('-');return TH_M[+m]+' '+y};
const dow=(k,d)=>{const[y,m]=k.split('-').map(Number);return new Date(y-543,m-1,d).getDay()};
const isWk=w=>w===0||w===6;
const thDay=s=>{const[y,m,d]=s.split('-').map(Number);return `${d} ${TH_M[m]} ${y+543}`};
const sg=(n)=>`<svg class="i" viewBox="0 0 24 24">${n}</svg>`;
const IC={box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',wh:'<path d="M3 21V9l9-5 9 5v12M7 21v-7h10v7M7 17h10"/>',store:'<path d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/>',cal:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',lock:'<path d="M6 11h12v10H6zM8 11V8a4 4 0 018 0v3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',check:'<path d="M5 12l5 5 9-10"/>'};
const ic=n=>sg(IC[n]);

// ===== โหลดข้อมูล =====
function jsonp(params,base,ms){return new Promise((res,rej)=>{
  const cb='__cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script');
  const t=setTimeout(()=>{cleanup();rej(new Error('หมดเวลาเชื่อมต่อ'))},ms||60000);
  function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
  window[cb]=d=>{cleanup();res(d)};
  s.onerror=()=>{cleanup();rej(new Error('เชื่อมต่อ GAS ไม่ได้'))};
  s.src=(base||API_URL)+'?'+new URLSearchParams({...params,callback:cb}).toString();document.body.appendChild(s)})}
async function post(body){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)});return r.json()}
const parseCov=s=>{const o=[];String(s||'').split(',').forEach(p=>{p=p.trim();if(!p)return;const[a,b]=p.split('-').map(Number);for(let d=a;d<=(b||a);d++)o.push(d)});return o};

function mmCalc(m,sd,s,st){
  const{LT,MX,Z,LOWM,lowRule}=st,bu=BUNDLE[s],low=m*30<LOWM;
  if(low&&lowRule==='one'){const mn=Math.max(1,Math.ceil(m*LT+Z*sd*Math.sqrt(LT)));const mx=mn>=bu?Math.ceil((mn+1)/bu)*bu:bu;return{mn,mx,low,one:true}}
  const ss=Z*sd*Math.sqrt(LT);let mn=Math.ceil((m*LT+ss)/bu)*bu,mx=Math.ceil((m*MX+ss)/bu)*bu;mn=Math.max(mn,bu);mx=Math.max(mx,mn+bu);
  return{mn,mx,low,one:false};
}
function prepare(){
  // ยอดรายวัน รวมทั้งสองมุมมอง
  ST={};SA={};
  MONS.forEach(k=>{const t=new Float64Array(32*20),a=new Float64Array(32*20);
    MON[k].rows.forEach(([d,c,s,q])=>{const b=BR.get(c);if(!b)return;a[d*20+s]+=q;if(TG(b))t[d*20+s]+=q});ST[k]=t;SA[k]=a});
  // Min/Max รายคู่ สาขา×ขนาด
  const full=MONS.filter(k=>MON[k].cov.length>=7);MMS=full.slice(-Math.max(1,+CFG.mmMonths||3));
  MMN=MMS.reduce((a,k)=>a+MON[k].cov.length,0);
  const acc=new Map();
  MMS.forEach(k=>MON[k].rows.forEach(([d,c,s,q])=>{const b=BR.get(c);if(!TG(b))return;const key=c+'|'+s;let a=acc.get(key);if(!a){a=[0,0,c,s];acc.set(key,a)}a[0]+=q;a[1]+=q*q}));
  const LT=Math.max(1,+CFG.lt||5),st={LT,MX:Math.max(LT+1,+CFG.max||15),Z:Z_OF[CFG.safety]??1.65,LOWM:+CFG.low||0,lowRule:CFG.lowRule==='one'?'one':'normal'};
  PAIRS=new Map();
  acc.forEach(([sm,sq,c,s],key)=>{const m=sm/MMN,sd=Math.sqrt(Math.max(0,sq/MMN-m*m));PAIRS.set(key,{c,s,m,...mmCalc(m,sd,s,st)})});
  // สต็อกที่สาขา และคลังบางนา จากรายงาน
  STKB=new Map();BNQ=null;
  if(STK)STK.rows.forEach(([c,n,s,q])=>{
    if(c===BN_CODE){if(!BNQ)BNQ=new Float64Array(20);BNQ[s]+=q;return}
    let b=BR.get(c);
    if(!b){if(!/^\d+$/.test(c))return;const t=/^shop/i.test(n)?'Shop':/^dc/i.test(n)?'DC':null;if(!t)return;b={code:c,name:n,type:t,dc:t==='DC'?c:c.slice(0,3),dcName:n};BR.set(c,b)}
    if(!TG(b))return;let a=STKB.get(c);if(!a){a=new Float64Array(20);STKB.set(c,a)}a[s]+=q});
  // สาขาที่เปิดจริง = มียอดขายรายได้ NIM (แอปยอดขายสาขา) ในเดือนล่าสุดหรือเดือนก่อนหน้า · ถ้าโหลดแอปยอดขายไม่ได้ ใช้ยอดขายกล่อง 2 เดือนล่าสุดแทน
  OPENS=new Set();
  if(SOPEN)BR.forEach((b,c)=>{if(b.type==='DC'?SOPEN.D.has(c):b.type==='Shop'&&SOPEN.S.has(SOPEN.ns(b.name)))OPENS.add(c)});
  else MONS.slice(-2).forEach(k=>MON[k].rows.forEach(([d,c,s,q])=>{if(q>0)OPENS.add(c)}));
  $('status').textContent=`ยอดใช้: ${MONS.length?mLabel(MONS[0])+' – '+mLabel(MONS[MONS.length-1]):'-'} · สต็อกสาขา ณ ${STK&&STK.asOf?STK.asOf:'ยังไม่มี'} · Min/Max คิดจาก ${MMS.map(mLabel).join(', ')||'-'} · ${APP_VERSION}`;
}
function monthTot(k,t){let s=0;for(const d of MON[k].cov)for(let i=0;i<20;i++)s+=t[k][d*20+i];return s}
function sizeAgg(){
  const A=SIZES.map((_,s)=>({s,mn:0,mx:0,stk:0,use:0,surplus:0,need:0,atMin:0,mainAt:0,main:0}));
  const keys=new Set(PAIRS.keys());STKB.forEach((a,c)=>a.forEach((q,s)=>{if(q)keys.add(c+'|'+s)}));
  keys.forEach(key=>{const[c,ss]=key.split('|'),s=+ss,p=PAIRS.get(key);if(!STKB.has(c))return;
    const q=STKB.get(c)[s],mn=p?p.mn:0,mx=p?p.mx:0,a=A[s];
    a.stk+=q;a.mn+=mn;a.mx+=mx;a.use+=p?p.m:0;a.surplus+=Math.max(0,q-mx);
    if(p){if(q<=mn){a.atMin++;a.need+=Math.max(0,mx-q)}if(!p.low){a.main++;if(q<=mn)a.mainAt++}}});
  return A}

  const stat=(s)=>{const p=PAIRS.get(BRSEL+'|'+s);if(!stk||!p)return '<span class="mut">-</span>';const q=stk[s];
    if(q<=p.mn){const n=Math.max(1,Math.floor((p.mx-q)/BUNDLE[s]));return `<span class="chip bad">ถึง Min · เบิก ${n} มัด</span>`}
    if(q>p.mx)return `<span class="chip">เกิน Max ${bun(q-p.mx,BUNDLE[s])} มัด</span>`;return '<span class="chip ok">ปกติ</span>'};
  let h=`<div class="idrow"><div><h2>${esc(b.name)}</h2><span class="mut">${b.type} · รหัส ${b.code} · สังกัด ${esc(b.dcName)}</span></div><div class="big"><span class="mut">ใช้เฉลี่ย ${mLabel(k)}</span><b>${days?fmt(tot/days):'-'}</b><span class="mut">ใบต่อวัน</span></div></div>`;
  h+=cntBanner(b);
  h+=`<div class="card"><h3>${ic('check')}Min / Max ที่ควรมี เทียบสต็อกในระบบ</h3><p class="hint">เมื่อสต็อกถึง Min เบิกเติมถึง Max · สต็อกในระบบจากรายงาน NIMEX016290 ณ ${STK?esc(STK.asOf):'ยังไม่มี'} (ยังไม่ใช่ตัวเลขนับจริง)</p>
    <div class="tw"><table><thead><tr><th class="stick">ขนาด</th><th>ใบ/มัด</th><th>ใช้/วัน</th><th>Min</th><th>Max</th><th>สต็อกในระบบ (ใบ)</th><th>สถานะ</th></tr></thead><tbody>`+
    (rows.length?['cold','std','fruit'].map(g=>{const rs=rows.filter(s=>GRP[s]===g);return rs.length?`<tr class="gh"><td class="stick" colspan="7"><span class="dot" style="background:${GCOL[g]}"></span>${GNAME[g]}</td></tr>`+rs.map(s=>{const p=PAIRS.get(BRSEL+'|'+s),bu=BUNDLE[s];
      return `<tr><td class="stick"><b class="g-${g}">${SIZES[s]}</b></td><td class="n">${bu}</td><td class="n">${p?fq(p.m):'-'}</td><td class="n">${p?(p.one&&p.mn%bu?fmt(p.mn)+' ใบ':bun(p.mn,bu)+' มัด')+(p.one?'<small> ถึงแล้วเบิก 1 มัด</small>':''):'-'}</td><td class="n"><b>${p?bun(p.mx,bu)+' มัด':'-'}</b></td><td class="n">${stk?fmt(stk[s]):'-'}</td><td>${stat(s)}</td></tr>`}).join(''):''}).join(''):'<tr><td colspan="7" class="empty">ยังไม่มียอดใช้ในช่วงที่คิด</td></tr>')+`</tbody></table></div></div>`;
  const dm=new Float64Array(32*20);MON[k].rows.forEach(([d,c,s,q])=>{if(c===BRSEL)dm[d*20+s]+=q});
  h+=dailyCard('br','ยอดใช้รายวัน '+mLabel(k),'ใบต่อวัน แยกตามขนาดกล่อง ของสาขานี้',k,(d,s)=>dm[d*20+s]);
  h+=waitPanel(b,rows,stk);
  $('brBody').innerHTML=h;
}
const dfm=d=>d===0?'<span class="df z">ตรง</span>':d<0?`<span class="df s">▼ ขาด ${fmt(-d)}</span>`:`<span class="df o">▲ เกิน ${fmt(d)}</span>`;
const fmtDT=v=>{const d=new Date(v);return isNaN(d)?'-':d.toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})};

function cntBanner(b){
  const lr=CNT.filter(q=>q[3]===b.code),go=`onclick="const e=document.getElementById('cntCard');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})"`;
  if(!lr.length)return `<div class="cb cb-none"><div class="cb-top"><span class="cb-ic">${ic('clock')}</span><div class="cb-tx"><b>ยังไม่เคยนับสต็อกกล่อง</b><span>นับแล้วระบบจะเทียบกับรายงาน และเทียบกับ Min / Max ที่แนะนำให้อัตโนมัติ</span></div><button class="b pri" ${go}>เริ่มนับสต็อก</button></div></div>`;
  const bad=lr.filter(q=>q[9]!==q[8]).sort((x,y)=>Math.abs(y[9]-y[8])-Math.abs(x[9]-x[8])),sh=bad.reduce((t,q)=>t+Math.max(0,q[8]-q[9]),0),ov=bad.reduce((t,q)=>t+Math.max(0,q[9]-q[8]),0);
  const days=Math.floor((Date.now()-new Date(lr[0][1]||lr[0][0]))/864e5),ago=isNaN(days)?'':days<=0?'วันนี้':days+' วันที่แล้ว';
  const chips=bad.slice(0,8).map(q=>{const d=q[9]-q[8];return `<span class="cb-chip ${d<0?'s':'o'}"><b>${esc(q[7])}</b> ${d<0?'▼ ขาด '+fmt(-d):'▲ เกิน '+fmt(d)}</span>`}).join('')+(bad.length>8?`<span class="cb-chip">+${bad.length-8} ขนาด</span>`:'');
  // เทียบยอดนับจริงกับ Min/Max ที่แนะนำ
  const mm=lr.map(q=>{const s=SIZES.indexOf(q[7]),p=s<0?null:PAIRS.get(b.code+'|'+s);return p?{n:q[7],g:GRP[s],c:q[9],bu:BUNDLE[s],mn:p.mn,mx:p.mx}:null}).filter(Boolean);
  const low=mm.filter(x=>x.c<=x.mn),hi=mm.filter(x=>x.c>x.mx);
  const mrow=x=>{const st=x.c<=x.mn?`<span class="chip bad">ถึง Min · ควรเบิก ${Math.max(1,Math.floor((x.mx-x.c)/x.bu))} มัด</span>`:x.c>x.mx?`<span class="chip">เกิน Max ${bun(x.c-x.mx,x.bu)} มัด</span>`:'<span class="chip ok">ปกติ</span>';
    return `<tr><td><b class="g-${x.g}">${esc(x.n)}</b></td><td class="n">${fmt(x.mn)}</td><td class="n">${fmt(x.mx)}</td><td class="n"><b>${fmt(x.c)}</b></td><td>${st}</td></tr>`};
  const mmH=mm.length?`<details class="cb-mm" ${low.length?'open':''}><summary>เทียบยอดนับจริงกับ Min / Max ที่แนะนำ · <b class="${low.length?'r':''}">ถึง Min ${low.length}</b> · เกิน Max ${hi.length} · ปกติ ${mm.length-low.length-hi.length}</summary><div class="tw"><table><thead><tr><th>ขนาด</th><th>Min (ใบ)</th><th>Max (ใบ)</th><th>นับจริง (ใบ)</th><th>สถานะ</th></tr></thead><tbody>${mm.sort((a,c)=>(c.c<=c.mn)-(a.c<=a.mn)).map(mrow).join('')}</tbody></table></div></details>`:'';
  return `<div class="cb ${bad.length?'cb-bad':'cb-ok'}"><div class="cb-top"><span class="cb-ic">${ic(bad.length?'alert':'check')}</span><div class="cb-tx"><b>ผลนับสต็อกล่าสุด · ${bad.length?`ไม่ตรงระบบ ${bad.length} ขนาด`:'ตรงกับระบบทุกขนาด'}</b><span>นับเมื่อ ${fmtDT(lr[0][1]||lr[0][0])}${ago?' ('+ago+')':''} · ผู้นับ ${esc(lr[0][5]||'-')}</span></div>
    <div class="cb-btn"><button class="b" onclick="dlPng('${esc(b.code)}')">ดาวน์โหลดรายงาน PNG</button><button class="b pri" ${go}>นับใหม่</button></div></div>
    ${bad.length?`<div class="cb-st"><div class="cb-n s"><span>ของขาด</span><b>${fmt(sh)}</b><small>ใบ</small></div><div class="cb-n o"><span>ของเกิน</span><b>${fmt(ov)}</b><small>ใบ</small></div><div class="cb-chips">${chips}</div></div>`:''}${mmH}</div>`;
}
function waitPanel(b){
  const lr=CNT.filter(r=>r[3]===b.code);let last='';
  if(lr.length){const bad=lr.filter(r=>r[9]!==r[8]);
    const rr=SIZES.map((_,s)=>lr.find(r=>r[7]===SIZES[s])).filter(Boolean);
    last=`<div class="info">นับล่าสุด <b>${fmtDT(lr[0][0])}</b> โดย ${esc(lr[0][5]||'-')} · รายงานระบบที่ใช้เทียบ ดึงเมื่อ ${fmtDT(lr[0][2])} · ${bad.length?`ต่างจากระบบ <b class="err">${bad.length}</b> ขนาด`:'<span class="chip ok">ตรงกับระบบทุกขนาด</span>'}
      <div style="margin-top:8px"><button class="b" onclick="dlPng('${esc(b.code)}')">ดาวน์โหลดรายงาน PNG</button></div><details style="margin-top:8px"><summary style="cursor:pointer">ดูผลนับครั้งล่าสุดรายขนาด</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th class="stick">ขนาด</th><th>ตามระบบ</th><th>นับจริง</th><th>ส่วนต่าง</th><th>หมายเหตุ</th></tr></thead><tbody>${rr.map(r=>{const d=r[9]-r[8];return `<tr><td class="stick"><b class="g-${GRP[SIZES.indexOf(r[7])]}">${esc(r[7])}</b></td><td class="n">${fmt(r[8])}</td><td class="n">${fmt(r[9])}</td><td class="n">${d===0?'<span class="chip ok">ตรง</span>':(d>0?'+':'')+fmt(d)}</td><td style="white-space:normal">${esc(r[10]||'')}</td></tr>`}).join('')}</tbody></table></div></details></div>`}
  return `<div class="card cnt" id="cntCard"><h3>${ic('check')}นับสต็อกจริง เทียบกับรายงานในระบบ</h3>
    <ol><li>ดึงรายงาน <b style="color:var(--fg)">NIMEX016290</b> ของสาขาตัวเอง แล้ว<b style="color:var(--fg)">นับของจริงต่อทันที</b> (ควรนับก่อนเปิดร้าน ก่อนมีรับ/เบิก/ขายกล่อง)</li>
    <li>อัปโหลดไฟล์ที่ดึงด้านล่าง ระบบจะตรวจว่าเป็นของสาขานี้หรือไม่</li>
    <li>กรอกจำนวนที่นับได้เป็น <b style="color:var(--fg)">ใบ</b> ต่อขนาด · ขนาดที่ไม่ตรงกับระบบต้องใส่หมายเหตุ</li></ol>
    ${last}
    <div class="bar"><input type="file" id="cntF" accept=".xls,.xlsx" onchange="stageCount(event)"></div><div id="cntBody"></div></div>`;
}
async function stageCount(e){
  const f=e.target.files[0],bd=$('cntBody');CNTS=null;if(!f){bd.innerHTML='';return}
  const b=BR.get(BRSEL);
  try{
    const P=parseStock(await f.arrayBuffer());
    const codes=new Map();P.rows.forEach(r=>codes.set(r[0],r[1]));
    if(!codes.size)throw new Error('ไม่พบกล่อง 20 ขนาดในไฟล์');
    const names=[...codes].map(([c,n])=>`${esc(n||'')} (${esc(c)})`).join(', ');
    let MC=BRSEL;if(codes.size===1&&!codes.has(BRSEL)&&b&&nrm([...codes.values()][0])===nrm(b.name))MC=[...codes.keys()][0];   // รหัสในรายงาน (ERP) ไม่ตรงรหัสระบบ แต่ชื่อสาขาตรงกัน → ใช้ชื่อ
    if(codes.size>1||!codes.has(MC)){
      e.target.value='';
      bd.innerHTML=`<div class="warn"><b>ผิดสาขา</b> — ${codes.size>1?`ไฟล์นี้เป็นไฟล์รวมหลายสาขา (${codes.size} หน่วยงาน) ไม่สามารถใช้นับได้ ให้ดึงรายงานเฉพาะสาขาของตัวเอง`:`ไฟล์นี้เป็นของ ${names} แต่กำลังนับ ${esc(b.name)} (${esc(BRSEL)})`}<br>ดึงรายงาน NIMEX016290 ใหม่ให้ตรงสาขา แล้วอัปโหลดอีกครั้ง</div>`;return}
    const sys=new Array(20).fill(0),has=new Array(20).fill(false);
    P.rows.forEach(([c,n,s,q])=>{if(c===MC){sys[s]+=q;has[s]=true}});
    CNTS={f,sys,has,rt:f.lastModified||Date.now(),cb:{},cp:{},nt:{}};
    renderCnt();
  }catch(err){bd.innerHTML=`<p class="err">อ่านไฟล์ไม่สำเร็จ: ${esc(err.message)}</p>`}
}
function renderCnt(){
  const S=CNTS,b=BR.get(BRSEL),age=(Date.now()-S.rt)/36e5;
  let h=`<div class="info">ไฟล์: <b>${esc(S.f.name)}</b> · สาขา <b>${esc(b.name)}</b> ถูกต้อง · ดึงรายงานเมื่อ <b>${fmtDT(S.rt)}</b></div>`;
  if(age>3)h+=`<div class="warn">รายงานถูกดึงเมื่อ ${age<24?fmt(age)+' ชั่วโมง':fmt(age/24)+' วัน'}ก่อน ตัวเลขในระบบอาจเปลี่ยนไปแล้ว ถ้ายังไม่ได้นับ ให้ดึงรายงานใหม่ก่อน</div>`;
  h+=`<div class="tw"><table><thead><tr><th class="stick">ขนาด</th><th>ใบ/มัด</th><th>ตามระบบ (ใบ)</th><th>นับจริง (ใบ)</th><th>ส่วนต่าง</th><th>หมายเหตุ (ถ้าไม่ตรง)</th></tr></thead><tbody>`+
  ['cold','std','fruit'].map(g=>`<tr class="gh"><td class="stick" colspan="6"><span class="dot" style="background:${GCOL[g]}"></span>${GNAME[g]}</td></tr>`+
    SIZES.map((_,s)=>s).filter(s=>GRP[s]===g).map(s=>`<tr><td class="stick"><b class="g-${g}">${SIZES[s]}</b>${S.has[s]?'':' <small>ไม่มีในรายงาน</small>'}</td><td class="n">${BUNDLE[s]}</td><td class="n"><b>${fmt(S.sys[s])}</b></td>
      <td class="n"><input class="q" type="number" min="0" step="1" inputmode="numeric" id="cb${s}" oninput="updCnt(${s})"></td>
      <td class="n" id="cd${s}">-</td><td><input class="nt" type="text" id="cn${s}" maxlength="300" placeholder="เช่น รับของยังไม่ลงระบบ / ส่งคืนบางนา" oninput="updCnt(${s})" style="display:none"></td></tr>`).join('')).join('')+
  `</tbody></table></div><div id="cntSum" class="info"></div>
  <div class="bar"><input type="text" id="cntBy" placeholder="ชื่อผู้นับ" maxlength="60" style="min-width:160px">${CFG.stockPin?'<input type="password" id="cntPin" placeholder="รหัสสาขา" style="width:120px">':''}<button class="b" id="cntGo" onclick="doSaveCount()" disabled>บันทึกผลนับ</button><span class="mut" id="cntMsg"></span></div>`;
  $('cntBody').innerHTML=h;updCnt(-1);
}
function cntRead(s){
  const v=$('cb'+s).value.trim();
  return{tot:v===''?null:Math.max(0,Math.round(+v)),note:$('cn'+s).value.trim()};
}
function updCnt(i){
  const S=CNTS;if(!S)return;
  let n=0,bad=0,miss=0,need=0,net=0;
  SIZES.forEach((_,s)=>{const r=cntRead(s),sys=S.sys[s];
    if(r.tot==null){if(sys!==0)miss++;$('cd'+s).innerHTML='-';$('cn'+s).style.display='none';return}
    n++;const d=r.tot-sys;net+=d;
    $('cd'+s).innerHTML=dfm(d);$('cd'+s).closest('tr').classList.toggle('bd',d!==0);
    const ne=$('cn'+s);ne.style.display=d===0?'none':'block';
    if(d!==0){bad++;if(!r.note)need++}});
  $('cntSum').innerHTML=`นับแล้ว <b>${n}</b> ขนาด · ไม่ตรงระบบ <b class="${bad?'err':''}">${bad}</b> ขนาด (รวม ${net===0?'0':dfm(net)} ใบ)`+(miss?` · <span class="err">ยังไม่ได้กรอก ${miss} ขนาดที่ระบบมีของ</span>`:'')+(need?` · <span class="err">ต้องใส่หมายเหตุอีก ${need} ขนาด</span>`:'');
  $('cntGo').disabled=!(n>0&&!miss&&!need);
}
async function doSaveCount(){
  const S=CNTS;if(!S)return;const by=$('cntBy').value.trim();if(!by){alert('ใส่ชื่อผู้นับ');return}
  const gap=(Date.now()-S.rt)/36e5;
  if(gap>3&&!confirm(`รายงานถูกดึงเมื่อ ${fmtDT(S.rt)} ห่างจากตอนนี้ ${fmt(gap)} ชั่วโมง ตัวเลขอาจไม่ตรงเวลาเดียวกับที่นับ บันทึกต่อใช่หรือไม่?`))return;
  const rows=[];SIZES.forEach((z,s)=>{const r=cntRead(s);const t=r.tot==null?0:r.tot;if(r.tot==null&&S.sys[s]===0)return;rows.push([z,S.sys[s],t,r.tot===S.sys[s]?'':r.note])});
  $('cntGo').disabled=true;$('cntMsg').textContent='กำลังบันทึก…';
  try{const r=await post({action:'saveCount',pin:$('cntPin')?$('cntPin').value:'',code:BRSEL,by,file:S.f.name,reportAt:new Date(S.rt).toISOString(),countAt:new Date().toISOString(),rows});
    if(!r.ok)throw new Error(r.error||'บันทึกไม่สำเร็จ');
    const c=await jsonp({action:'counts'});if(c.ok)CNT=c.rows;CNTS=null;CNTALL=null;renderBr();drawCharts();
    $('cntBody').innerHTML=`<div class="info"><span class="chip ok">บันทึกแล้ว</span> ${fmt(r.rows)} ขนาด · ส่วนต่างรวม ${fmt(r.diff)} ใบ</div>`}
  catch(err){$('cntMsg').innerHTML=`<span class="err">${esc(err.message)}</span>`;updCnt(-1)}
}
window.addEventListener('message',e=>{if(e.data==='box:refresh')load()});
load();
</script>
