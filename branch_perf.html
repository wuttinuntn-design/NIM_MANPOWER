<script>
'use strict';
/* =====================================================================
   Performance สาขา v1 · 2026-10-27
   มุมมองรวมทุกมิติของสาขา เทียบกับสาขากลุ่มขนาดเดียวกัน (S / M / L / XL)
   แหล่งข้อมูล
    · ยอดขาย  : API ระบบยอดขาย (NIMEX441) — MTD เดือนที่เลือก เทียบเดือนก่อนช่วงวันเดียวกัน
    · ต้นทุน  : ไฟล์ต้นทุนสาขา (COST_URL) — ยอดจริงรายเดือน ใช้เดือนล่าสุดที่ปิดแล้ว
    · กำลังคน / ชิ้นต่อคน / ตารางกะ : ระบบตารางกะ (หน้านี้ต้องเปิดจากระบบตารางกะ — parent.perfData)
    · To Do List : API To Do List — คะแนนส่งงานประจำวันเดือนนี้
   v4: ปรับหน้าตาหน้าสาขา (hero + คะแนน, การ์ด KPI พร้อมกราฟเล็ก, การ์ด 5 มิติ, หัวข้อแบ่งส่วน)
   v3: ใช้เกณฑ์ต้นทุนสาขา % (ค่ากลางกลุ่ม) + ต้นทุนต่อบิล แทนจุดคุ้มทุน · กราฟรายวัน/สะสม/รายเดือน/โดนัท/วันในสัปดาห์/ตำแหน่งในกลุ่ม
   v2: มุมมองอ่านง่ายสำหรับสาขา (ค่าเริ่มต้นเมื่อเปิดจากแท็บสาขา) · แถบรายเดือน · ปฏิทินรายวัน
   ลิงก์: ?br=150 · &ym=2026-10 · &embed=1 · &page=br (ล็อกสาขา)
   ===================================================================== */
const APP_VERSION='v4.1 · 2026-10-28';
const SALES_API='https://script.google.com/macros/s/AKfycbwHTMoMegT5M73nr9JQndleMm9CkPsqwaNwy8pqzztAOYXcysQ4JDeyARBqWjm9H-cqOw/exec';
const TODO_API='https://script.google.com/macros/s/AKfycbw5OexW0xsy7EJXJ4fiKpBma9fWVNqxGRzK2ac0j2c0OMRKWjEgkPfUj57TMVF5rnLI/exec';
const COST_URL='perf_cost.json';   // ไฟล์ต้นทุน (JSON) หรือหน้า Dashboard ต้นทุนสาขา (HTML ที่มี window.NIM_COST) บนโดเมนเดียวกัน
/* กลุ่มขนาดสาขา (เกณฑ์ PEP): แก้ที่ Google Sheet ระบบตารางกะ › ชีต M_Branch › คอลัมน์ size (N / S / M / L / XL) · SIZE_OVERRIDE ใช้ทดสอบเท่านั้น */
const SIZE_OVERRIDE={};
/* เกณฑ์ต้นทุนสาขา % ของยอดขาย: null = ใช้ค่ากลางของกลุ่มขนาดเดียวกัน · ใส่ตัวเลข เช่น 25 = ใช้เป้าเดียวทุกสาขา */
const COST_TARGET=null;

/* ประเภทต้นทุน (index บรรทัดในไฟล์ต้นทุน): v = ผันแปรตามยอดขาย · ที่ไม่อยู่ในรายการ = คงที่ · เงินเดือนค่าจ้าง = ค่าแรง (ตามคน-วันในตารางกะ) · ต้นทุนเข้ารับ = ผันแปร */
const VAR_LINES={2:'ค่าเดินทาง',4:'น้ำมันรถบริษัท',17:'วัสดุสิ้นเปลือง',19:'หมึกพิมพ์',20:'ม้วนกระดาษความร้อน',31:'เชื้อเพลิงโฟล์คลิฟ',37:'ทางด่วน',41:'ค่าธรรมเนียมธนาคาร',47:'ค่าจ้างแรงงานทั่วไป',49:'ค่าขนส่งทั่วไป',60:'สินค้าเสียหาย'};
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null||isNaN(n)?'–':Math.round(n).toLocaleString('en-US'),f1=n=>n==null||!isFinite(n)?'–':n.toFixed(1);
const fM=n=>n==null?'–':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+' ล้าน':fmt(n);
const sg=n=>n==null||!isFinite(n)?'–':(n>0?'+':'')+n.toFixed(1)+'%';
const IC={gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',coin:'<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
 check:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/>',bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 16v-4M11 16V8M15 16v-6M19 16V5"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',scatter:'<circle cx="7.5" cy="7.5" r=".5"/><circle cx="18.5" cy="5.5" r=".5"/><circle cx="11.5" cy="11.5" r=".5"/><circle cx="7.5" cy="16.5" r=".5"/><circle cx="17.5" cy="14.5" r=".5"/><path d="M3 3v16a2 2 0 0 0 2 2h16"/>',
 alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>'};
const ic=(k,s=16)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]||''}</svg>`;
const median=a=>{const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!v.length)return null;const h=v.length>>1;return v.length%2?v[h]:(v[h-1]+v[h])/2};
const pctl=(v,arr,low)=>{const a=arr.filter(x=>x!=null&&isFinite(x));if(v==null||!isFinite(v)||a.length<3)return null;const below=a.filter(x=>low?x>v:x<v).length,eq=a.filter(x=>x===v).length;return Math.round((below+eq/2)/a.length*100)};
const avg=a=>{const v=a.filter(x=>x!=null&&isFinite(x));return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):null};
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
const prevYm=ym=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const isoToday=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function jsonp(url,p){return new Promise((ok,no)=>{const cb='pf'+Date.now()+Math.floor(Math.random()*1e5),s=document.createElement('script');const t=setTimeout(()=>{delete window[cb];s.remove();no(new Error('timeout'))},45000);
  window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();d&&d.ok===false?no(new Error(d.error||'API error')):ok(d)};s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();no(new Error('เชื่อมต่อไม่ได้'))};
  s.src=url+'?'+new URLSearchParams({...p,callback:cb});document.head.appendChild(s)})}

/* ---------- state ---------- */
const QS=new URLSearchParams(location.search),EMBED=QS.get('embed')==='1',LOCK=QS.get('page')==='br'&&!!QS.get('br');
const S={view:'',dv:'chart',basis:'avg3',selDay:'',selMon:null,br:QS.get('br')||'',ym:/^\d{4}-\d{2}$/.test(QS.get('ym')||'')?QS.get('ym'):isoToday().slice(0,7)};
const DT={cost:null,sales:null,roster:null,todo:null,err:{}};

/* ---------- โหลดข้อมูล ---------- */
async function loadCost(){const r=await fetch(COST_URL,{cache:'no-store'});const t=await r.text();
  if(/window\.NIM_COST\s*=/.test(t)){const a=t.indexOf('{',t.indexOf('window.NIM_COST')),e=t.indexOf('};',a)+1;return fromNimCost(JSON.parse(t.slice(a,e)))}
  return JSON.parse(t)}
/* แปลงข้อมูลจากหน้า Dashboard ต้นทุนสาขา (window.NIM_COST) */
function fromNimCost(D){const NA=D.flags.filter(f=>f==='ACT').length,R=D.rows,iTot=R.length-1,z=r=>Array.from({length:NA},(_,m)=>Math.round((r&&r[m])||0));
  return{months:NA,year:2026,lines:R.slice(2,iTot).map((r,i)=>[i+2,r.l]),br:D.br.filter(b=>(b.t==='DC'||b.t==='CDC')&&b.code).map(b=>{const L={};for(let i=2;i<iTot;i++){const v=z(b.v[i]);if(v.some(Boolean))L[i]=v}
    return{c:b.code,n:b.n,t:b.t,r:b.r,a:b.a||'',s:z(b.s),sal:z(b.v[0]),pu:z(b.v[1]),tot:z(b.v[iTot]),L}})}}
const KEEP=[1,2,4,5,6,7,8,11,14,17,18,21,24,27,33,35,36];   // ลำดับค่าที่ API ยอดขายส่งมา (ตรงกับ branch_sales.html)
async function loadSales(ym){const d=await jsonp(SALES_API,{action:'month',ym});const out={ym:d.ym,days:{}};
  Object.keys(d.days||{}).forEach(ds=>{const o=out.days[ds]={};d.days[ds].forEach(([c,t,csv])=>{const a=String(csv||'').split(','),v={};KEEP.forEach((k,i)=>v[k]=+a[i]||0);const x=o[c]||(o[c]={fr:0,cc:0,bill:0});x.fr+=v[8];x.cc+=v[36];x.bill+=v[7]})});
  out.excl=d.excl||[];return out}
async function loadTodo(ym){const today=isoToday(),last=ym===today.slice(0,7)?today:ym+'-'+String(daysIn(ym)).padStart(2,'0');
  const [b,o]=await Promise.all([jsonp(TODO_API,{action:'bootstrap'}),jsonp(TODO_API,{action:'overview',date:last,n:+last.slice(8)})]);return{boot:b,ov:o,last}}
async function loadRoster(ym){try{if(window.parent&&window.parent!==window&&typeof window.parent.perfData==='function')return await window.parent.perfData(ym)}catch(e){}return null}
async function loadAll(){
  $('app').innerHTML=`<div class="card" style="text-align:center;padding:40px">${ic('gauge',22)}<div style="margin-top:8px">กำลังรวบรวมข้อมูลทุกมิติ…</div><div class="q" style="font-size:12.5px">ยอดขาย · ต้นทุน · ตารางกะ · To Do List</div></div>`;
  const job=async(k,f)=>{try{DT[k]=await f();delete DT.err[k]}catch(e){DT[k]=null;DT.err[k]=e.message||String(e)}};
  await Promise.all([job('cost',loadCost),job('sales',()=>loadSales(S.ym)),job('roster',()=>loadRoster(S.ym)),job('todo',()=>loadTodo(S.ym))]);
  build();render()}

/* ---------- รวมตัวชี้วัดรายสาขา ---------- */
let BR=[];
function build(){
  const C=DT.cost,R=DT.roster,SL=DT.sales,ym=S.ym,ex=new Set((SL&&SL.excl)||['690','691']);
  /* รายชื่อ DC: จากตารางกะ (ไม่รวม Shop / หน่วยย่อย / ส่วนกลาง) · ไม่มีตารางกะ = จากไฟล์ต้นทุน */
  const rmap={};(R?R.rows:[]).forEach(r=>rmap[r.code]=r);
  let codes=R?R.rows.filter(r=>!/shop|unit/i.test(r.type)&&!r.central&&!ex.has(r.code)).map(r=>r.code):(C?C.br.filter(b=>b.t==='DC').map(b=>b.c):[]);
  const cmap={};(C?C.br:[]).forEach(b=>cmap[b.c]=b);
  /* เดือนต้นทุน = เดือนที่เลือก ถ้าปิดบัญชีแล้ว · ไม่งั้นเดือนล่าสุดที่มี */
  const mi=+ym.slice(5)-1,cm=C?(+ym.slice(0,4)===(C.year||2026)&&mi<C.months?mi:C.months-1):null;S.cm=cm;
  /* ยอดขาย MTD: 1..u ของเดือนนี้ · เดือนก่อน 1..min(u, วันของเดือนก่อน) */
  let u=0;if(SL)Object.keys(SL.days).forEach(d=>{if(d.startsWith(ym))u=Math.max(u,+d.slice(8))});S.u=u;
  const pv=prevYm(ym),pu=Math.min(u,daysIn(pv));let pHas=0;
  const sum=(m,a,b,c)=>{let fr=0,cc=0,bill=0;for(let d=a;d<=b;d++){const o=SL&&SL.days[m+'-'+String(d).padStart(2,'0')];if(o&&o[c]){fr+=o[c].fr;cc+=o[c].cc;bill+=o[c].bill}}return{fr,cc,bill}};
  if(SL)for(let d=1;d<=pu;d++)if(SL.days[pv+'-'+String(d).padStart(2,'0')])pHas++;S.pHas=pHas;
  /* To Do List score เดือนนี้ (เหมือนหน้า To Do: ภายในวัน 100 · เลยเวลา 80 · ย้อนหลัง 50 · ไม่ได้ทำ 0) */
  const TD=todoScores();
  BR=codes.map(c=>{const r=rmap[c]||{},cb=cmap[c],shops=R?R.rows.filter(x=>x.parent===c&&/shop/i.test(x.type)):[];
    const s=SL?sum(ym,1,u,c):null,ps=SL&&pHas?sum(pv,1,pu,c):null;
    const mdU=x=>(x.pd||[]).slice(0,u).reduce((a,v)=>a+(v||0),0),mdTo=u?mdU(r)+shops.reduce((a,x)=>a+mdU(x),0):0,emps=(r.emps||0)+shops.reduce((a,x)=>a+(x.emps||0),0);
    const cs=cb&&cm!=null?cb.s[cm]:null,cost=cb&&cm!=null?cb.sal[cm]+cb.pu[cm]+cb.tot[cm]:null,rent=cb&&cm!=null?((cb.L['14']||[])[cm]||0):null;
    const ro=r.status==='submitted'?100:r.status==='draft'?50:r.status?0:null;
    return{c,szM:SIZE_OVERRIDE[c]||(/^(N|S|M|L|XL)$/.test(r.size||'')?r.size:''),n:r.name||(cb&&cb.n)||c,r:r.region||(cb&&cb.r)||'',a:(cb&&cb.a)||'',cb,shops:shops.length,
      sale:s?s.fr:null,cc:s?s.cc:null,bill:s?s.bill:null,psale:ps?ps.fr:null,g:s&&ps&&ps.fr?(s.fr/ps.fr-1)*100:null,
      cost,cs,cp:cs?cost/cs*100:null,rp:cs?rent/cs*100:null,salp:cs&&cb?cb.sal[cm]/cs*100:null,rent,
      emps,mdTo,att:r.att,nl:r.nl,run:r.run,pa:r.pa,act:r.act,ppd:r.ppd,spp:s&&mdTo?s.fr/mdTo:null,status:r.status,ro,td:TD[c]}});
  /* กลุ่มขนาดแบบ PEP (รายได้/เดือน): N < 1 ล้าน · S 1–3 · M 3–6 · L 6–10 · XL ≥ 10 ล้าน
     ใช้คอลัมน์ size ในชีต M_Branch ก่อน · ว่าง = คำนวณจากยอดขายบัญชีเฉลี่ย 3 เดือนล่าสุด (DC + Shop) · ไม่มี = ยอดขาย MTD เทียบเต็มเดือน */
  const base=b=>{const C2=DT.cost;if(C2&&b.cb){const ents=[b.cb,...C2.br.filter(x=>x.t==='Shop'&&x.p===b.c)],n2=C2.months,ms=[n2-3,n2-2,n2-1].filter(m=>m>=0);
      const v=ms.map(m=>ents.reduce((a,x)=>a+(x.s[m]||0),0)).filter(x=>x>0);if(v.length)return v.reduce((a,x)=>a+x,0)/v.length}
    return b.sale&&S.u?b.sale/S.u*daysIn(S.ym):0};
  BR.forEach(b=>{const v=base(b);b.rev=v;b.szA=v>=10e6?'XL':v>=6e6?'L':v>=3e6?'M':v>=1e6?'S':'N';b.sz=b.szM||b.szA});
  /* กลุ่มเทียบ (peer): กลุ่มที่มีไม่ถึง 5 สาขา รวมกับกลุ่มที่เล็กกว่าถัดไป เช่น L(1) + M(2) + S(13) → เทียบในกลุ่ม S–L */
  const ORD=['N','S','M','L','XL'],cnt=z=>BR.filter(b=>b.sz===z).length,PG={};let cur=[];
  for(let i=ORD.length-1;i>=0;i--){cur.push(ORD[i]);const n2=cur.reduce((a,z)=>a+cnt(z),0);if(n2>=5||i===0){const nz=cur.filter(z=>cnt(z)),lb=nz.length>1?nz[nz.length-1]+'–'+nz[0]:(nz[0]||cur[0]);cur.forEach(z=>PG[z]=lb);cur=[]}}
  if(cur.length){const lb=PG['N']||'N';cur.forEach(z=>PG[z]=lb)}
  BR.forEach(b=>b.pg=PG[b.sz]||b.sz);
  S.szManual=BR.filter(b=>b.szM).length;
  if(!S.br||!BR.find(b=>b.c===S.br))S.br=(BR.find(b=>b.c==='150')||BR[0]||{}).c;
}
const TDD={};   // To Do รายวัน: TDD[code][date]=[ส่งแล้ว, ต้องส่ง]
function todoScores(){const T=DT.todo,out={};if(!T)return out;const tasks=T.boot.tasks||[],start=T.boot.start||'',offG=T.boot.off==null?'อา':T.boot.off,last=T.last,today=isoToday();
  const OFF={'อา':0,'จ':1,'อ':2,'พ':3,'พฤ':4,'ศ':5,'ส':6},parse=v=>new Set(String(v||'').split(/[,\s\/|]+/).map(x=>x.replace(/\.$/,'')).filter(x=>x in OFF).map(x=>OFF[x]));
  const offOf=t=>String(t.off_days||'').trim()?(String(t.off_days).trim()==='-'?new Set():parse(t.off_days)):parse(offG);
  const ex=t=>new Set(String(t.except_branches||'').split(/[,\s]+/).filter(Boolean));
  const EXM=T.boot.exempt||[],exm=(t,c,ds)=>EXM.some(e=>e.br===c&&ds>=e.from&&ds<=(e.to||e.from)&&(!e.task||String(e.task).split(/[,\s]+/).includes(t.task_id)));   // ชีต EXEMPT ยกเว้นคะแนน
  const res={};(T.ov.rows||[]).forEach(r=>{const[d,br,tid,rs,da,qc]=r;(res[br]||(res[br]={}))[d+'|'+tid]=[rs,da,qc]});
  const days=[];for(let d=1;d<=+last.slice(8);d++){const ds=last.slice(0,8)+String(d).padStart(2,'0');if(ds>=today)break;if(start&&ds<start)continue;days.push(ds)}
  const codes=new Set(BR_codes());codes.forEach(c=>{let pts=0,n=0;days.forEach(ds=>{const wd=new Date(ds+'T00:00:00').getDay();tasks.forEach(t=>{if(ex(t).has(c)||offOf(t).has(wd)||(t.start_date&&ds<t.start_date)||exm(t,c,ds))return;

/* ---------- รายวัน: ยอดขาย vs ต้นทุน (คงที่ / ค่าแรง / ผันแปร) ---------- */
function dayModel(b){
  const C=DT.cost,R=DT.roster,SL=DT.sales,cm=S.cm,ym=S.ym,n=daysIn(ym);
  if(!C||cm==null||!b.cb)return null;
  /* ต้นทุนอ้างอิง (ของ DC + Shop ในสังกัด)
     · เดือนที่ปิดบัญชีแล้ว = ยอดจริงของเดือนนั้น
     · เดือนที่ยังไม่ปิด = เฉลี่ย 3 เดือนจริงล่าสุด (ค่าเริ่มต้น) หรือ งบประมาณของเดือนนั้น */
  const ents=[b.cb,...C.br.filter(x=>x.t==='Shop'&&(x.p===b.c||(!x.p&&String(x.c).slice(0,3)===b.c)))];
  const yr=C.year||2026,mi=+ym.slice(0,4)===yr?+ym.slice(5)-1:99,isAct=mi<C.months,pi=mi-(C.planFrom||C.months),hasPlan=!isAct&&pi>=0&&ents.some(x=>x.P&&x.P.sal&&x.P.sal[pi]);
  const mode=isAct?'act':(S.basis==='plan'&&hasPlan?'plan':'avg3');
  const ms=mode==='act'?[mi]:mode==='avg3'?[C.months-3,C.months-2,C.months-1].filter(m=>m>=0):[];
  let sal=0,pu=0,fix=0,vr=0,sAcc=0;const fixBy={},varBy={};
  const addL=(i,v)=>{if(VAR_LINES[i]){vr+=v;varBy[i]=(varBy[i]||0)+v}else{fix+=v;fixBy[i]=(fixBy[i]||0)+v}};
  ents.forEach(x=>{if(mode==='plan'){const P=x.P||{};sal+=(P.sal||[])[pi]||0;pu+=(P.pu||[])[pi]||0;sAcc+=(P.s||[])[pi]||0;Object.entries(P.L||{}).forEach(([i,a])=>addL(i,a[pi]||0));return}

function spark(b,G){const C=DT.cost,n=C.months,W=600,H=70,gm=[...Array(n).keys()].map(m=>median(G.filter(x=>x.cb&&x.cb.s[m]>0).map(x=>x.cb.s[m]))),mx=Math.max(...b.cb.s.slice(0,n),...gm.map(x=>x||0))*1.1||1,X=m=>10+m*(W-20)/Math.max(1,n-1),Y=v=>H-6-(v||0)/mx*(H-14);
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><polyline points="${gm.map((v,m)=>X(m)+','+Y(v)).join(' ')}" fill="none" stroke="#98A1AF" stroke-dasharray="4 3"/><polyline points="${b.cb.s.slice(0,n).map((v,m)=>X(m)+','+Y(v)).join(' ')}" fill="none" stroke="#1F3A5F" stroke-width="2.5"/>${b.cb.s.slice(0,n).map((v,m)=>`<circle cx="${X(m)}" cy="${Y(v)}" r="${m===S.cm?5:3}" fill="${m===S.cm?'#1F3A5F':'#fff'}" stroke="#1F3A5F" stroke-width="2" data-tip="${TH_MON[m]} · ${fmt(v)} บาท · กลุ่ม ${fmt(gm[m])}"/>`).join('')}</svg>`}
function ring(v){const r=50,c=2*Math.PI*r,p=(v||0)/100,col=v==null?'#98A1AF':v>=70?'#1E8A5A':v>=30?'#D97706':'#C0392B';
  return`<div class="ring"><svg viewBox="0 0 118 118" width="118" height="118"><circle cx="59" cy="59" r="${r}" fill="none" stroke="#F2F4F7" stroke-width="12"/><circle cx="59" cy="59" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 59 59)"/></svg><b style="color:${col}">${v==null?'–':v}<small>/ 100</small></b></div>`}
function radar(DIM){const W=380,H=190,cx=W/2,cy=H/2+4,R=70,n=DIM.length,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};

  DIM.forEach((d,i)=>{const [x,y]=pt(i,122);g+=`<line x1="${cx}" y1="${cy}" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="#F2F4F7"/><text x="${x}" y="${y+4}" font-size="11" text-anchor="middle" fill="#5A6577">${d.t.split(' · ')[0]}</text>`});

function trend(b,G){const C=DT.cost,n=C.months,W=640,H=230,pl=48,pr=44,pt=16,pb=30,iw=W-pl-pr,ih=H-pt-pb,bw=iw/n,cost=(x,m)=>x.cb.sal[m]+x.cb.pu[m]+x.cb.tot[m];
  const mx=Math.max(...b.cb.s.slice(0,n))*1.15||1,cps=[...Array(n).keys()].map(m=>b.cb.s[m]?cost(b,m)/b.cb.s[m]*100:null),gms=[...Array(n).keys()].map(m=>median(G.filter(x=>x.cb&&x.cb.s[m]>0).map(x=>cost(x,m)/x.cb.s[m]*100)));
  const cmx=Math.max(...cps.filter(x=>x!=null),...gms.filter(x=>x!=null),1)*1.2,y=v=>pt+ih-v/mx*ih,y2=v=>pt+ih-v/cmx*ih;let g='';

  [...Array(n).keys()].forEach(m=>{const x=pl+m*bw+bw*.2,w=bw*.6,s=b.cb.s[m];g+=`<rect x="${x}" y="${y(s)}" width="${w}" height="${pt+ih-y(s)}" rx="3" fill="${m===S.cm?'#1F3A5F':'#AFC0D6'}" data-tip="${TH_MON[m]} · ยอดขาย ${fmt(s)} · ต้นทุน ${fmt(cost(b,m))} (${f1(cps[m])}%) · กลุ่ม ${f1(gms[m])}%"/><text x="${x+w/2}" y="${y(s)-4}" font-size="9.5" text-anchor="middle" fill="#5A6577">${s>=1e6?(s/1e6).toFixed(1)+'M':Math.round(s/1e3)+'K'}</text><text x="${x+w/2}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="${m===S.cm?'#141B26':'#98A1AF'}" font-weight="${m===S.cm?700:400}">${TH_MON[m]}</text>`});
  const line=(arr,c,d)=>{const p=arr.map((v,m)=>v==null?null:[pl+m*bw+bw/2,y2(v)]).filter(Boolean);return`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2" ${d?'stroke-dasharray="5 4"':''}/>`+p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="${d?2:3}" fill="${c}"/>`).join('')};
  g+=line(gms,'#98A1AF',1)+line(cps,'#B45309');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="lg"><span><i style="background:#AFC0D6"></i>ยอดขาย (บัญชี)</span><span><i style="background:#B45309;height:3px"></i>ต้นทุน % ยอดขาย</span><span><i style="background:#98A1AF;height:2px"></i>ค่ากลางกลุ่ม</span></div>`}
function scatter(b,G){const W=420,H=300,pl=50,pr=12,pt=14,pb=36,iw=W-pl-pr,ih=H-pt-pb;

  const xs=P.map(p=>p.x),ys=P.map(p=>p.y),x0=Math.min(...xs)*.9,x1=Math.max(...xs)*1.05,y0=Math.min(...ys)*.85,y1=Math.max(...ys)*1.1,X=v=>pl+(v-x0)/(x1-x0)*iw,Y=v=>pt+ih-(v-y0)/(y1-y0)*ih;

  P.forEach(p=>{const me=p.c===b.c;g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${me?7:4.5}" fill="${me?'#1F3A5F':'#AFC0D6'}" stroke="#fff" stroke-width="1.5" data-tip="${esc(p.c+' '+p.n)} · ต้นทุน ${f1(p.x)}% · ${fmt(p.y)} บาท/คน-วัน"/>`});

  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="q" style="font-size:12px">จุดเข้ม = สาขานี้ · ชี้จุดเพื่อดูชื่อสาขา · เส้นประ = ค่ากลางกลุ่ม</div>`}
/* tooltip */
const TIP=document.createElement('div');TIP.className='gtip hidden';document.body.appendChild(TIP);
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){TIP.classList.add('hidden');return}TIP.textContent=el.getAttribute('data-tip');TIP.classList.remove('hidden');const w=TIP.offsetWidth;TIP.style.left=Math.max(6,Math.min(innerWidth-w-6,e.clientX-w/2))+'px';TIP.style.top=(e.clientY-TIP.offsetHeight-12)+'px'});
/* init */
if(EMBED)document.body.classList.add('embed');if(EMBED&&LOCK){const t=document.querySelector('.top');if(t)t.style.display='none'}
$('logo').innerHTML=ic('gauge',20);
function fillSel(){$('selBr').innerHTML=['XL','L','M','S','N'].filter(z=>BR.some(b=>b.sz===z)).map(z=>`<optgroup label="กลุ่ม ${z} · ${SZN[z]}">${BR.filter(b=>b.sz===z).sort((a,b)=>+a.c-+b.c).map(b=>`<option value="${b.c}" ${b.c===S.br?'selected':''}>${esc(b.c+' '+b.n)}</option>`).join('')}</optgroup>`).join('');
  $('selBr').classList.toggle('hidden',LOCK);
  const L=[];for(let k=0;k<6;k++){let ym=S.ym;for(let j=0;j<k;j++)ym=prevYm(ym);L.push(ym)}
  $('selM').innerHTML=L.map(ym=>`<option value="${ym}" ${ym===S.ym?'selected':''}>${TH_MON[+ym.slice(5)-1]} ${+ym.slice(0,4)+543}</option>`).join('');$('selM').classList.toggle('hidden',EMBED)}
$('selBr').onchange=e=>{S.br=e.target.value;render()};$('selM').onchange=e=>{S.ym=e.target.value;loadAll().then(fillSel)};
document.addEventListener('click',e=>{const t=e.target.closest?e.target:null;if(!t)return;const x=t.closest('#basisSeg [data-b]');if(x&&!x.disabled){S.basis=x.dataset.b;render();return}
  const w=t.closest('[data-sw]');if(w){S.view=w.dataset.sw;render();scrollTo(0,0);return}
  const j=t.closest('[data-jump]');if(j){const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const v=t.closest('[data-dv]');if(v){S.dv=v.dataset.dv;render();return}
  const d=t.closest('[data-ds]');if(d&&!d.disabled){const y0=scrollY;S.selDay=d.dataset.ds;render();scrollTo(0,y0);return}
  const m=t.closest('[data-ym]');if(m&&m.dataset.ym!==S.ym){S.ym=m.dataset.ym;S.selDay='';loadAll().then(fillSel)}});
addEventListener('message',e=>{if(e.data==='perf:refresh')loadAll().then(fillSel)});
loadAll().then(fillSel).catch(e=>{$('app').innerHTML='<div class="card">'+esc(e.message)+'</div>'});
</script>
</body>
</html>
