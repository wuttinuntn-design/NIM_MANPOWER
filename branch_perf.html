<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Performance สาขา</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--line:#E7EAEF;--line2:#F2F4F7;--ink:#141B26;--ink2:#5A6577;--ink3:#98A1AF;--brand:#1F3A5F;--brandSoft:#EEF2F7;
  --ok:#1E8A5A;--okSoft:#E3F4EA;--warn:#D97706;--warnSoft:#FBF1D6;--bad:#C0392B;--badSoft:#FBE3E0;--cc:#0E8C9A;--r:16px;--sh:0 1px 2px rgba(20,27,38,.04),0 2px 8px rgba(20,27,38,.04)}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px}
button,select{font:inherit;color:inherit}.q{color:var(--ink3)}.num{font-variant-numeric:tabular-nums}.hidden{display:none!important}
.ic{display:inline-block;vertical-align:-3px;flex:none}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.ttl b{display:block;font-size:16px;line-height:1.2}.ttl small{color:var(--ink3);font-size:12.5px}.sp{flex:1}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:14px;max-width:100%}
main{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
.demo{background:var(--warnSoft);color:#8a5a00;border-radius:12px;padding:9px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;line-height:1.6}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:#fff;box-shadow:var(--sh);min-width:0}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.card h3 .q{font-weight:400;font-size:12.5px}
.grid{display:grid;gap:16px;margin-bottom:16px;align-items:stretch}
.g-prof{grid-template-columns:1.3fr 1fr}.g-21{grid-template-columns:3fr 2fr}.g-11{grid-template-columns:1fr 1fr}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.g-prof,.g-21,.g-11{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g5{grid-template-columns:1fr}main{padding:12px}}
.prof{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.prof[style*='repeat(6']{grid-template-columns:repeat(3,1fr)!important}}@media(max-width:560px){.prof[style*='repeat(6']{grid-template-columns:repeat(2,1fr)!important}}
.prof div{background:#F7F9FB;border-radius:12px;padding:10px 12px}.prof span{font-size:12px;color:var(--ink2);display:block}.prof b{font-size:18px}
@media(max-width:620px){.prof{grid-template-columns:repeat(2,1fr)}}
.bn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.bn .nm{font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.c-ok{background:var(--okSoft);color:var(--ok)}.c-warn{background:var(--warnSoft);color:var(--warn)}.c-bad{background:var(--badSoft);color:var(--bad)}.c-na{background:var(--line2);color:var(--ink2)}
.sim{font-size:10.5px;font-weight:600;color:#8a5a00;background:var(--warnSoft);border-radius:6px;padding:0 6px;margin-left:auto}
.dim{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c,#1F3A5F)}
.dim .h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2)}
.dim .v{font-size:24px;font-weight:700;line-height:1.15}.dim .v small{font-size:13px;color:var(--ink3);font-weight:500}
.dim .m{font-size:12px;color:var(--ink3)}
.pct{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#FBE3E0 0 30%,#F2F4F7 30% 70%,#E3F4EA 70%);margin:6px 0 2px}
.pct i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink)}.pct u{position:absolute;left:50%;top:-2px;width:1px;height:12px;background:#98A1AF}
.dim .sc{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3)}.dim .sc .chip{white-space:nowrap}
.dim .sub{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px;font-size:12.5px;color:var(--ink2);display:grid;gap:2px}
.dim .sub div{display:flex;justify-content:space-between;gap:8px}
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:118px;height:118px;flex:none}.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px}.ring b small{font-size:11.5px;color:var(--ink3);font-weight:500}
.ins{display:grid;gap:8px}.ins div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.55;padding:8px 10px;border-radius:10px;background:#F7F9FB}
.ins .g{color:var(--ok)}.ins .r{color:var(--bad)}.ins b{color:var(--ink)}
table.t{border-collapse:collapse;width:100%;font-size:13px}.t th,.t td{padding:7px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}.t th{background:#F7F9FB;color:var(--ink2);font-weight:600;font-size:12px}.t .l{text-align:left}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}
svg text{font-family:inherit}
.gtip{position:fixed;z-index:100;background:#141B26;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
[data-tip]{cursor:help}
body.embed .logo,body.embed .ttl{display:none}body.embed main{padding-top:8px}
.empty{color:var(--ink3)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo" id="logo"></div><div class="ttl"><b>Performance สาขา</b><small>มุมมองรวมทุกมิติ · เทียบกลุ่มขนาดเดียวกัน</small></div>
  <div class="sp"></div>
  <select class="sel" id="selBr"></select><select class="sel" id="selM"></select>
</div></header>
<main id="app"></main>

<script>
'use strict';
/* =====================================================================
   Performance สาขา v1 · 2026-10-27
   มุมมองรวมทุกมิติของสาขา เทียบกับสาขากลุ่มขนาดเดียวกัน (S / M / L / XL)
   แหล่งข้อมูล
    · ยอดขาย  : API ระบบยอดขาย (NIMEX441) — MTD เดือนที่เลือก เทียบเดือนก่อนช่วงวันเดียวกัน
    · ต้นทุน  : ไฟล์ต้นทุนสาขา (COST_URL) — ยอดจริงรายเดือน ใช้เดือนล่าสุดที่ปิดแล้ว
    · กำลังคน / ชิ้นต่อคน / ตารางกะ : ระบบตารางกะ (หน้านี้ต้องเปิดจากระบบตารางกะ — parent.perfData)
    · To Do List : API To Do List — คะแนนส่งงานประจำวันเดือนนี้
   ลิงก์: ?br=150 · &ym=2026-10 · &embed=1 · &page=br (ล็อกสาขา)
   ===================================================================== */
const APP_VERSION='v1 · 2026-10-27';
const SALES_API='https://script.google.com/macros/s/AKfycbwHTMoMegT5M73nr9JQndleMm9CkPsqwaNwy8pqzztAOYXcysQ4JDeyARBqWjm9H-cqOw/exec';
const TODO_API='https://script.google.com/macros/s/AKfycbw5OexW0xsy7EJXJ4fiKpBma9fWVNqxGRzK2ac0j2c0OMRKWjEgkPfUj57TMVF5rnLI/exec';
const COST_URL='perf_cost.json';   // ไฟล์ต้นทุน (JSON) หรือหน้า Dashboard ต้นทุนสาขา (HTML ที่มี window.NIM_COST) บนโดเมนเดียวกัน
/* กลุ่มขนาดสาขา: แก้ที่ Google Sheet ระบบตารางกะ › ชีต M_Branch › คอลัมน์ size (S / M / L / XL) · SIZE_OVERRIDE ใช้ทดสอบเท่านั้น */
const SIZE_OVERRIDE={};

/* ประเภทต้นทุน (index บรรทัดในไฟล์ต้นทุน): v = ผันแปรตามยอดขาย · ที่ไม่อยู่ในรายการ = คงที่ · เงินเดือนค่าจ้าง = ค่าแรง (ตามคน-วันในตารางกะ) · ต้นทุนเข้ารับ = ผันแปร */
const VAR_LINES={2:'ค่าเดินทาง',4:'น้ำมันรถบริษัท',17:'วัสดุสิ้นเปลือง',19:'หมึกพิมพ์',20:'ม้วนกระดาษความร้อน',31:'เชื้อเพลิงโฟล์คลิฟ',37:'ทางด่วน',41:'ค่าธรรมเนียมธนาคาร',47:'ค่าจ้างแรงงานทั่วไป',49:'ค่าขนส่งทั่วไป',60:'สินค้าเสียหาย'};
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null||isNaN(n)?'–':Math.round(n).toLocaleString('en-US'),f1=n=>n==null||!isFinite(n)?'–':n.toFixed(1);
const fM=n=>n==null?'–':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+' ล้าน':fmt(n);
const sg=n=>n==null||!isFinite(n)?'–':(n>0?'+':'')+n.toFixed(1)+'%';
const IC={gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',coin:'<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
 check:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/>',bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 16v-4M11 16V8M15 16v-6M19 16V5"/>',target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',scatter:'<circle cx="7.5" cy="7.5" r=".5"/><circle cx="18.5" cy="5.5" r=".5"/><circle cx="11.5" cy="11.5" r=".5"/><circle cx="7.5" cy="16.5" r=".5"/><circle cx="17.5" cy="14.5" r=".5"/><path d="M3 3v16a2 2 0 0 0 2 2h16"/>',
 alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>'};
const ic=(k,s=16)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]||''}</svg>`;
const median=a=>{const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!v.length)return null;const h=v.length>>1;return v.length%2?v[h]:(v[h-1]+v[h])/2};
const pctl=(v,arr,low)=>{const a=arr.filter(x=>x!=null&&isFinite(x));if(v==null||!isFinite(v)||a.length<3)return null;const below=a.filter(x=>low?x>v:x<v).length,eq=a.filter(x=>x===v).length;return Math.round((below+eq/2)/a.length*100)};
const avg=a=>{const v=a.filter(x=>x!=null&&isFinite(x));return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):null};
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
const prevYm=ym=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const isoToday=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function jsonp(url,p){return new Promise((ok,no)=>{const cb='pf'+Date.now()+Math.floor(Math.random()*1e5),s=document.createElement('script');const t=setTimeout(()=>{delete window[cb];s.remove();no(new Error('timeout'))},45000);
  window[cb]=d=>{clearTimeout(t);delete window[cb];s.remove();d&&d.ok===false?no(new Error(d.error||'API error')):ok(d)};s.onerror=()=>{clearTimeout(t);delete window[cb];s.remove();no(new Error('เชื่อมต่อไม่ได้'))};
  s.src=url+'?'+new URLSearchParams({...p,callback:cb});document.head.appendChild(s)})}

/* ---------- state ---------- */
const QS=new URLSearchParams(location.search),EMBED=QS.get('embed')==='1',LOCK=QS.get('page')==='br'&&!!QS.get('br');
const S={basis:'avg3',br:QS.get('br')||'',ym:/^\d{4}-\d{2}$/.test(QS.get('ym')||'')?QS.get('ym'):isoToday().slice(0,7)};
const DT={cost:null,sales:null,roster:null,todo:null,err:{}};

/* ---------- โหลดข้อมูล ---------- */
async function loadCost(){const r=await fetch(COST_URL,{cache:'no-store'});const t=await r.text();
  if(/window\.NIM_COST\s*=/.test(t)){const a=t.indexOf('{',t.indexOf('window.NIM_COST')),e=t.indexOf('};',a)+1;return fromNimCost(JSON.parse(t.slice(a,e)))}
  return JSON.parse(t)}
/* แปลงข้อมูลจากหน้า Dashboard ต้นทุนสาขา (window.NIM_COST) */
function fromNimCost(D){const NA=D.flags.filter(f=>f==='ACT').length,R=D.rows,iTot=R.length-1,z=r=>Array.from({length:NA},(_,m)=>Math.round((r&&r[m])||0));
  return{months:NA,year:2026,lines:R.slice(2,iTot).map((r,i)=>[i+2,r.l]),br:D.br.filter(b=>(b.t==='DC'||b.t==='CDC')&&b.code).map(b=>{const L={};for(let i=2;i<iTot;i++){const v=z(b.v[i]);if(v.some(Boolean))L[i]=v}
    return{c:b.code,n:b.n,t:b.t,r:b.r,a:b.a||'',s:z(b.s),sal:z(b.v[0]),pu:z(b.v[1]),tot:z(b.v[iTot]),L}})}}
const KEEP=[1,2,4,5,6,7,8,11,14,17,18,21,24,27,33,35,36];   // ลำดับค่าที่ API ยอดขายส่งมา (ตรงกับ branch_sales.html)
async function loadSales(ym){const d=await jsonp(SALES_API,{action:'month',ym});const out={ym:d.ym,days:{}};
  Object.keys(d.days||{}).forEach(ds=>{const o=out.days[ds]={};d.days[ds].forEach(([c,t,csv])=>{const a=String(csv||'').split(','),v={};KEEP.forEach((k,i)=>v[k]=+a[i]||0);const x=o[c]||(o[c]={fr:0,cc:0,bill:0});x.fr+=v[8];x.cc+=v[36];x.bill+=v[7]})});
  out.excl=d.excl||[];return out}
async function loadTodo(ym){const today=isoToday(),last=ym===today.slice(0,7)?today:ym+'-'+String(daysIn(ym)).padStart(2,'0');
  const [b,o]=await Promise.all([jsonp(TODO_API,{action:'bootstrap'}),jsonp(TODO_API,{action:'overview',date:last,n:+last.slice(8)})]);return{boot:b,ov:o,last}}
async function loadRoster(ym){try{if(window.parent&&window.parent!==window&&typeof window.parent.perfData==='function')return await window.parent.perfData(ym)}catch(e){}return null}
async function loadAll(){
  $('app').innerHTML=`<div class="card" style="text-align:center;padding:40px">${ic('gauge',22)}<div style="margin-top:8px">กำลังรวบรวมข้อมูลทุกมิติ…</div><div class="q" style="font-size:12.5px">ยอดขาย · ต้นทุน · ตารางกะ · To Do List</div></div>`;
  const job=async(k,f)=>{try{DT[k]=await f();delete DT.err[k]}catch(e){DT[k]=null;DT.err[k]=e.message||String(e)}};
  await Promise.all([job('cost',loadCost),job('sales',()=>loadSales(S.ym)),job('roster',()=>loadRoster(S.ym)),job('todo',()=>loadTodo(S.ym))]);
  build();render()}

/* ---------- รวมตัวชี้วัดรายสาขา ---------- */
let BR=[];
function build(){
  const C=DT.cost,R=DT.roster,SL=DT.sales,ym=S.ym,ex=new Set((SL&&SL.excl)||['690','691']);
  /* รายชื่อ DC: จากตารางกะ (ไม่รวม Shop / หน่วยย่อย / ส่วนกลาง) · ไม่มีตารางกะ = จากไฟล์ต้นทุน */
  const rmap={};(R?R.rows:[]).forEach(r=>rmap[r.code]=r);
  let codes=R?R.rows.filter(r=>!/shop|unit/i.test(r.type)&&!r.central&&!ex.has(r.code)).map(r=>r.code):(C?C.br.filter(b=>b.t==='DC').map(b=>b.c):[]);
  const cmap={};(C?C.br:[]).forEach(b=>cmap[b.c]=b);
  /* เดือนต้นทุน = เดือนที่เลือก ถ้าปิดบัญชีแล้ว · ไม่งั้นเดือนล่าสุดที่มี */
  const mi=+ym.slice(5)-1,cm=C?(+ym.slice(0,4)===(C.year||2026)&&mi<C.months?mi:C.months-1):null;S.cm=cm;
  /* ยอดขาย MTD: 1..u ของเดือนนี้ · เดือนก่อน 1..min(u, วันของเดือนก่อน) */
  let u=0;if(SL)Object.keys(SL.days).forEach(d=>{if(d.startsWith(ym))u=Math.max(u,+d.slice(8))});S.u=u;
  const pv=prevYm(ym),pu=Math.min(u,daysIn(pv));let pHas=0;
  const sum=(m,a,b,c)=>{let fr=0,cc=0,bill=0;for(let d=a;d<=b;d++){const o=SL&&SL.days[m+'-'+String(d).padStart(2,'0')];if(o&&o[c]){fr+=o[c].fr;cc+=o[c].cc;bill+=o[c].bill}}return{fr,cc,bill}};
  if(SL)for(let d=1;d<=pu;d++)if(SL.days[pv+'-'+String(d).padStart(2,'0')])pHas++;S.pHas=pHas;
  /* To Do List score เดือนนี้ (เหมือนหน้า To Do: ภายในวัน 100 · เลยเวลา 80 · ย้อนหลัง 50 · ไม่ได้ทำ 0) */
  const TD=todoScores();
  BR=codes.map(c=>{const r=rmap[c]||{},cb=cmap[c],shops=R?R.rows.filter(x=>x.parent===c&&/shop/i.test(x.type)):[];
    const s=SL?sum(ym,1,u,c):null,ps=SL&&pHas?sum(pv,1,pu,c):null;
    const mdU=x=>(x.pd||[]).slice(0,u).reduce((a,v)=>a+(v||0),0),mdTo=u?mdU(r)+shops.reduce((a,x)=>a+mdU(x),0):0,emps=(r.emps||0)+shops.reduce((a,x)=>a+(x.emps||0),0);
    const cs=cb&&cm!=null?cb.s[cm]:null,cost=cb&&cm!=null?cb.sal[cm]+cb.pu[cm]+cb.tot[cm]:null,rent=cb&&cm!=null?((cb.L['14']||[])[cm]||0):null;

  /* ต้นทุนอ้างอิง (ของ DC + Shop ในสังกัด)
     · เดือนที่ปิดบัญชีแล้ว = ยอดจริงของเดือนนั้น
     · เดือนที่ยังไม่ปิด = เฉลี่ย 3 เดือนจริงล่าสุด (ค่าเริ่มต้น) หรือ งบประมาณของเดือนนั้น */
  const ents=[b.cb,...C.br.filter(x=>x.t==='Shop'&&(x.p===b.c||(!x.p&&String(x.c).slice(0,3)===b.c)))];
  const yr=C.year||2026,mi=+ym.slice(0,4)===yr?+ym.slice(5)-1:99,isAct=mi<C.months,pi=mi-(C.planFrom||C.months),hasPlan=!isAct&&pi>=0&&ents.some(x=>x.P&&x.P.sal&&x.P.sal[pi]);
  const mode=isAct?'act':(S.basis==='plan'&&hasPlan?'plan':'avg3');
  const ms=mode==='act'?[mi]:mode==='avg3'?[C.months-3,C.months-2,C.months-1].filter(m=>m>=0):[];
  let sal=0,pu=0,fix=0,vr=0,sAcc=0;const fixBy={},varBy={};
  const addL=(i,v)=>{if(VAR_LINES[i]){vr+=v;varBy[i]=(varBy[i]||0)+v}else{fix+=v;fixBy[i]=(fixBy[i]||0)+v}};
  ents.forEach(x=>{if(mode==='plan'){const P=x.P||{};sal+=(P.sal||[])[pi]||0;pu+=(P.pu||[])[pi]||0;sAcc+=(P.s||[])[pi]||0;Object.entries(P.L||{}).forEach(([i,a])=>addL(i,a[pi]||0));return}
    const k=ms.length||1;ms.forEach(m=>{sal+=x.sal[m]/k;pu+=x.pu[m]/k;sAcc+=x.s[m]/k;Object.entries(x.L).forEach(([i,a])=>addL(i,(a[m]||0)/k))})});

  const baseLb=mode==='act'?`ยอดจริงบัญชี ${TH_MON[mi]}`:mode==='plan'?`งบประมาณ ${TH_MON[mi]}`:`เฉลี่ยยอดจริง 3 เดือนล่าสุด (${ms.map(m=>TH_MON[m]).join(' ')})`;
  /* ค่าแรงต่อคน-วัน = เงินเดือนค่าจ้าง ÷ คน-วันในตารางกะของเดือนเดียวกัน (เฉลี่ยหลายเดือนถ้าใช้ 3 เดือน) */
  const rows=R?R.rows.filter(x=>x.code===b.c||(x.parent===b.c&&/shop/i.test(x.type))):[];
  const mdOfM=m=>rows.reduce((a,x)=>a+((x.mdM||{})[yr+'-'+String(m+1).padStart(2,'0')]||0),0);
  let cpm=null,mdRef=0;
  if(mode!=='plan'){const mm=ms.filter(m=>mdOfM(m)>0);if(mm.length){let ss=0;mm.forEach(m=>{ss+=ents.reduce((a,x)=>a+x.sal[m],0);mdRef+=mdOfM(m)});cpm=ss/mdRef}}
  if(cpm==null){/* งบ / ไม่มีตารางกะเดือนอ้างอิง: เงินเดือนของเดือน ÷ คน-วันที่คาดว่าจะใช้ทั้งเดือน (จากตารางกะเดือนนี้) */
    const mdAll=rows.reduce((a,x)=>a+(x.pd||[]).reduce((s2,v)=>s2+(v||0),0),0);if(mdAll){cpm=sal/mdAll;mdRef=mdAll}}
  const mdDay=d=>rows.reduce((a,x)=>a+((x.pd||[])[d-1]||0),0);
  const today=isoToday(),D=[];
  for(let d=1;d<=n;d++){const ds=ym+'-'+String(d).padStart(2,'0'),o=SL&&SL.days[ds]&&SL.days[ds][b.c],sale=o?o.fr:null,md=mdDay(d),lab=cpm!=null?cpm*md:sal/refDays,v=sale!=null?sale*varPct:null;
    D.push({d,ds,sale,md,lab,v,fx:fixDay,cost:lab+fixDay+(v||0),m:sale!=null?sale-(lab+fixDay+v):null,fut:ds>today})}
  const H=D.filter(x=>x.sale!=null),sum=k=>H.reduce((a,x)=>a+(x[k]||0),0),sS=sum('sale'),sL=sum('lab'),sV=sum('v'),sF=H.length*fixDay,sM=sS-sL-sV-sF;
  const wk=D.filter(x=>x.md>0&&!x.fut),avgLab=wk.length?wk.reduce((a,x)=>a+x.lab,0)/wk.length:sal/refDays,be=varPct<1?(fixDay+avgLab)/(1-varPct):null,loss=H.filter(x=>x.m<0).length;
  /* กราฟ */

  const mx=Math.max(1,...D.map(x=>Math.max(x.sale||0,x.cost)),be||0)*1.08,y=v=>pt+ih-v/mx*ih,st=mx/4;let g='';
  for(let i=0;i<=4;i++){const v=st*i;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#F2F4F7"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" fill="#98A1AF" text-anchor="end">${v>=1e6?(v/1e6).toFixed(1)+'M':Math.round(v/1e3)+'K'}</text>`}
  const kf=v=>Math.abs(v)>=1e6?(v/1e6).toFixed(1)+'M':Math.round(v/1e3)+'K';

    const tip=`${x.d} ${TH_MON[+ym.slice(5)-1]} · ยอดขาย ${x.sale==null?'ยังไม่มีไฟล์':fmt(x.sale)} · ต้นทุน ${fmt(x.cost)} (คงที่ ${fmt(x.fx)} · ค่าแรง ${fmt(x.lab)} [${fmt(x.md)} คน-วัน] · ผันแปร ${x.v==null?'–':fmt(x.v)})${x.m!=null?' · กำไร '+fmt(x.m):''}`;
    g+=`<rect x="${x0}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-tip="${tip}"/>`;
    if(x.sale!=null)g+=`<rect x="${x0+bw*.12}" y="${y(x.sale)}" width="${w}" height="${pt+ih-y(x.sale)}" rx="2" fill="#1F3A5F" pointer-events="none"/>`;
    let yy=pt+ih;[[x.fx,'#AFB8C4'],[x.lab,'#0E8C9A'],[x.v||0,'#E0A23B']].forEach(([v,c])=>{const h=v/mx*ih;yy-=h;g+=`<rect x="${x0+bw*.5}" y="${yy}" width="${w}" height="${h}" fill="${c}" opacity="${x.fut?.45:1}" pointer-events="none"/>`});
    if(x.m!=null)g+=`<text x="${x0+bw/2}" y="${Math.min(y(x.sale),y(x.cost))-5}" font-size="8.6" text-anchor="middle" font-weight="600" fill="${x.m>=0?'#1E8A5A':'#C0392B'}" pointer-events="none">${x.m>=0?'+':''}${kf(x.m)}</text>`;
    g+=`<text x="${x0+bw/2}" y="${Hh-pb+14}" font-size="10" text-anchor="middle" fill="${we?'#C0392B':'#98A1AF'}">${x.d}</text>`});
  if(be)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(be)}" y2="${y(be)}" stroke="#C0392B" stroke-dasharray="6 4" stroke-width="1.4"/><text x="${W-pr-4}" y="${y(be)-5}" font-size="10.5" text-anchor="end" fill="#C0392B" font-weight="600">จุดคุ้มทุน ${fmt(be)}/วัน</text>`;
  const kp=(l,v,sub,c)=>`<div><span>${l}</span><b class="num" style="${c?'color:'+c:''}">${v}</b><span>${sub||''}</span></div>`;
  const top=(o,lab)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([i,v])=>`${esc((C.lines.find(l=>l[0]==i)||[0,i])[1])} ${fmt(v)}`).join(' · ')||'–';
  return`<div class="card" style="margin-bottom:16px"><h3>${ic('chart',16)} ยอดขาย vs ต้นทุน รายวัน <span class="q">${TH_MON[+ym.slice(5)-1]} ${+ym.slice(0,4)+543} · DC + Shop ${ents.length-1} ร้าน</span><span class="sp" style="flex:1"></span>${isAct?`<span class="chip c-ok">ต้นทุนจริง ${TH_MON[mi]}</span>`:`<span class="seg" id="basisSeg" style="display:inline-flex;background:#F2F4F7;border-radius:10px;padding:3px;gap:2px">${[['avg3','เฉลี่ย 3 เดือนจริง'],['plan','งบประมาณ '+TH_MON[mi]]].map(([k,l])=>`<button data-b="${k}" ${k==='plan'&&!hasPlan?'disabled':''} style="border:0;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;background:${mode===k?'#fff':'none'};color:${mode===k?'var(--brand)':'var(--ink2)'};box-shadow:${mode===k?'0 1px 3px rgba(20,27,38,.12)':'none'}">${l}</button>`).join('')}</span>`}</h3>
   ${isAct?'':`<div class="q" style="font-size:12.5px;margin:-4px 0 10px">${ic('info',13)} บัญชี ${TH_MON[mi]} ยังไม่ปิด · ใช้${baseLb}เป็นฐานต้นทุน · ยอดขาย / คน-วัน เป็นตัวเลขจริงรายวัน · เมื่อบัญชีปิดแล้วระบบจะเปลี่ยนเป็นต้นทุนจริงเอง</div>`}
   <div class="prof" style="grid-template-columns:repeat(6,1fr);margin-bottom:12px">
    ${kp(`ยอดขาย ${H.length} วัน`,fM(sS),'AB+CC รวม Shop / DP')}${kp('ต้นทุนคงที่',fM(sF),fmt(fixDay)+'/วัน')}${kp('ค่าแรง',fM(sL),cpm!=null?fmt(cpm)+'/คน-วัน':'เฉลี่ยรายวัน')}${kp('ต้นทุนผันแปร',fM(sV),f1(varPct*100)+'% ของยอดขาย')}

    <div class="q" style="font-size:12.5px;line-height:1.8;margin-top:6px">

     • <b>จุดคุ้มทุนต่อวัน</b> = (คงที่/วัน + ค่าแรงเฉลี่ยวันทำงาน) ÷ (1 − ผันแปร%)<br>

     • ตัวเลขเป็นการประมาณเพื่อดูแนวโน้มรายวัน ตัวเลขจริงดูจากงบเมื่อปิดบัญชี</div></details></div>`}
function spark(b,G){const C=DT.cost,n=C.months,W=600,H=70,gm=[...Array(n).keys()].map(m=>median(G.filter(x=>x.cb&&x.cb.s[m]>0).map(x=>x.cb.s[m]))),mx=Math.max(...b.cb.s.slice(0,n),...gm.map(x=>x||0))*1.1||1,X=m=>10+m*(W-20)/Math.max(1,n-1),Y=v=>H-6-(v||0)/mx*(H-14);

  g+=`<line x1="${X(mx)}" x2="${X(mx)}" y1="${pt}" y2="${pt+ih}" stroke="#98A1AF" stroke-dasharray="3 3"/><line x1="${pl}" x2="${W-pr}" y1="${Y(my)}" y2="${Y(my)}" stroke="#98A1AF" stroke-dasharray="3 3"/>`;
  g+=`<text x="${pl+6}" y="${pt+14}" font-size="10.5" fill="#1E8A5A">ต้นทุนต่ำ · ยอดต่อคนสูง</text><text x="${W-pr-6}" y="${pt+ih-6}" font-size="10.5" fill="#C0392B" text-anchor="end">ต้นทุนสูง · ยอดต่อคนต่ำ</text>`;
  g+=`<text x="${pl+iw/2}" y="${H-6}" font-size="10.5" fill="#98A1AF" text-anchor="middle">ต้นทุน % ยอดขาย →</text><text x="12" y="${pt+ih/2}" font-size="10.5" fill="#98A1AF" text-anchor="middle" transform="rotate(-90 12 ${pt+ih/2})">ยอดขาย/คน-วัน →</text>`;
  P.forEach(p=>{const me=p.c===b.c;g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${me?7:4.5}" fill="${me?'#1F3A5F':'#AFC0D6'}" stroke="#fff" stroke-width="1.5" data-tip="${esc(p.c+' '+p.n)} · ต้นทุน ${f1(p.x)}% · ${fmt(p.y)} บาท/คน-วัน"/>`});
  const me=P.find(p=>p.c===b.c);if(me)g+=`<text x="${X(me.x)+10}" y="${Y(me.y)+4}" font-size="11.5" font-weight="700" fill="#1F3A5F">${esc(String(b.n).replace(/^DC\s*/,''))}</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="q" style="font-size:12px">จุดเข้ม = สาขานี้ · ชี้จุดเพื่อดูชื่อสาขา · เส้นประ = ค่ากลางกลุ่ม</div>`}
/* tooltip */
const TIP=document.createElement('div');TIP.className='gtip hidden';document.body.appendChild(TIP);
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){TIP.classList.add('hidden');return}TIP.textContent=el.getAttribute('data-tip');TIP.classList.remove('hidden');const w=TIP.offsetWidth;TIP.style.left=Math.max(6,Math.min(innerWidth-w-6,e.clientX-w/2))+'px';TIP.style.top=(e.clientY-TIP.offsetHeight-12)+'px'});
/* init */
if(EMBED)document.body.classList.add('embed');if(EMBED&&LOCK){const t=document.querySelector('.top');if(t)t.style.display='none'}
$('logo').innerHTML=ic('gauge',20);
function fillSel(){$('selBr').innerHTML=['XL','L','M','S'].map(z=>`<optgroup label="กลุ่ม ${z} · ${SZN[z]}">${BR.filter(b=>b.sz===z).sort((a,b)=>+a.c-+b.c).map(b=>`<option value="${b.c}" ${b.c===S.br?'selected':''}>${esc(b.c+' '+b.n)}</option>`).join('')}</optgroup>`).join('');
  $('selBr').classList.toggle('hidden',LOCK);
  const L=[];for(let k=0;k<6;k++){let ym=S.ym;for(let j=0;j<k;j++)ym=prevYm(ym);L.push(ym)}
  $('selM').innerHTML=L.map(ym=>`<option value="${ym}" ${ym===S.ym?'selected':''}>${TH_MON[+ym.slice(5)-1]} ${+ym.slice(0,4)+543}</option>`).join('');$('selM').classList.toggle('hidden',EMBED)}
$('selBr').onchange=e=>{S.br=e.target.value;render()};$('selM').onchange=e=>{S.ym=e.target.value;loadAll().then(fillSel)};
document.addEventListener('click',e=>{const x=e.target.closest&&e.target.closest('#basisSeg [data-b]');if(x&&!x.disabled){S.basis=x.dataset.b;render()}});
addEventListener('message',e=>{if(e.data==='perf:refresh')loadAll().then(fillSel)});
loadAll().then(fillSel).catch(e=>{$('app').innerHTML='<div class="card">'+esc(e.message)+'</div>'});
</script>
</body>
