<script>
'use strict';
/* =====================================================================
   Performance สาขา v1 · 2026-10-27
   มุมมองรวมทุกมิติของสาขา เทียบกับสาขากลุ่มขนาดเดียวกัน (S / M / L / XL)
   แหล่งข้อมูล
    · ยอดขาย  : API ระบบยอดขาย (NIMEX441) — MTD เดือนที่เลือก เทียบเดือนก่อนช่วงวันเดียวกัน
    · ค่าใช้จ่าย  : ไฟล์ค่าใช้จ่ายสาขา (COST_URL) — ยอดจริงรายเดือน ใช้เดือนล่าสุดที่ปิดแล้ว
    · กำลังคน / ชิ้นต่อคน / ตารางกะ : ระบบตารางกะ (หน้านี้ต้องเปิดจากระบบตารางกะ — parent.perfData)
    · To Do List : API To Do List — คะแนนส่งงานประจำวันเดือนนี้
   v4: ปรับหน้าตาหน้าสาขา (hero + คะแนน, การ์ด KPI พร้อมกราฟเล็ก, การ์ด 5 มิติ, หัวข้อแบ่งส่วน)
   v3: ใช้เกณฑ์ค่าใช้จ่ายสาขา % (ค่ากลางกลุ่ม) + ค่าใช้จ่ายต่อบิล แทนจุดคุ้มทุน · กราฟรายวัน/สะสม/รายเดือน/โดนัท/วันในสัปดาห์/ตำแหน่งในกลุ่ม
   v2: มุมมองอ่านง่ายสำหรับสาขา (ค่าเริ่มต้นเมื่อเปิดจากแท็บสาขา) · แถบรายเดือน · ปฏิทินรายวัน
   ลิงก์: ?br=150 · &ym=2026-10 · &embed=1 · &page=br (ล็อกสาขา)
   ===================================================================== */
const APP_VERSION='v6.7 · 2026-11-15';
const SALES_API='https://script.google.com/macros/s/AKfycbwHTMoMegT5M73nr9JQndleMm9CkPsqwaNwy8pqzztAOYXcysQ4JDeyARBqWjm9H-cqOw/exec';
const NC_API='https://script.google.com/macros/s/AKfycbyoCSXNhBLI7XLhVr4aG05dYhoa0ThSVT3yphMoDCUFsuYUFGdQ1-MpKETBxWVsPnkH4Q/exec';   // ระบบ NC (ncList) · รวมเอกสาร NC + หักเงินสินค้าเคลม
/* น้ำหนักคะแนน: อ่านจาก Google Sheet ระบบตารางกะ › ชีต M_PerfWeight (GET ?action=perfcfg) · โหลดไม่ได้ = ใช้ค่าตั้งต้นนี้ */
const ROSTER_API='https://script.google.com/macros/s/AKfycbwmm1cxLhewxKJte-chhualD7S_toTsbo7f2jAUDsj4H3yPstwvYYBwn9faiKhYsveJ/exec';
const W0={DC:[20,20,15,15,15,15],Shop:[30,30,20,20],DIS:[40,30,30]};let W=JSON.parse(JSON.stringify(W0)),W_SRC='ค่าตั้งต้น';
const WK={DC:['sa','cv','att','ppd','dis','bill'],Shop:['sa','cv','att','dis'],DIS:['td','ro','nc']};
const wavg=(a,w)=>{let s=0,t=0;a.forEach((v,i)=>{if(v!=null&&isFinite(v)&&w[i]>0){s+=v*w[i];t+=w[i]}});return t?Math.round(s/t):null};
const wPct=(k,i)=>{const a=W[k],t=a.reduce((x,y)=>x+(+y||0),0);return t?Math.round(a[i]/t*100):0};
const WN={DC:['ยอดขาย','ค่าใช้จ่าย','กำลังคน','ชิ้นต่อคน','วินัย','บิล'],Shop:['ยอดขาย','ค่าใช้จ่าย','กำลังคน','วินัย'],DIS:['To Do','ส่งตารางกะ','ปิด NC']},
  WC={DC:['#1F3A5F','#B45309','#0E8C9A','#2F6DB0','#1E8A5A','#6D28D9'],Shop:['#1F3A5F','#B45309','#0E8C9A','#1E8A5A'],DIS:['#1E8A5A','#7C5CC4','#C0392B']};
const wTip=k=>WN[k].map((n,i)=>n+' '+wPct(k,i)+'%').join(' · ');
const wChip=(k,i)=>`<span class="wt" title="น้ำหนักในคะแนนรวม${k==='DIS'?'ของมิติวินัย':''} · ${esc(W_SRC)}">${wPct(k,i)}%</span>`;
function wBar(k,lab){return`<div class="wb"><div class="wbh">${ic('scale',13)} ${lab||'น้ำหนักคะแนน'} <span class="q" title="${esc(W_SRC)}">${W_SRC==='ค่าตั้งต้น'?'ค่าตั้งต้น':'ตั้งค่าใน Sheet'}</span></div>
  <div class="wbar" title="${esc(wTip(k))}">${WN[k].map((n,i)=>wPct(k,i)?`<i style="width:${wPct(k,i)}%;background:${WC[k][i]}" title="${n} ${wPct(k,i)}%">${wPct(k,i)>=10?wPct(k,i):''}</i>`:'').join('')}</div>
  <div class="wbl">${WN[k].map((n,i)=>`<span><i style="background:${WC[k][i]}"></i>${n} <b>${wPct(k,i)}%</b></span>`).join('')}</div>
  ${k!=='DIS'?`<div class="wbs">วินัย = ${esc(wTip('DIS'))}</div>`:''}</div>`}
async function loadCfg(){const d=await jsonp(ROSTER_API,{action:'perfcfg'});if(!d||!d.w)throw new Error('ไม่มีข้อมูลน้ำหนัก');
  ['DC','Shop','DIS'].forEach(k=>{const o=d.w[k];if(o)W[k]=WK[k].map((x,i)=>o[x]!=null&&o[x]!==''&&isFinite(+o[x])?Math.max(0,+o[x]):W0[k][i])});W_SRC=d.src||'Google Sheet · M_PerfWeight';return d}

     · เดือนที่ยังไม่ปิด = เฉลี่ย 3 เดือนจริงล่าสุด (ค่าเริ่มต้น) หรือ งบประมาณของเดือนนั้น */

/* กราฟ 3: ค่าใช้จ่ายสาขา % สะสม เทียบเกณฑ์ */

function spark(b,G){const C=DT.cost,n=C.months,W=600,H=70,gm=[...Array(n).keys()].map(m=>median(G.filter(x=>x.cb&&x.cb.s[m]>0).map(x=>x.cb.s[m]))),mx=Math.max(...b.cb.s.slice(0,n),...gm.map(x=>x||0))*1.1||1,X=m=>10+m*(W-20)/Math.max(1,n-1),Y=v=>H-6-(v||0)/mx*(H-14);
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><polyline points="${gm.map((v,m)=>X(m)+','+Y(v)).join(' ')}" fill="none" stroke="#98A1AF" stroke-dasharray="4 3"/><polyline points="${b.cb.s.slice(0,n).map((v,m)=>X(m)+','+Y(v)).join(' ')}" fill="none" stroke="#1F3A5F" stroke-width="2.5"/>${b.cb.s.slice(0,n).map((v,m)=>`<circle cx="${X(m)}" cy="${Y(v)}" r="${m===S.cm?5:3}" fill="${m===S.cm?'#1F3A5F':'#fff'}" stroke="#1F3A5F" stroke-width="2" data-tip="${TH_MON[m]} · ${fmt(v)} บาท · กลุ่ม ${fmt(gm[m])}"/>`).join('')}</svg>`}
function ring(v){const r=50,c=2*Math.PI*r,p=(v||0)/100,col=v==null?'#98A1AF':v>=70?'#1E8A5A':v>=30?'#D97706':'#C0392B';
  return`<div class="ring"><svg viewBox="0 0 118 118" width="118" height="118"><circle cx="59" cy="59" r="${r}" fill="none" stroke="#F2F4F7" stroke-width="12"/><circle cx="59" cy="59" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 59 59)"/></svg><b style="color:${col}">${v==null?'–':v}<small>/ 100</small></b></div>`}
function radar(DIM){const W=380,H=190,cx=W/2,cy=H/2+4,R=70,n=DIM.length,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
  let g='';[25,50,75,100].forEach(l=>g+=`<polygon points="${DIM.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="${l===50?'#98A1AF':'#E7EAEF'}" ${l===50?'stroke-dasharray="3 3"':''}/>`);
  DIM.forEach((d,i)=>{const [x,y]=pt(i,122);g+=`<line x1="${cx}" y1="${cy}" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="#F2F4F7"/><text x="${x}" y="${y+4}" font-size="11" text-anchor="middle" fill="#5A6577">${d.t.split(' · ')[0]}</text>`});
  g+=`<polygon points="${DIM.map((d,i)=>pt(i,d.sc??50).join(',')).join(' ')}" fill="rgba(31,58,95,.16)" stroke="#1F3A5F" stroke-width="2"/>`;
  DIM.forEach((d,i)=>{const [x,y]=pt(i,d.sc??50);g+=`<circle cx="${x}" cy="${y}" r="4" fill="${d.sc==null?'#fff':d.c}" stroke="${d.c}" stroke-width="1.5" data-tip="${d.t}: ${d.sc==null?'ไม่มีข้อมูล':d.sc+' / 100'}"/>`});
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;height:auto">${g}</svg>`}
function trend(b,G){const C=DT.cost,n=C.months,W=640,H=230,pl=48,pr=44,pt=16,pb=30,iw=W-pl-pr,ih=H-pt-pb,bw=iw/n,cost=(x,m)=>(OP_ONLY?0:x.cb.sal[m]+x.cb.pu[m])+x.cb.tot[m];
  const mx=Math.max(...b.cb.s.slice(0,n))*1.15||1,cps=[...Array(n).keys()].map(m=>b.cb.s[m]?cost(b,m)/b.cb.s[m]*100:null),gms=[...Array(n).keys()].map(m=>median(G.filter(x=>x.cb&&x.cb.s[m]>0).map(x=>cost(x,m)/x.cb.s[m]*100)));
  const cmx=Math.max(...cps.filter(x=>x!=null),...gms.filter(x=>x!=null),1)*1.2,y=v=>pt+ih-v/mx*ih,y2=v=>pt+ih-v/cmx*ih;let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#F2F4F7"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" fill="#98A1AF" text-anchor="end">${v>=1e6?(v/1e6).toFixed(1)+'M':Math.round(v/1e3)+'K'}</text><text x="${W-pr+6}" y="${y2(cmx*i/4)+4}" font-size="10" fill="#B45309">${Math.round(cmx*i/4)}%</text>`}
  [...Array(n).keys()].forEach(m=>{const x=pl+m*bw+bw*.2,w=bw*.6,s=b.cb.s[m];g+=`<rect x="${x}" y="${y(s)}" width="${w}" height="${pt+ih-y(s)}" rx="3" fill="${m===S.cm?'#1F3A5F':'#AFC0D6'}" data-tip="${TH_MON[m]} · ยอดขาย ${fmt(s)} · ค่าใช้จ่าย ${fmt(cost(b,m))} (${f1(cps[m])}%) · กลุ่ม ${f1(gms[m])}%"/><text x="${x+w/2}" y="${y(s)-4}" font-size="9.5" text-anchor="middle" fill="#5A6577">${s>=1e6?(s/1e6).toFixed(1)+'M':Math.round(s/1e3)+'K'}</text><text x="${x+w/2}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="${m===S.cm?'#141B26':'#98A1AF'}" font-weight="${m===S.cm?700:400}">${TH_MON[m]}</text>`});
  const line=(arr,c,d)=>{const p=arr.map((v,m)=>v==null?null:[pl+m*bw+bw/2,y2(v)]).filter(Boolean);return`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2" ${d?'stroke-dasharray="5 4"':''}/>`+p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="${d?2:3}" fill="${c}"/>`).join('')};
  g+=line(gms,'#98A1AF',1)+line(cps,'#B45309');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="lg"><span><i style="background:#AFC0D6"></i>ยอดขาย (บัญชี)</span><span><i style="background:#B45309;height:3px"></i>ค่าใช้จ่าย % ยอดขาย</span><span><i style="background:#98A1AF;height:2px"></i>ค่ากลางกลุ่ม</span></div>`}
function scatter(b,G){const W=420,H=300,pl=50,pr=12,pt=14,pb=36,iw=W-pl-pr,ih=H-pt-pb;
  const P=G.map(x=>({x:x.cp,y:x.spp,c:x.c,n:x.n})).filter(p=>p.x!=null&&p.y!=null);if(P.length<3)return'<div class="q" style="padding:30px 0;text-align:center">ข้อมูลยังไม่พอสำหรับเทียบ (ต้องมีทั้งค่าใช้จ่ายและยอดขายต่อคน)</div>';
  const xs=P.map(p=>p.x),ys=P.map(p=>p.y),x0=Math.min(...xs)*.9,x1=Math.max(...xs)*1.05,y0=Math.min(...ys)*.85,y1=Math.max(...ys)*1.1,X=v=>pl+(v-x0)/(x1-x0)*iw,Y=v=>pt+ih-(v-y0)/(y1-y0)*ih;
  const mx=median(xs),my=median(ys);let g=`<rect x="${pl}" y="${pt}" width="${X(mx)-pl}" height="${Y(my)-pt}" fill="#E3F4EA" opacity=".55"/><rect x="${X(mx)}" y="${Y(my)}" width="${W-pr-X(mx)}" height="${pt+ih-Y(my)}" fill="#FBE3E0" opacity=".55"/>`;
  g+=`<line x1="${X(mx)}" x2="${X(mx)}" y1="${pt}" y2="${pt+ih}" stroke="#98A1AF" stroke-dasharray="3 3"/><line x1="${pl}" x2="${W-pr}" y1="${Y(my)}" y2="${Y(my)}" stroke="#98A1AF" stroke-dasharray="3 3"/>`;
  g+=`<text x="${pl+6}" y="${pt+14}" font-size="10.5" fill="#1E8A5A">ค่าใช้จ่ายต่ำ · ยอดต่อคนสูง</text><text x="${W-pr-6}" y="${pt+ih-6}" font-size="10.5" fill="#C0392B" text-anchor="end">ค่าใช้จ่ายสูง · ยอดต่อคนต่ำ</text>`;
  g+=`<text x="${pl+iw/2}" y="${H-6}" font-size="10.5" fill="#98A1AF" text-anchor="middle">ค่าใช้จ่าย % ยอดขาย →</text><text x="12" y="${pt+ih/2}" font-size="10.5" fill="#98A1AF" text-anchor="middle" transform="rotate(-90 12 ${pt+ih/2})">ยอดขาย/คน-วัน →</text>`;
  P.forEach(p=>{const me=p.c===b.c;g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${me?7:4.5}" fill="${me?'#1F3A5F':'#AFC0D6'}" stroke="#fff" stroke-width="1.5" data-tip="${esc(p.c+' '+p.n)} · ค่าใช้จ่าย ${f1(p.x)}% · ${fmt(p.y)} บาท/คน-วัน"/>`});
  const me=P.find(p=>p.c===b.c);if(me)g+=`<text x="${X(me.x)+10}" y="${Y(me.y)+4}" font-size="11.5" font-weight="700" fill="#1F3A5F">${esc(String(b.n).replace(/^DC\s*/,''))}</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="q" style="font-size:12px">จุดเข้ม = สาขานี้ · ชี้จุดเพื่อดูชื่อสาขา · เส้นประ = ค่ากลางกลุ่ม</div>`}
/* tooltip */
const TIP=document.createElement('div');TIP.className='gtip hidden';document.body.appendChild(TIP);
document.addEventListener('mousemove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){TIP.classList.add('hidden');return}TIP.textContent=el.getAttribute('data-tip');TIP.classList.remove('hidden');const w=TIP.offsetWidth;TIP.style.left=Math.max(6,Math.min(innerWidth-w-6,e.clientX-w/2))+'px';TIP.style.top=(e.clientY-TIP.offsetHeight-12)+'px'});
/* init */
if(EMBED)document.body.classList.add('embed');if(EMBED&&LOCK){const t=document.querySelector('.top');if(t)t.style.display='none'}
$('logo').innerHTML=ic('gauge',20);
function fillSel(){$('selBr').innerHTML=(NETP?`<option value="" ${!S.br?'selected':''}>ภาพรวมทั่วประเทศ</option>`:'')+['XL','L','M','S','N'].filter(z=>BR.some(b=>b.sz===z)).map(z=>`<optgroup label="กลุ่ม ${z} · ${SZN[z]}">${BR.filter(b=>b.sz===z).sort((a,b)=>+a.c-+b.c).map(b=>`<option value="${b.c}" ${b.c===S.br?'selected':''}>${esc(b.c+' '+b.n)}</option>`).join('')}</optgroup>`).join('')+(SH.length?`<optgroup label="Shop (${SH.length})">${SH.slice().sort((a,b)=>a.n.localeCompare(b.n,'th')).map(x=>`<option value="${x.c}" ${x.c===S.br?'selected':''}>${esc(x.n)}</option>`).join('')}</optgroup>`:'');
  $('selBr').classList.toggle('hidden',LOCK);
  const L=[];for(let k=0;k<6;k++){let ym=S.ym;for(let j=0;j<k;j++)ym=prevYm(ym);L.push(ym)}
  $('selM').innerHTML=L.map(ym=>`<option value="${ym}" ${ym===S.ym?'selected':''}>${TH_MON[+ym.slice(5)-1]} ${+ym.slice(0,4)+543}</option>`).join('');$('selM').classList.toggle('hidden',EMBED)}
$('selBr').onchange=e=>{S.br=e.target.value;if(NETP)S.view='simple';render();scrollTo(0,0)};$('selM').onchange=e=>{S.ym=e.target.value;loadAll().then(fillSel)};
document.addEventListener('click',e=>{const t=e.target.closest?e.target:null;if(!t)return;const gd=t.closest('.dim[data-go],.sgo[data-go],.bd[data-go]');if(gd&&!t.closest('[data-tip]')){try{parent.postMessage({type:'perf:go',tab:gd.dataset.go},'*')}catch(er){}return}const x=t.closest('#basisSeg [data-b]');if(x&&!x.disabled){S.basis=x.dataset.b;render();return}
  const nb2=t.closest('[data-netbr]');if(nb2){S.br=nb2.dataset.netbr;S.view='simple';fillSel();render();scrollTo(0,0);return}
  if(t.closest('[data-netback]')){S.br='';S.view='';fillSel();render();scrollTo(0,0);return}
  const ns=t.closest('[data-ns]');if(ns){const k=ns.dataset.ns;if(NS.sort===k)NS.dir*=-1;else{NS.sort=k;NS.dir=k==='n'?1:-1}renderNet();return}
  const nf=t.closest('[data-nf]');if(nf){NS[nf.dataset.nf]=nf.dataset.v;if(nf.dataset.nf==='rk'){NS.sort='tot';NS.dir=-1}renderNet();return}
  const gb=t.closest('[data-gobr]');if(gb){S.br=gb.dataset.gobr;render();scrollTo(0,0);return}
  const w=t.closest('[data-sw]');if(w){S.view=w.dataset.sw;render();scrollTo(0,0);return}
  const j=t.closest('[data-jump]');if(j){const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const v=t.closest('[data-dv]');if(v){S.dv=v.dataset.dv;render();return}
  const d=t.closest('[data-ds]');if(d&&!d.disabled){const y0=scrollY;S.selDay=d.dataset.ds;render();scrollTo(0,y0);return}
  const m=t.closest('[data-ym]');if(m&&m.dataset.ym!==S.ym){S.ym=m.dataset.ym;S.selDay='';loadAll().then(fillSel)}});
addEventListener('message',e=>{if(e.data==='perf:refresh')loadAll().then(fillSel)});
loadAll().then(fillSel).catch(e=>{$('app').innerHTML='<div class="card">'+esc(e.message)+'</div>'});
</script>
