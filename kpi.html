<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KPI แผนกคลังสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--soft:#f3f4f6;--brand:#0b5cad;
--gA:#15803d;--gB:#1d6fd1;--gC:#b7791f;--gD:#d9480f;--gF:#c92a2a;--gN:#9ca3af}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans Thai','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:1680px;margin:0 auto;padding:14px 16px 6px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid var(--brand)}
h1{margin:0;font-size:24px;font-weight:700;color:var(--brand);letter-spacing:-.2px}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,button{font:inherit;color:inherit}
select{padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-weight:600}
.btn{padding:7px 14px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.quiet{background:#fff;border-color:#cbd5e1;color:var(--mut);font-weight:500;padding:6px 12px;font-size:13px}
.btn.quiet:hover{border-color:var(--brand);color:var(--brand)}
.menu{position:relative}
.mpop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.10);min-width:210px;padding:4px;z-index:30}
.mpop[hidden]{display:none}
.mpop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13.5px}
.mpop button:hover{background:var(--soft)}
#crumb{display:flex;align-items:center;gap:10px;margin:10px 0 4px;min-height:0}
#crumb:empty{display:none}
#crumb .linkbtn{border:1px solid #cbd5e1;background:#fff;color:var(--mut);border-radius:7px;padding:3px 10px;font-size:12.5px;cursor:pointer}
#crumb .linkbtn:hover{color:var(--brand);border-color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
.icb{display:inline-flex;align-items:center;gap:6px}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:4px;margin:14px 0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:10px 16px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
.hero{display:grid;grid-template-columns:minmax(240px,1.1fr) 3fr;gap:16px;margin-bottom:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.big{font-size:56px;font-weight:700;line-height:1;color:var(--brand);letter-spacing:-1px}
.big small{font-size:18px;color:var(--mut);font-weight:500;letter-spacing:0}
.lbl{font-size:12.5px;color:var(--mut);font-weight:500}
.bar{height:8px;background:var(--soft);border-radius:4px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.u .nm{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.u .nm span{font-size:11.5px;color:var(--mut);font-weight:500}
.u .sc{font-size:34px;font-weight:700;margin:6px 0 4px;line-height:1.1}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.gc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;letter-spacing:0}
.gA{background:var(--gA)}.gB{background:var(--gB)}.gC{background:var(--gC)}.gD{background:var(--gD)}.gF{background:var(--gF)}.gN{background:var(--gN)}
.sec{font-size:15px;font-weight:700;margin:22px 0 8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--brand);color:#fff;font-weight:600;font-size:12.5px}
td.l,th.l{text-align:left;white-space:normal}
tr.g1 td{background:#eef4fb;font-weight:700;color:var(--brand)}
tr.g2 td{background:var(--soft);font-weight:700}
td.v{font-variant-numeric:tabular-nums}
.thr{color:var(--mut);font-size:12px}
tr:last-child td{border-bottom:0}
.note{font-size:12.5px;color:var(--mut);margin:8px 2px}
.warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13px}
.err{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
/* กริดกรอก */
.grid{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.grid table{width:auto;min-width:100%}
.grid th,.grid td{padding:0;border:1px solid var(--line)}
.grid th{position:sticky;top:0;z-index:2;padding:4px 2px;min-width:78px;background:var(--brand)}
.grid th.we{background:#334155}
.grid td.rl,.grid th.rl{position:sticky;left:0;z-index:3;min-width:210px;max-width:210px;background:#fff;text-align:left;padding:6px 10px;white-space:normal;font-size:12.5px;font-weight:600;box-shadow:1px 0 0 var(--line)}
.grid th.rl{background:var(--brand);z-index:4}
.grid td.rl small{display:block;color:var(--mut);font-weight:400}
.grid input{width:100%;min-width:78px;border:0;padding:7px 5px;text-align:right;background:transparent;font-variant-numeric:tabular-nums;outline:none}
.grid input:focus{outline:2px solid var(--brand);outline-offset:-2px;background:#fff}
.grid td.we input{background:#f8fafc}
.grid td.bad input{outline:2px solid var(--gF);outline-offset:-2px;color:var(--gF)}
.grid td.tot{min-width:84px;text-align:right;padding:0 8px;font-weight:700;background:var(--soft);font-variant-numeric:tabular-nums}
.grid tr.secr td.rl{background:var(--soft);font-weight:700}
.bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.bar2 input[type=password]{padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;width:150px}
.ok{color:var(--gA);font-weight:600}.ko{color:var(--gF);font-weight:600}
.form td.in input{width:130px;padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;text-align:right;font-variant-numeric:tabular-nums}
.form td.in input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:50}
.spin{display:none;color:var(--mut)}

.subnav{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.subnav button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 16px;font-weight:600;color:var(--ink);cursor:pointer}
.subnav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.card.tight{padding:6px 10px}.card.tight td{padding:6px 8px}
.hero{grid-template-columns:minmax(260px,1fr) 3fr;margin-bottom:12px}
.u .sc{font-size:30px}

.wrap{min-height:100vh;display:flex;flex-direction:column}
#view{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:14px}
.ring{flex:none}
.ovroot,.uroot{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.hero2{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:14px}
.heroc{display:flex;gap:18px;align-items:center}
.hinfo{flex:1;min-width:0}.hinfo .mo{font-size:22px;font-weight:700;line-height:1.2}
.dl{font-weight:700;font-size:15px;margin-top:2px}
.uc{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.uc:hover{border-color:var(--brand)}
.ucr{display:flex;gap:14px;align-items:center}.uci{min-width:0;flex:1}
.uci .nm{font-weight:700;font-size:15px}
.ucs{display:flex;flex-direction:column;gap:2px}
.gboxes{display:flex;gap:6px;margin-top:8px}
.gbx{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:34px}
.gbx b{font-size:22px;line-height:1}.gbx span{color:#fff;font-size:12px;font-weight:800;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.gbx.z b{color:#9ca3af!important}.gbx.z span{background:#d1d5db!important}
.gbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#e5e7eb;margin-top:8px;gap:2px}.gbar i{display:block}
.ov{flex:1;display:grid;grid-template-columns:1.5fr 1fr;gap:14px;min-height:300px}
.fillc{display:flex;flex-direction:column;min-height:0}
.trendbox{flex:1;min-height:220px;position:relative;overflow:hidden}
.trendbox svg{position:absolute;left:0;top:0;display:block}
.rcol .fillc{flex:1}
.rcol{display:flex;flex-direction:column;gap:14px;min-height:0}
.wlist{flex:1;overflow:auto;min-height:60px}.wlist td{padding:7px 8px}
.utop{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.uinfo{min-width:260px}
.thbtn{margin-left:6px;border:1px solid rgba(255,255,255,.35);background:transparent;color:rgba(255,255,255,.9);border-radius:5px;padding:0 6px;font:inherit;font-size:11px;font-weight:500;cursor:pointer;line-height:1.6}.thbtn:hover{background:rgba(255,255,255,.18);color:#fff}
.utable{flex:1}
.utable th.l,.utable td.l{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line);min-width:300px}
.utable th.l{background:var(--brand);z-index:2}
.utable tr.g1 td.l{background:#eef4fb}
.utable td{padding-top:clamp(7px,1.5vh,15px);padding-bottom:clamp(7px,1.5vh,15px)}
.utable td.big{font-size:15px;font-weight:600}

@media(max-height:840px) and (min-width:821px){
 header{padding-bottom:8px}nav{margin:6px 0 8px}nav button{padding:7px 14px}.subnav{margin-bottom:8px}
 .ovroot,.uroot{gap:10px}.hero2,.ov{gap:10px}.card{padding:12px}
 .heroc .ring{width:104px;height:104px}.uc .ring{width:68px;height:68px}.utop .ring{width:84px;height:84px}
 .hinfo .mo{font-size:18px}.gbx b{font-size:17px}.gboxes{margin-top:4px}.gbar{margin-top:4px}
 .trendbox{min-height:150px}.ov{min-height:200px}.ucs svg{height:46px}
 .utable td{padding-top:6px;padding-bottom:6px}
}
@media(max-width:820px){ .utable th.l,.utable td.l{position:static;min-width:150px;box-shadow:none} .hero2{grid-template-columns:1fr} .heroc{flex-wrap:wrap} .ov{grid-template-columns:1fr}.wrap{min-height:0}
 .hero{grid-template-columns:1fr}.units{grid-template-columns:1fr}
 .big{font-size:46px}h1{font-size:20px}
 .hm{display:none}
 .form th,.form td{padding:6px 5px;font-size:12.5px}
 .form td.in input{width:84px;padding:6px 7px}
 .grid td.rl,.grid th.rl{min-width:140px;max-width:140px;font-size:11.5px}
}
.entrybar{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;font-weight:600;padding:6px 14px;border-radius:8px;font-size:13.5px}
.entrybar b{font-size:15px;background:#fff;color:var(--brand);padding:1px 8px;border-radius:5px;margin:0 2px}
.entrybar.off{background:#c92a2a}.entrybar.off b{color:#c92a2a}
.ubadge{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:15px;color:#fff;padding:6px 14px;border-radius:8px;background:var(--brand)}
body[data-u=AB]{--brand:#b45309}
body[data-u=CC]{--brand:#0e7490}
body[data-u=AB] .entrybar:not(.off),body[data-u=CC] .entrybar:not(.off){background:#fff;color:var(--ink);border:2px solid var(--brand)}
body[data-u=AB] .entrybar:not(.off) b,body[data-u=CC] .entrybar:not(.off) b{background:var(--brand);color:#fff}
.cp{font-size:12.5px;text-align:right;padding:0 8px;white-space:nowrap}
.calc .rl small{display:block}
.tools{margin-left:auto;display:flex;gap:6px}
.gate{max-width:360px;margin:60px auto;text-align:center;border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.gate .gic svg{width:34px;height:34px;color:var(--brand);stroke-width:1.7}.gate .gt{font-size:18px;font-weight:700;margin:6px 0 2px}
.gate input{width:160px;text-align:center}
.emb header>div:first-child{display:none}.emb header{justify-content:flex-end;border-bottom:0;padding-bottom:6px}
/* โหมดฝังในระบบใหญ่: ใช้พื้นที่ให้เต็ม ไม่ต้องเลื่อน */
.emb .wrap{padding:6px 10px 4px;max-width:none}
.emb .subnav{margin-bottom:8px}.emb .ovroot,.emb .uroot{gap:8px}.emb .note{margin:4px 2px}
.emb .utop{padding:8px 14px;gap:16px}.emb .utop svg.ring{width:70px;height:70px}
.emb .utable th{padding:5px 8px;line-height:1.25}.emb .utable td{padding-top:4px;padding-bottom:4px}
.emb .card{padding:10px}
@media(min-width:1180px){
 .emb .wrap{position:relative}
 .emb header{position:absolute;right:10px;top:6px;padding:0;z-index:6}
 .emb .subnav,.emb #crumb{padding-right:470px;min-height:38px}
}

.grid td.xsel{background:#dbeafe!important}.grid td.xsel input,.grid td.xsel.we input{background:transparent!important}
.xlbox{position:absolute;border:2px solid #2563eb;pointer-events:none;z-index:6;box-sizing:border-box}
.xlbox.xlfilling{border-style:dashed}
.xlfill{position:absolute;right:-5px;bottom:-5px;width:9px;height:9px;background:#2563eb;border:1px solid #fff;cursor:crosshair;pointer-events:auto}
.xldrag,.xldrag input{user-select:none;-webkit-user-select:none;cursor:cell}
.grid input::selection{background:#bfdbfe}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div><h1>KPI แผนกคลังสินค้า</h1><div class="sub" id="sub">กำลังโหลด…</div></div>
  <div class="ctl">
   <span class="spin" id="spin">กำลังโหลด…</span>
   <select id="month" aria-label="เดือน"></select>
   <div class="menu"><button class="btn quiet icb" id="entryBtn" aria-haspopup="true" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>กรอกข้อมูล<svg class="ic" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="mpop" id="entryMenu" hidden>
     <button data-t="LP">คลังลำพูน (รายวัน)</button>
     <button data-t="AB">คลังบางนา แห้ง (AB)</button>
     <button data-t="CC">คลังบางนา เย็น (CC)</button>
     <button data-t="CS">แผนกบริการลูกค้า (รายเดือน)</button>
     <button data-t="AD">แผนกธุรการสาขา (รายเดือน)</button>
    </div></div>
   <button class="btn quiet icb" id="reload"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>รีเฟรช</button>
  </div>
 </header>
 <div id="crumb"></div>
 <div id="msg"></div>
 <main id="view"></main>
</div>
<div id="toast"></div>

<script>
/* ===== ตั้งค่า ===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxWW6u7XSQOWmIaj5XnTNn8sAhkh7S--sO5uRpMDk8_6YE4qFvUK0Sj2pjF7kCO72KE/exec';   // URL /exec ของ Code_kpi
const APP_VERSION = 'v1.3 · 2026-11-01';
const QS=new URLSearchParams(location.search); if(QS.get('embed')==='1') document.documentElement.classList.add('emb'), document.body&&document.body.classList.add('emb');
addEventListener('message',e=>{ if(e.data==='kpi:refresh'&&typeof load==='function') load(true); });
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const UNIT_NAME = {LP:'ส่วนงานคลังลำพูน',BN:'ส่วนงานคลังบางนา',AB:'คลังบางนา แห้ง (AB)',CC:'คลังบางนา เย็น (CC)'};
const UNIT_FULL = {LP:'คลังลำพูน',AB:'บางนา แห้ง (AB)',CC:'บางนา เย็น (CC)',CS:'บริการลูกค้า',AD1:'ธุรการ · ด้านต้นทุน',AD2:'ธุรการ · ด้านประสิทธิภาพ',AD:'ธุรการสาขา'};
const S = {data:null, month:null, tab:'sum', sub:'ov', hist:false, lp:null, lpDirty:false, key:''};
S.keys={lp:'',bn:'',cs:'',ad:''};
try{ S.keys.lp=localStorage.getItem('kpi_key_lp')||localStorage.getItem('kpi_key')||''; S.keys.bn=localStorage.getItem('kpi_key_bn')||''; S.keys.cs=localStorage.getItem('kpi_key_cs')||''; S.keys.ad=localStorage.getItem('kpi_key_ad')||''; }catch(e){}

/* ===== helpers ===== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const monLabel = m=>{ const [y,mo]=m.split('-'); return TH_MON[+mo-1]+' '+y; };
const dim = m=>{ const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); };
const trim = x=>String(+(+x).toFixed(4));
function toast(t,ms=2400){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',ms); }
function ic(p){ return `<svg class="ic" viewBox="0 0 24 24">${p}</svg>`; }
const IC={lock:'<rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 down:'<path d="m6 9 6 6 6-6"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',
 swap:'<path d="M17 4l4 4-4 4"/><path d="M3 8h18"/><path d="M7 20l-4-4 4-4"/><path d="M21 16H3"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 snow:'<path d="M12 2v20M4.2 7l15.6 10M19.8 7 4.2 17"/><path d="m9.5 3.5 2.5 2 2.5-2M9.5 20.5l2.5-2 2.5 2"/>',
 warn:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 dl:'<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 ok:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',no:'<path d="M6 6l12 12M18 6 6 18"/>',
 up:'<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',dn:'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',dot:'<circle cx="12" cy="12" r="2"/>'};
const I=k=>ic(IC[k]);
IC.save='<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>';
function pctS(p,dec){ /* p เป็นหน่วย % · ตัดเลข 0 ท้ายทิ้ง · ไม่ปัดขึ้นเป็น 100 / ไม่ปัดลงเป็น 0 ถ้าค่าจริงยังไม่ถึง */
  let s=p.toFixed(dec);
  if(+s===100&&p<100-1e-9){ for(let d=dec+1;d<=6;d++){ s=p.toFixed(d); if(+s<100)break; } if(+s>=100)s=(Math.floor(p*1e6)/1e6).toFixed(6); }
  else if(+s===0&&p>1e-9){ for(let d=dec+1;d<=6;d++){ s=p.toFixed(d); if(+s>0)break; } }
  return s.indexOf('.')<0?s:s.replace(/0+$/,'').replace(/\.$/,''); }
function fv(c,v){ if(v==null) return '–'; return c.fmt==='cnt' ? String(Math.round(v)) : pctS(v*100,c.dec)+'%'; }
function thr(c,k){ const x=c[k]; return c.fmt==='cnt' ? String(x) : trim(x*100)+'%'; }
function gradeOf(c,v){
  if(v==null||v==='') return null;
  if(c.dir==='hi'){ if(v>=c.A)return 'A'; if(v>=c.B)return 'B'; if(v>=c.C)return 'C'; if(v>=c.D)return 'D'; return 'F'; }
  if(v<=c.A)return 'A'; if(v<=c.B)return 'B'; if(v<=c.C)return 'C'; if(v<=c.D)return 'D'; return 'F';
}
const gb = g=>`<span class="gc g${g||'N'}">${g||'–'}</span>`;
const sc2 = s=>s==null?'–':s.toFixed(2);

/* ===== API (JSONP) ===== */
let seq=0;
function api(action,params={}){
  return new Promise((res,rej)=>{
    const cb='__kpi'+(++seq)+'_'+Date.now(), s=document.createElement('script');
    const q=new URLSearchParams(Object.assign({action,callback:cb},params));
    const t=setTimeout(()=>{clean();rej(new Error('หมดเวลาเชื่อมต่อ'));},30000);
    function clean(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb]=d=>{ clean(); res(d); };
    s.onerror=()=>{ clean(); rej(new Error('เชื่อมต่อ GAS ไม่ได้')); };
    s.src=GAS_URL+'?'+q.toString(); document.head.appendChild(s);
  });
}
async function apiPost(action,payload){
  const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload))});
  return await r.json();
}
function showMsg(t,cls=''){ $('#msg').innerHTML = t?`<div class="warn ${cls}">${t}</div>`:''; }

/* ===== โหลดข้อมูล (แสดงแคชก่อน แล้วอัปเดต) ===== */
async function load(force){
  if(GAS_URL.indexOf('PASTE_')===0){ showMsg('ยังไม่ได้ตั้งค่า <b>GAS_URL</b> ในไฟล์ kpi.html','err'); $('#sub').textContent=''; return; }
  if(!force){ try{ const c=JSON.parse(localStorage.getItem('kpi_cache')||'null'); if(c&&c.ok){ S.data=c; init(); } }catch(e){} }
  $('#spin').style.display='inline';
  try{
    const d=await api('getAll');
    if(!d.ok) throw new Error(d.error||'โหลดไม่สำเร็จ');
    S.data=d; try{ localStorage.setItem('kpi_cache',JSON.stringify(d)); }catch(e){}
    showMsg(''); init();
    if(S.tab==='LP') await loadLp();
  }catch(e){ showMsg('โหลดข้อมูลไม่สำเร็จ: '+esc(e.message),'err'); }
  $('#spin').style.display='none';
}
function init(){
  const d=S.data, sel=$('#month'); const keep=S.month||QS.get('ym');
  sel.innerHTML=d.months.slice().reverse().map(m=>`<option value="${m}">${monLabel(m)}</option>`).join('');
  // เดือนเริ่มต้น = เดือนล่าสุดที่มีคะแนน
  const withData=d.months.filter(m=>d.summary[m].all!=null);
  S.month = (keep&&d.months.includes(keep))?keep:(withData.length?withData[withData.length-1]:d.months[d.months.length-1]);
  sel.value=S.month;
  $('#sub').textContent=`KPI บริหารจัดการสาขา · คลังสินค้า · บริการลูกค้า · ธุรการ · ${APP_VERSION}`;
  render();
}
function render(){
  const names={CS:'กรอกข้อมูล: แผนกบริการลูกค้า (รายเดือน)',AD:'กรอกข้อมูล: แผนกธุรการสาขา (รายเดือน)',LP:'กรอกข้อมูล: คลังลำพูน (รายวัน)',AB:'กรอกข้อมูล: คลังบางนา แห้ง (AB)',CC:'กรอกข้อมูล: คลังบางนา เย็น (CC)'};
  const nowM=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0'), off=S.month&&S.month!==nowM;
  $('#crumb').innerHTML = S.tab==='sum' ? '' : `<button class="linkbtn" data-t="sum">${I('left')}กลับหน้าสรุป</button>${S.tab==='AB'||S.tab==='CC'?`<span class="ubadge">${S.tab==='AB'?I('sun')+'แห้ง (AB)':I('snow')+'เย็น (CC)'}</span>`:''}<span class="entrybar${off?' off':''}">${names[S.tab].replace('กรอกข้อมูล: ','')} · กำลังกรอกเดือน <b>${S.month?monLabel(S.month):''}</b>${off?' '+I('warn')+'ไม่ใช่เดือนปัจจุบัน':''}</span>${S.tab==='AB'||S.tab==='CC'?`<button class="linkbtn" data-t="${S.tab==='AB'?'CC':'AB'}">${I('swap')}สลับไป ${S.tab==='AB'?'เย็น (CC)':'แห้ง (AB)'}</button>`:''}`;
  document.body.dataset.u=S.tab==='sum'?'':S.tab;
  if(!S.data) return;
  if(S.tab!=='sum'){ const k=kindOf(S.tab);
    if(!S.ok[k]){ if(S.keys[k]&&!S.tried[k]){ S.tried[k]=true; $('#view').innerHTML='<div class="note">กำลังตรวจสอบรหัส…</div>'; unlock(k,S.keys[k],true); return; } gateHtml(k); return; } }
  if(S.tab==='sum') renderSum(); else if(S.tab==='LP') renderLp(); else if(S.tab==='CS'||S.tab==='AD') renderMon(S.tab); else renderBn(S.tab);
}

/* ===== หน้าสรุป (แท็บย่อย: ภาพรวม / ลำพูน / บางนา แห้ง / บางนา เย็น) ===== */
function cfgOf(u){ return S.data.config.filter(c=>c.unit===u).sort((a,b)=>a.no-b.no); }
const GC={A:'#15803d',B:'#1d6fd1',C:'#b7791f',D:'#d9480f',F:'#c92a2a'};
const GL=['A','B','C','D','F'];
const SUBS=[['ov','ภาพรวม'],['LP','คลังลำพูน'],['AB','บางนา แห้ง (AB)'],['CC','บางนา เย็น (CC)'],['CS','บริการลูกค้า'],['AD','ธุรการสาขา']];
function scoreCol(v){ return v==null?'#cbd5e1':v>=3.5?GC.A:v>=2.5?GC.B:v>=1.5?GC.C:v>=0.5?GC.D:GC.F; }
function ring(v,size,sw){
  const r=(size-sw)/2, c=2*Math.PI*r, p=v==null?0:Math.max(0,Math.min(1,v/4)), h=size/2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="คะแนน ${sc2(v)}">
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="${sw}"/>
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${scoreCol(v)}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${h} ${h})"/>
    <text x="${h}" y="${h+size*0.09}" text-anchor="middle" font-size="${size*0.29}" font-weight="700" fill="#111827">${sc2(v)}</text>
    ${size>=120?`<text x="${h}" y="${h+size*0.27}" text-anchor="middle" font-size="${size*0.09}" fill="#6b7280">จาก 4.00</text>`:''}</svg>`;
}
function gcount(kpis){ return GL.map(g=>({g,n:kpis.filter(k=>k.grade===g).length})); }
function gbox(kpis){ return `<div class="gboxes">${gcount(kpis).map(o=>`<div class="gbx ${o.n?'':'z'}"><b style="color:${GC[o.g]}">${o.n}</b><span style="background:${GC[o.g]}">${o.g}</span></div>`).join('')}</div>`; }
function gbar(kpis){ const c=gcount(kpis).filter(o=>o.n); return `<div class="gbar">${c.length?c.map(o=>`<i style="flex:${o.n};background:${GC[o.g]}"></i>`).join(''):''}</div>`; }
function hasData(m,u){ return S.data.summary[m].units[u].n>0; }
function sparkG(get){
  const d=S.data, ms=d.months.filter(m=>m<=S.month&&get(m)!=null).slice(-6);
  if(!ms.length) return '<span class="lbl">ยังไม่มีข้อมูลย้อนหลัง</span>';
  const H=40, bw=20, g=8, W=ms.length*(bw+g)-g;
  return `<svg width="${W}" height="${H+14}" viewBox="0 0 ${W} ${H+14}">${ms.map((m,i)=>{ const v=get(m), hh=Math.max(3,v/4*H), x=i*(bw+g);
    return `<rect x="${x}" y="${H-hh}" width="${bw}" height="${hh}" rx="3" fill="${scoreCol(v)}" opacity="${m===S.month?1:.45}"/><text x="${x+bw/2}" y="${H+12}" text-anchor="middle" font-size="10.5" fill="#6b7280">${TH_MON[+m.slice(5)-1]}</text>`; }).join('')}</svg>`;
}
const unitScore=(m,k)=>k==='AD'?S.data.summary[m].ad:S.data.summary[m].units[k].score;
function spark(u){ return sparkG(m=>unitScore(m,u)); }
function unitWeights(){ const w={}; S.data.groups.forEach(g=>w[g.id]=g.weight); return {LP:w.LP, AB:w.BN*w.AB, CC:w.BN*w.CC, CS:1, AD:1, AD1:w.AD1||.5, AD2:w.AD2||.5}; }
function deptW(id){ const g=S.data.groups.find(x=>x.id===id&&x.parent==='top'); const t=['WH','CS','AD'].reduce((a,k)=>{ const q=S.data.groups.find(x=>x.id===k&&x.parent==='top'); return a+(q?q.weight:1/3); },0); return (g?g.weight:1/3)/t; }

function renderSum(){
  const d=S.data, r=d.summary[S.month]; if(!r){ $('#view').innerHTML=''; return; }
  const nav=`<div class="subnav">${SUBS.map(([k,t])=>`<button data-s="${k}" class="${S.sub===k?'on':''}">${t}</button>`).join('')}</div>`;
  $('#view').innerHTML=nav+(S.sub==='ov'?ovHtml():unitHtml(S.sub));
  if(S.sub==='ov') requestAnimationFrame(drawTrend);
  const ut=document.querySelector('.utable'); if(ut&&S.hist) ut.scrollLeft=ut.scrollWidth;
}
function ovHtml(){
  const d=S.data, m=S.month, r=d.summary[m], ms=d.months, i=ms.indexOf(m), dw=unitWeights();
  let pv=null; for(let j=i-1;j>=0;j--) if(d.summary[ms[j]].all!=null){ pv=ms[j]; break; }
  const delta=(r.all!=null&&pv)?r.all-d.summary[pv].all:null;
  const dl = delta==null?'':`<div class="dl" style="color:${delta>0.004?'var(--gA)':delta<-0.004?'var(--gF)':'var(--mut)'}">${delta>0.004?I('up'):delta<-0.004?I('dn'):I('dot')} ${Math.abs(delta).toFixed(2)} <span class="lbl">จาก ${monLabel(pv)}</span></div>`;
  const lpNote = r.days ? `ลำพูนมีข้อมูลรายวัน ${r.days} วัน (ล่าสุด ${+r.last.slice(8)}/${+r.last.slice(5,7)})` : (r.lpSrc==='monthly'?'ลำพูนใช้ผลรายเดือน':'ลำพูนยังไม่มีข้อมูล');
  const UK=['LP','AB','CC','CS','AD1','AD2'], all=[].concat(...UK.map(k=>r.units[k].kpis));

      <div class="ucs"><div class="lbl">${sub}</div>${sp}</div></div>`;
  const f2=v=>v==null?'–':v.toFixed(2), U=r.units;

  const cs=dcard('CS','CS','แผนกบริการลูกค้า',r.cs,U.CS.kpis,'คะแนน 6 เดือนล่าสุด',sparkG(m=>d.summary[m].cs));
  const ad=dcard('AD','AD','แผนกธุรการสาขา',r.ad,[].concat(U.AD1.kpis,U.AD2.kpis),`ต้นทุน ${f2(U.AD1.score)} · ประสิทธิภาพ ${f2(U.AD2.score)}`,sparkG(m=>d.summary[m].ad));
  // จุดที่ต้องติดตาม
  const ord={F:0,D:1,C:2,B:3}, watch=[]; const short={LP:'ลำพูน',AB:'บางนา AB',CC:'บางนา CC',CS:'บริการลูกค้า',AD1:'ธุรการ',AD2:'ธุรการ'};
  UK.forEach(u=>{ const cf=cfgOf(u); r.units[u].kpis.forEach(k=>{ if(k.grade&&k.grade!=='A') watch.push({u,c:cf.find(x=>x.no===k.no),k}); }); });
  watch.sort((a,b)=>ord[a.k.grade]-ord[b.k.grade]);
  const wl = watch.length ? `<table>${watch.map(w=>`<tr><td class="l" style="width:92px;white-space:nowrap;color:var(--mut)">${short[w.u]}</td><td class="l">${esc(w.c.name.replace(/ สินค้า.*$| จำนวนสินค้า.*$| วันที่ของสินค้า.*$/,''))}</td><td class="v">${fv(w.c,w.k.val)}</td><td>${gb(w.k.grade)}</td></tr>`).join('')}</table>`
    : `<div class="lbl" style="padding:10px">${all.some(k=>k.grade)?'ทุก KPI ที่มีข้อมูลได้เกรด A':'ยังไม่มีข้อมูลเดือนนี้'}</div>`;
  return `<div class="ovroot">
   <div class="hero2">
    <div class="card heroc">${ring(r.all,150,15)}<div class="hinfo"><div class="lbl">คะแนนรวมบริหารจัดการสาขา</div><div class="mo">${monLabel(m)}</div>${dl}<div class="note" style="margin:6px 0 8px">${lpNote}</div>${gbar(all)}<div class="lbl" style="margin-top:4px">สัดส่วนเกรดทุก KPI (${all.filter(k=>k.grade).length} ตัว)</div></div></div>
    ${wh}${cs}${ad}</div>

     <div class="card fillc"><div class="sec" style="margin:0 0 4px">จุดที่ต้องติดตาม · ${monLabel(m)}</div><div class="wlist">${wl}</div></div>

  </div>`;
}
function drawTrend(){
  const el=$('#trend'); if(!el) return; const W=el.clientWidth, H=el.clientHeight; if(W<80||H<80) return;
  const d=S.data, ms=d.months.filter(m=>d.summary[m].all!=null).slice(-12);
  if(!ms.length){ el.innerHTML='<div class="lbl">ยังไม่มีข้อมูลคะแนน</div>'; return; }
  const pl=32, pb=26, pt=20, bw=Math.min(54,(W-pl)/ms.length*.56), y=v=>pt+(H-pt-pb)*(1-v/4);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="แนวโน้มคะแนนรวม">`;
  [0,1,2,3,4].forEach(v=>{ s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#6b7280">${v}</text>`; });
  ms.forEach((m,i)=>{ const v=d.summary[m].all, cx=pl+(W-pl)/ms.length*(i+.5), on=m===S.month;
    s+=`<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(1,y(0)-y(v))}" rx="5" fill="${on?'#0b5cad':'#94a3b8'}"/>
        <text x="${cx}" y="${y(v)-6}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111827">${v.toFixed(2)}</text>
        <text x="${cx}" y="${H-7}" text-anchor="middle" font-size="12" fill="#6b7280">${TH_MON[+m.slice(5)-1]}</text>`; });
  el.innerHTML=s+'</svg>';
}
function unitHtml(u){
  const d=S.data, m=S.month, r=d.summary[m], dw=unitWeights(), ms=d.months, i=ms.indexOf(m);
  const us=u==='AD'?['AD1','AD2']:[u], multi=us.length>1;

  const rowsOf=k=>cfgOf(k).map(c=>`<tr><td>${c.no}</td><td class="l">${esc(c.name)}</td><td>${trim(c.weight*100)}%</td>
     ${['A','B','C','D'].map(q=>`<td class="thr hm">${thr(c,q)}</td>`).join('')}
     ${cols.map((mm,q)=>{ const it=d.summary[mm].units[k].kpis.find(z=>z.no===c.no)||{}; return `<td class="v big ${cl(q)}">${it.miss?'<span class="lbl">ไม่มีข้อมูล</span>':fv(c,it.val)}</td><td class="${cl(q)}">${gb(it.grade)}</td>`; }).join('')}</tr>`).join('');
  const body = multi ? scoreRow('คะแนนรวมธุรการสาขา','AD','100%')+us.map(k=>scoreRow(UNIT_FULL[k],k,trim(dw[k]*100)+'%')+rowsOf(k)).join('')
                     : scoreRow('คะแนนส่วนงาน',u,'100%')+rowsOf(u);
  const parent={LP:'แผนกคลังสินค้า',AB:'แผนกคลังสินค้า',CC:'แผนกคลังสินค้า',CS:'บริหารจัดการสาขา',AD:'บริหารจัดการสาขา'}[u];

  const days = u==='LP' ? `<div class="note" style="margin:0">ข้อมูล: ${cols.map(c=>`${monLabel(c)} ${d.summary[c].days>0?d.summary[c].days+' วันที่กรอก':(d.summary[c].lpSrc==='monthly'?'ผลรายเดือน':'–')}`).join(' · ')} — ถ้าข้อมูลรายวันไม่ครบทั้งเดือน ผลลัพธ์เป็นของช่วงที่มีข้อมูล</div>`
    : (u==='CS'||u==='AD') ? `<div class="note" style="margin:0">กรอกผลรายเดือนที่เมนู "กรอกข้อมูล" · เดือนที่ปิดแล้ว ข้อที่ไม่มีข้อมูลนับเป็นเกรด F (ตามวิธีคิดเดิมของ Excel) ตั้งค่าได้ที่ชีต KPI_Settings (MISSING_F_UNITS)</div>` : '';
  return `<div class="uroot">

const LPF={1:['Stock จริง ÷ Stock ระบบ',(g,i)=>[g[1][i],g[0][i]]],2:['(ระบบ − วันที่ไม่ตรง) ÷ ระบบ',(g,i)=>[g[0][i]-g[2][i],g[0][i],g[2][i]]],

 5:['รถตรงเวลา ÷ รถทั้งหมด',(g,i)=>[g[8][i],g[7][i]]],6:['POD ÷ บิล',(g,i)=>[g[6][i],g[5][i]]],7:['GRB ÷ กล่องทุกขนส่ง',(g,i)=>[g[11][i],g[3][i]]]};
const LPR={1:[1,0],2:[0,2,0],3:[9,1],4:[10,4],5:[8,7],6:[6,5],7:[11,3]};
function refreshLp(){
  const g=S.lp.grid, n=g[0].length;
  const num=v=>(v!==''&&v!=null&&isFinite(+v)); const pf=(v,c)=>(v*100).toFixed(Math.max(2,c.dec||2))+'%';
  const sm=r=>{ let s=0,a=false; g[r].forEach(v=>{ if(num(v)){ s+=+v; a=true; } }); return a?s:null; };
  cfgOf('LP').filter(c=>c.no>=1&&c.no<=7).forEach(c=>{ const k=c.no, R=LPR[k];
    for(let i=0;i<n;i++){ const el=$(`#cp${k}_${i}`); if(!el)continue; const v=k===2?(num(g[0][i])&&num(g[2][i])&&+g[0][i]>0?(g[0][i]-g[2][i])/g[0][i]:null)
        :(num(g[R[0]][i])&&num(g[R[1]][i])&&+g[R[1]][i]>0?+g[R[0]][i]/+g[R[1]][i]:null);
      el.textContent=v==null?'':pf(v,c); const gr=v==null?null:gradeOf(c,v); el.style.color=gr?GC[gr]:''; el.style.fontWeight=gr==='D'||gr==='F'?'700':''; }
    const s=R.map(sm); let v=null; if(k===2){ if(s[0]!=null&&s[1]!=null&&s[0]>0) v=(s[0]-s[1])/s[0]; } else if(s[0]!=null&&s[1]!=null&&s[1]>0) v=s[0]/s[1];
    const t=$('#cpt'+k); if(t) t.innerHTML=v==null?'':`<b>${pf(v,c)}</b> ${gb(gradeOf(c,v))}`; });
  g.forEach((row,r)=>{ const el=$('#tot'+r); if(!el)return; let s=0,any=false; row.forEach(v=>{ if(v!==''&&isFinite(+v)){s+=+v;any=true;} }); el.textContent=any?s.toLocaleString('th-TH'):''; });
  for(let c=0;c<n;c++){ const a=+g[0][c], b=+g[1][c], hs=g[0][c]!==''&&g[1][c]!=='';
    const bad = hs && a>0 && (Math.abs(a-b)/a>0.001 || b<0);
    const td=document.querySelector(`#lpt td[data-c="1_${c}"]`); if(td) td.classList.toggle('bad',!!bad); }
}

/* ===== วาง/ส่งออก Excel ===== */
function parsePaste(txt){
  let rows=txt.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(x=>x.split('\t'));
  const isNum=s=>{ s=s.replace(/,/g,'').replace(/%$/,'').trim(); return s!==''&&isFinite(+s); };
  // ตัดแถวหัววัน (1,2,3,...) และคอลัมน์ชื่อรายการที่ติดมาด้วย
  rows=rows.filter(r=>{ const v=r.filter(isNum).map(x=>+x.replace(/,/g,'')); return !(v.length>=5&&v.every((x,i)=>x===i+1)); });
  const lab=rows.filter(r=>r.length>1&&r[0].trim()!==''&&!isNum(r[0])).length;
  if(rows.length&&lab>=rows.filter(r=>r.length>1).length/2&&lab>0) rows=rows.map(r=>r.length>1?r.slice(1):r);
  return rows;
}
function tableMatrix(sel){
  const t=document.querySelector(sel); if(!t) return [];
  return Array.from(t.querySelectorAll('tr:not(.calc)')).map(tr=>Array.from(tr.children).filter(c=>!c.classList.contains('tot')&&!/รวม/.test(c.tagName==='TH'?c.textContent:'')).map(c=>{
    const i=c.querySelector('input'); if(i) return i.value===''?'':(isFinite(+i.value)?+i.value:i.value);
    if(c.tagName==='TH'){ const s=c.childNodes[0]?c.childNodes[0].textContent.trim():''; return isFinite(+s)&&s!==''?+s:s; }
    return (c.childNodes[0]?c.childNodes[0].textContent:c.textContent).trim(); }));
}

/* ===== คลังบางนา AB / CC: กรอกรายวันตามหัวข้อ ===== */
const BN_TOPICS={AB:['qty','batch','dmg','ontime','other'],CC:['qty','batch','temp','dmg','ontime','other']};
const BN_TLABEL={qty:'Accuracy Qty',batch:'Accuracy Batch',dmg:'Damage / Lost',ontime:'Ontime Delivery',temp:'อุณหภูมิ',other:'Space / Accident / รายเดือน'};
const BN_BLK={qty:['ระบบรวม','นับจริง'],batch:['ระบบรวม','นับจริง'],dmg:['ระบบรวม','เสียหาย / สูญหาย'],ontime:['ระบบรวม (จำนวนจัดส่ง)','จัดส่งตรงเวลา']};
S.bt='qty'; S.bn=null;
function topicCfg(u,t){ const m=S.data.bnTopic[u]; const no=Object.keys(m).find(k=>m[k]===t); return cfgOf(u).find(c=>c.no===+no); }
const numOrNull=x=>(x===''||x==null||!isFinite(+x))?null:+x;
async function loadBn(){
  const u=S.tab, t=S.bt, m=S.month; if(t==='other') return;
  try{
    const d=await api('getBn',{month:m,unit:u,topic:t}); if(!d.ok) throw new Error(d.error||'โหลดไม่สำเร็จ');
    if(S.tab!==u||S.bt!==t||S.month!==m) return;
    const n=dim(m);
    if(t==='temp'){
      const g=[0,1,2].map(()=>Array(n).fill(''));
      Object.keys(d.days).forEach(day=>{ if(+day<=n) d.days[day].forEach((v,r)=>{ if(v!=null) g[r][day-1]=String(v); }); });
      S.bn={unit:u,topic:t,month:m,g};
    }else{
      const cs=S.data.customers[u], A=cs.map(()=>Array(n).fill('')), B=cs.map(()=>Array(n).fill(''));
      Object.keys(d.days).forEach(day=>{ if(+day>n)return; Object.keys(d.days[day]).forEach(ci=>{
        const pi=cs.findIndex(c=>c.idx===+ci); if(pi<0)return; const ab=d.days[day][ci];
        if(ab[0]!=null) A[pi][day-1]=String(ab[0]); if(ab[1]!=null) B[pi][day-1]=String(ab[1]); }); });
      S.bn={unit:u,topic:t,month:m,A,B};
    }
    S.lpDirty=false; showMsg('');
  }catch(e){ showMsg('โหลดข้อมูลรายวันไม่สำเร็จ: '+esc(e.message),'err'); return; }
  renderBn(u);
}
function dayHead(m,n){ const [y,mo]=m.split('-').map(Number); let h='';
  for(let i=1;i<=n;i++){ const w=new Date(y,mo-1,i).getDay(); h+=`<th class="${(w===0||w===6)?'we':''}">${i}<br><span style="font-weight:400;font-size:11px">${TH_DOW[w]}</span></th>`; } return h; }
/* ===== Excel-like grid: เลือกหลายช่อง · คัดลอก/วาง · ลากเติม · Delete · Ctrl+D/R · ลูกศร ===== */
function xlGrid(t){
  if(!t||t._xl)return; t._xl=1;
  const wrap=t.closest('.grid'); wrap.style.position='relative';
  const box=document.createElement('div'); box.className='xlbox'; box.style.display='none';
  const hd=document.createElement('div'); hd.className='xlfill'; box.appendChild(hd); wrap.appendChild(box);
  let A=null,F=null,drag=0,fillEnd=null;           // A=จุดเริ่ม  F=จุดปลายของช่วงที่เลือก  [r,c]
  const cells=()=>{ const m=[]; t.querySelectorAll('tbody tr').forEach((tr,r)=>{ const row=[]; tr.querySelectorAll('td').forEach(td=>{ const i=td.querySelector('input'); if(i)row.push(i); });
      if(row.length)m.push(row); }); return m; };
  let M=cells();
  const pos=inp=>{ for(let r=0;r<M.length;r++){ const c=M[r].indexOf(inp); if(c>=0)return [r,c]; } return null; };
  const rect=()=>{ if(!A)return null; const F2=F||A; return {r1:Math.min(A[0],F2[0]),r2:Math.max(A[0],F2[0]),c1:Math.min(A[1],F2[1]),c2:Math.max(A[1],F2[1])}; };
  const multi=()=>{ const q=rect(); return q&&(q.r2>q.r1||q.c2>q.c1); };
  const norm=s=>{ s=String(s).replace(/,/g,'').replace(/%$/,'').trim(); return (s!==''&&isFinite(+s))?s:''; };
  const setv=(r,c,v)=>{ const inp=M[r]&&M[r][c]; if(!inp)return; v=norm(v); if(inp.value===v)return; inp.value=v; inp.dispatchEvent(new Event('input',{bubbles:true})); };
  function draw(){ const q=rect(); t.querySelectorAll('td.xsel').forEach(x=>x.classList.remove('xsel'));
    if(!q||!multi()){ box.style.display='none'; return; }
    for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++){ const inp=M[r]&&M[r][c]; if(inp)inp.parentNode.classList.add('xsel'); }
    const a=M[q.r1][q.c1].parentNode.getBoundingClientRect(), b=M[q.r2][q.c2].parentNode.getBoundingClientRect(), w=wrap.getBoundingClientRect();
    box.style.display='block'; box.style.left=(a.left-w.left+wrap.scrollLeft)+'px'; box.style.top=(a.top-w.top+wrap.scrollTop)+'px';
    box.style.width=(b.right-a.left)+'px'; box.style.height=(b.bottom-a.top)+'px'; }
  function setRange(a,f){ A=a; F=f; draw(); }
  function clear(){ A=null;F=null; draw(); }
  function focusCell(r,c,extend){ r=Math.max(0,Math.min(M.length-1,r)); c=Math.max(0,Math.min(M[r].length-1,c)); const inp=M[r][c];
    if(extend){ F=[r,c]; draw(); inp.scrollIntoView({block:'nearest',inline:'nearest'}); return; }
    inp.focus(); inp.select(); setRange([r,c],null); inp.scrollIntoView({block:'nearest',inline:'nearest'}); }
  const tsv=q=>{ const o=[]; for(let r=q.r1;r<=q.r2;r++){ const row=[]; for(let c=q.c1;c<=q.c2;c++)row.push(M[r][c]?M[r][c].value:''); o.push(row.join('\t')); } return o.join('\n'); };
  // --- เมาส์: คลิก/ลากเลือกช่วง
  t.addEventListener('mousedown',e=>{ if(e.target===hd)return; const inp=e.target.closest('td input'); M=cells(); if(!inp)return; const p=pos(inp); if(!p)return;
    if(e.shiftKey&&A){ e.preventDefault(); F=p; draw(); return; }
    A=p; F=null; drag=1; draw(); });
  t.addEventListener('mouseover',e=>{ if(!drag)return; const inp=e.target.closest('td input'); if(!inp)return; const p=pos(inp); if(!p)return;
    if(!F&&p[0]===A[0]&&p[1]===A[1])return; F=p; t.classList.add('xldrag'); const sel=window.getSelection&&window.getSelection(); if(sel)sel.removeAllRanges(); draw(); });
  document.addEventListener('mouseup',()=>{ drag=0; t.classList.remove('xldrag'); if(fillEnd)endFill(); });
  // --- ที่จับลากเติม (มุมขวาล่าง)
  hd.addEventListener('mousedown',e=>{ e.preventDefault(); e.stopPropagation(); fillEnd=rect()?[rect().r2,rect().c2]:null; if(!fillEnd)return; t.classList.add('xldrag'); });
  t.addEventListener('mouseover',e=>{ if(!fillEnd)return; const inp=e.target.closest('td input'); if(!inp)return; const p=pos(inp); if(!p)return;
    const q=rect(); const dr=p[0]>q.r2?p[0]-q.r2:0, dc=p[1]>q.c2?p[1]-q.c2:0; fillEnd=dr>=dc?[p[0],q.c2]:[q.r2,p[1]];
    draw(); const a=M[q.r1][q.c1].parentNode.getBoundingClientRect(), b=M[fillEnd[0]][fillEnd[1]].parentNode.getBoundingClientRect(), w=wrap.getBoundingClientRect();
    box.style.display='block'; box.style.width=(b.right-a.left)+'px'; box.style.height=(b.bottom-a.top)+'px'; box.classList.add('xlfilling'); });
  function endFill(){ const q=rect(), e2=fillEnd; fillEnd=null; box.classList.remove('xlfilling'); t.classList.remove('xldrag'); if(!q||!e2){ draw(); return; }
    const h=q.r2-q.r1+1, w=q.c2-q.c1+1; const src=[]; for(let r=q.r1;r<=q.r2;r++){ src.push([]); for(let c=q.c1;c<=q.c2;c++)src[src.length-1].push(M[r][c]?M[r][c].value:''); }
    for(let r=q.r1;r<=e2[0];r++)for(let c=q.c1;c<=e2[1];c++){ if(r<=q.r2&&c<=q.c2)continue; setv(r,c,src[(r-q.r1)%h][(c-q.c1)%w]); }
    A=[q.r1,q.c1]; F=[Math.max(q.r2,e2[0]),Math.max(q.c2,e2[1])]; draw(); }
  // --- คัดลอก / ตัด
  t.addEventListener('copy',e=>{ const q=rect(); if(!q||!multi())return; e.preventDefault(); e.clipboardData.setData('text/plain',tsv(q)); toast&&toast('คัดลอก '+(q.r2-q.r1+1)*(q.c2-q.c1+1)+' ช่อง'); });
  t.addEventListener('cut',e=>{ const q=rect(); if(!q||!multi())return; e.preventDefault(); e.clipboardData.setData('text/plain',tsv(q));
    for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)setv(r,c,''); });
  // --- วาง (capture: แทนตัวเดิมเมื่อวางหลายช่อง / เติมทั้งช่วง)
  t.addEventListener('paste',e=>{ const inp=e.target.closest('td input'); if(!inp)return; M=cells(); const p=pos(inp); if(!p)return;
    const txt=(e.clipboardData||window.clipboardData).getData('text'); const q=(rect()&&multi())?rect():{r1:p[0],c1:p[1],r2:p[0],c2:p[1]};
    const single=!/[\t\n]/.test(txt.replace(/\n+$/,'')); if(single&&!multi())return;   // ช่องเดียว = ให้ปกติ
    e.preventDefault(); e.stopPropagation();
    if(single){ for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)setv(r,c,txt.trim()); setRange([q.r1,q.c1],[q.r2,q.c2]); return; }
    const rows=parsePaste(txt); let mr=0,mc=0;
    rows.forEach((row,ri)=>row.forEach((cell,ci)=>{ const r=q.r1+ri,c=q.c1+ci; if(r>=M.length||c>=M[r].length)return; setv(r,c,cell); mr=Math.max(mr,ri); mc=Math.max(mc,ci); }));
    setRange([q.r1,q.c1],[Math.min(M.length-1,q.r1+mr),Math.min(M[q.r1].length-1,q.c1+mc)]);
    const st=document.getElementById('st'); if(st)st.textContent='วางข้อมูลแล้ว · ตรวจแล้วกดบันทึก'; },true);
  // --- คีย์บอร์ด
  t.addEventListener('keydown',e=>{ const inp=e.target.closest('td input'); if(!inp)return; M=cells(); const p=pos(inp); if(!p)return; if(!A)A=p;
    const cur=F||A, k=e.key, mod=e.ctrlKey||e.metaKey;
    if(mod&&(k==='d'||k==='D'||k==='r'||k==='R')){ e.preventDefault(); const q=rect()||{r1:p[0],r2:p[0],c1:p[1],c2:p[1]}; const down=(k==='d'||k==='D');
      for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++){ if(down&&r>q.r1)setv(r,c,M[q.r1][c].value); if(!down&&c>q.c1)setv(r,c,M[r][q.c1].value); } return; }
    if(mod&&(k==='a'||k==='A')){ if(inp.selectionStart===0&&inp.selectionEnd===inp.value.length||true){ e.preventDefault(); setRange([0,0],[M.length-1,M[0].length-1]); } return; }
    if((k==='Delete'||k==='Backspace')&&multi()){ e.preventDefault(); const q=rect(); for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)setv(r,c,''); return; }
    if(k==='Escape'){ if(multi()){ setRange(p,null); } return; }
    const nav={ArrowUp:[-1,0],ArrowDown:[1,0],Enter:[e.shiftKey?-1:1,0]}[k];
    if(nav&&!mod){ e.preventDefault(); if(e.shiftKey&&k!=='Enter'){ focusCell(cur[0]+nav[0],cur[1]+nav[1],true); } else focusCell(p[0]+nav[0],p[1]+nav[1]); return; }
    if((k==='ArrowLeft'||k==='ArrowRight')&&!mod){ const d=k==='ArrowLeft'?-1:1, s0=inp.selectionStart, s1=inp.selectionEnd;
      const edge=(d<0&&s0===0)||(d>0&&s1===inp.value.length);
      if(e.shiftKey&&(multi()||edge)){ e.preventDefault(); focusCell(cur[0],cur[1]+d,true); }
      else if(!e.shiftKey&&(edge||multi())){ e.preventDefault(); focusCell(p[0],p[1]+d); } } });
  t.addEventListener('focusin',e=>{ if(drag||fillEnd)return; const inp=e.target.closest('td input'); if(!inp)return; M=cells(); const p=pos(inp); if(!p)return; const q=rect();
    if(!q||!multi()||p[0]<q.r1||p[0]>q.r2||p[1]<q.c1||p[1]>q.c2) setRange(p,null); });
  document.addEventListener('mousedown',e=>{ if(!t.isConnected){ return; } if(!wrap.contains(e.target)&&!e.target.closest('#xlsBtn,#cpBtn'))clear(); });
  wrap.addEventListener('scroll',draw);
  window.addEventListener('resize',draw);
}

function isWe(m,i){ const [y,mo]=m.split('-').map(Number); const w=new Date(y,mo-1,i).getDay(); return w===0||w===6; }

function updTemp(){
  const g=S.bn.g, c=topicCfg(S.bn.unit,'temp'), st=S.data.settings, std=[st.TEMP_ANTI,st.TEMP_CHILLED,st.TEMP_FROZEN], n=g[0].length; let chk=0,ok=0;

    if(v.every(x=>x!==null)){ chk++; const pass=v.every((x,k)=>Math.abs(x-std[k])<=st.TEMP_TOL); if(pass)ok++; el.innerHTML=pass?'<span class="ok">'+I('ok')+'</span>':'<span class="ko">'+I('no')+'</span>'; }
    else el.textContent=''; 
    g.forEach((r,k)=>{ const td=document.querySelector(`#bnt td[data-k="${k}_${i}"]`); const x=numOrNull(r[i]); if(td) td.classList.toggle('bad',x!==null&&Math.abs(x-std[k])>st.TEMP_TOL); }); }
  const v=chk?ok/chk:null; $('#bnv').textContent=fv(c,v); $('#bng').innerHTML=gb(gradeOf(c,v)); $('#bns').textContent=chk?`ผ่าน ${ok} วัน จากที่ตรวจ ${chk} วัน`:'ยังไม่มีข้อมูล';
  $('#pall').textContent=chk?`${ok}/${chk}`:'';

function bindGrid(u){
  xlGrid($('#bnt'));
  const t=$('#bnt'), g=S.bn, isT=g.topic==='temp', n=dim(S.month), upd=isT?updTemp:updBn;
  t.addEventListener('input',e=>{ const i=e.target; if(i.dataset.d==null)return;
    if(isT) g.g[+i.dataset.r][+i.dataset.d]=i.value.trim(); else g[i.dataset.b][+i.dataset.c][+i.dataset.d]=i.value.trim();
    S.lpDirty=true; upd(); $('#st').textContent='มีการแก้ไขที่ยังไม่บันทึก'; });
  t.addEventListener('paste',e=>{ const i=e.target; if(i.dataset.d==null)return; const txt=(e.clipboardData||window.clipboardData).getData('text'); if(!/[\t\n]/.test(txt))return;
    e.preventDefault(); const rows=parsePaste(txt); const c0=+i.dataset.d;
    const arr=isT?g.g:g[i.dataset.b], r0=+(isT?i.dataset.r:i.dataset.c);
    rows.forEach((row,ri)=>row.forEach((cell,ci)=>{ const r=r0+ri,c=c0+ci; if(r>=arr.length||c>=n)return;
      const s=cell.replace(/,/g,'').trim(); arr[r][c]=(s!==''&&isFinite(+s))?s:'';
      const sel=isT?`input[data-r="${r}"][data-d="${c}"]`:`input[data-b="${i.dataset.b}"][data-c="${r}"][data-d="${c}"]`; const inp=t.querySelector(sel); if(inp)inp.value=arr[r][c]; }));
    S.lpDirty=true; upd(); $('#st').textContent='วางข้อมูลแล้ว · ตรวจแล้วกดบันทึก'; });
  $('#saveBn').onclick=saveBn; upd();
}
async function saveBn(){
  if(!confirmSave('ข้อมูลคลังบางนา '+(S.bn.unit==='AB'?'แห้ง (AB)':'เย็น (CC)')+' · '+(BN_TLABEL[S.bn.topic]||S.bn.topic)))return;
  const g=S.bn, n=dim(S.month), data={};
  if(g.topic==='temp'){ for(let i=0;i<n;i++){ const v=g.g.map(r=>numOrNull(r[i])); if(v.some(x=>x!==null)) data[i+1]=v; } }
  else S.data.customers[g.unit].forEach((cu,pi)=>{ for(let i=0;i<n;i++){ const a=numOrNull(g.A[pi][i]), b=numOrNull(g.B[pi][i]); if(a!==null||b!==null) (data[i+1]=data[i+1]||{})[cu.idx]=[a,b]; } });
  const btn=$('#saveBn'); btn.disabled=true; $('#st').textContent='กำลังบันทึก…';
  try{ const r=await apiPost('saveBn',{month:S.month,unit:g.unit,topic:g.topic,key:getKey('bn'),data});
    if(!r.ok) throw new Error(r.error); S.lpDirty=false; S.bn=null; toast('บันทึกแล้ว '+r.saved+' รายการ'); await load(true); }
  catch(e){ if(relock(S.tab==='LP'?'lp':'bn',e.message))return; $('#st').innerHTML='<span class="ko">บันทึกไม่สำเร็จ: '+esc(e.message)+'</span>'; btn.disabled=false; }
}
/* รายเดือน: Space utilization / Accident และยอดรวมแทนรายวัน */
function bnRows(list,u){ const cur=(S.data.monthly[S.month]&&S.data.monthly[S.month][u])||{};
  return list.map(c=>{ const v=cur[c.no]; const shown=v==null?'':(c.fmt==='cnt'?v:+(v*100).toFixed(6));
    return `<tr><td>${c.no}</td><td class="l">${esc(c.name)}</td><td>${trim(c.weight*100)}%</td>${['A','B','C','D'].map(k=>`<td class="thr hm">${thr(c,k)}</td>`).join('')}
      <td class="in"><input inputmode="decimal" data-no="${c.no}" value="${shown}" placeholder="${c.fmt==='cnt'?'ครั้ง':'%'}"></td><td id="g${c.no}">${gb(gradeOf(c,v))}</td></tr>`; }).join(''); }
function bnOtherHtml(u){
  const map=S.data.bnTopic[u], cf=cfgOf(u), others=cf.filter(c=>!map[c.no]), tops=cf.filter(c=>map[c.no]);
  const tbl=l=>`<div class="tw form"><table><tr><th>No</th><th class="l">KPI</th><th>น้ำหนัก</th><th class="hm">A</th><th class="hm">B</th><th class="hm">C</th><th class="hm">D</th><th>ผลงานเดือนนี้</th><th>เกรด</th></tr>${bnRows(l,u)}</table></div>`;
  return `<div class="note" style="margin-top:0">กรอกผลของเดือน ${monLabel(S.month)} สำหรับหัวข้อที่ไม่ได้บันทึกรายวัน (หน่วย % ยกเว้น Accident = จำนวนครั้ง)</div>${tbl(others)}
   <details style="margin:14px 0"><summary style="cursor:pointer;font-weight:600">กรอกยอดรวมรายเดือนแทนรายวัน (ใช้กับเดือนย้อนหลังที่ไม่มีข้อมูลรายวัน)</summary>
   <div class="note">ถ้าเดือนนั้นมีข้อมูลรายวันแล้ว ระบบใช้ข้อมูลรายวันแทนค่าที่กรอกตรงนี้</div>${tbl(tops)}</details>${saveBar()}`;
}
function bindOther(u){
  const cf=cfgOf(u);
  document.querySelectorAll('.form input').forEach(i=>i.addEventListener('input',()=>{ const c=cf.find(x=>x.no===+i.dataset.no), t=i.value.trim(); const v=t===''||!isFinite(+t)?null:(c.fmt==='cnt'?+t:+t/100); const el=$('#g'+c.no); if(el) el.innerHTML=gb(gradeOf(c,v)); S.lpDirty=true; $('#st').textContent='มีการแก้ไขที่ยังไม่บันทึก'; }));
  $('#saveBn').onclick=async()=>{
    if(!confirmSave('ข้อมูลรายเดือนคลังบางนา '+(u==='AB'?'แห้ง (AB)':'เย็น (CC)')))return;
    const data={}; document.querySelectorAll('.form input').forEach(i=>{ const c=cf.find(x=>x.no===+i.dataset.no), t=i.value.trim(); data[c.no]=t===''?'':(isFinite(+t)?(c.fmt==='cnt'?+t:+t/100):''); });
    const b=$('#saveBn'); b.disabled=true; $('#st').textContent='กำลังบันทึก…';
    try{ const r=await apiPost('saveMonthly',{month:S.month,unit:u,key:getKey('bn'),data}); if(!r.ok) throw new Error(r.error); S.lpDirty=false; toast('บันทึกแล้ว'); await load(true); }
    catch(e){ if(relock(S.tab==='LP'?'lp':'bn',e.message))return; $('#st').innerHTML='<span class="ko">บันทึกไม่สำเร็จ: '+esc(e.message)+'</span>'; b.disabled=false; } };
}

/* ===== events ===== */
function goTab(t){
  if(S.lpDirty&&!confirm('มีข้อมูลที่ยังไม่บันทึก ต้องการออกจากหน้านี้หรือไม่?'))return;
  S.tab=t; S.lpDirty=false; S.bn=null; if(t==='AB'||t==='CC') S.bt=BN_TOPICS[t][0]; render(); window.scrollTo(0,0); }
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-t]'); const pop=$('#entryMenu');
  if(b){ pop.hidden=true; $('#entryBtn').setAttribute('aria-expanded','false'); goTab(b.dataset.t); return; }
  if(e.target.closest('#entryBtn')){ pop.hidden=!pop.hidden; $('#entryBtn').setAttribute('aria-expanded',String(!pop.hidden)); return; }
  if(!e.target.closest('#entryMenu')) pop.hidden=true; });
$('#month').addEventListener('change',e=>{
  if(S.lpDirty&&!confirm('มีข้อมูลที่ยังไม่บันทึก ต้องการเปลี่ยนเดือนหรือไม่?')){ e.target.value=S.month; return; }
  S.month=e.target.value; S.lpDirty=false; render(); });
$('#view').addEventListener('click',e=>{
  const tb=e.target.closest('[data-bt]');
  if(tb&&(S.tab==='AB'||S.tab==='CC')){ if(S.lpDirty&&!confirm('มีข้อมูลที่ยังไม่บันทึก ต้องการเปลี่ยนหัวข้อหรือไม่?'))return; S.bt=tb.dataset.bt; S.bn=null; S.lpDirty=false; renderBn(S.tab); return; } const b=e.target.closest('.subnav button'); const c=e.target.closest('[data-go]');
  if(e.target.closest('[data-hist]')){ S.hist=!S.hist; renderSum(); return; }
  const k=b?b.dataset.s:(c?c.dataset.go:null); if(k&&S.tab==='sum'){ S.sub=k; renderSum(); } });
$('#reload').onclick=()=>load(true);
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(S.tab==='sum'&&S.sub==='ov') drawTrend(); },150); });
window.addEventListener('beforeunload',e=>{ if(S.lpDirty){ e.preventDefault(); e.returnValue=''; } });
load(false);
</script>
